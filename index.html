<!DOCTYPE html><html lang="ta"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ERAVUR EGG ULTIMATE RECOVER</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#f4f7f2]">
<div id="loginScreen" class="fixed inset-0 bg-[#0a5c26] z-[100] flex items-center justify-center p-5"><div class="bg-white w-full max-w-sm rounded-[24px] p-6 text-center"><div class="text-5xl">🥚</div><h1 class="font-bold text-[#0a5c26]">DATABASE RECOVER</h1><p class="text-[9px] mb-3">Oddamavadi & Chenkalady மீட்பு</p><input id="lu" class="w-full border-2 rounded-xl p-3 mb-2 text-sm" value="eravur"><input id="lp" type="password" class="w-full border-2 rounded-xl p-3 mb-3 text-sm" value="1234"><button onclick="doLogin()" class="w-full bg-[#0a5c26] text-white py-3 rounded-xl font-bold">Login & Auto Recover</button></div></div>
<div id="app" class="hidden pb-[100px]"><div class="bg-[#0a5c26] text-white p-4 sticky top-0 z-50"><div class="flex justify-between"><h1 class="font-bold text-[11px]">🥚 ULTIMATE RECOVER - Per Customer Sheet</h1><button onclick="logout()" class="bg-white/20 px-3 py-1 rounded-full text-xs">Logout</button></div><input id="search" oninput="render()" placeholder="தேடு..." class="w-full mt-3 px-4 py-2.5 rounded-full text-black text-sm outline-none"></div>
<div id="recoverBanner" class="hidden m-3 p-3 bg-yellow-100 border-2 border-yellow-400 rounded-xl text-xs"></div>
<div class="flex gap-2 p-3 overflow-x-auto flex-wrap"><button onclick="setA('ALL')" id="t-ALL" class="bg-[#0a5c26] text-white px-4 py-2 rounded-full text-xs font-bold">ALL</button><button onclick="setA('Oddamavadi')" id="t-Oddamavadi" class="bg-white border px-4 py-2 rounded-full text-xs font-bold">Oddamavadi</button><button onclick="setA('Chenkalady')" id="t-Chenkalady" class="bg-white border px-4 py-2 rounded-full text-xs font-bold">Chenkalady</button><button onclick="setA('Eravur')" id="t-Eravur" class="bg-white border px-4 py-2 rounded-full text-xs font-bold">Eravur</button><button onclick="openAdd()" class="bg-yellow-400 text-black px-4 py-2 rounded-full text-xs font-bold">+ New</button><button onclick="autoRecover()" class="bg-red-600 text-white px-4 py-2 rounded-full text-xs font-bold animate-pulse">♻️ RECOVER NOW</button><button onclick="openAllReports()" class="bg-blue-600 text-white px-4 py-2 rounded-full text-xs font-bold">📊 All Reports</button></div>
<div id="list" class="px-3 space-y-3"></div>
<div class="fixed bottom-0 left-0 right-0 bg-white border-t p-2 flex justify-around text-center"><div><div class="text-[8px]">OLD மீதி</div><div id="totOld" class="font-bold text-orange-600 text-xs">Rs.0</div></div><div><div class="text-[8px]">SALE மீதி</div><div id="totSale" class="font-bold text-green-600 text-xs">Rs.0</div></div><div><div class="text-[8px]">மொத்தம்</div><div id="tot" class="font-bold text-red-600 text-sm">Rs.0</div></div><button onclick="downloadAllExcel()" class="bg-green-600 text-white px-3 py-2 rounded-full text-xs font-bold">Excel</button></div></div>

<div id="editM" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-end justify-center"><div class="bg-white w-full rounded-t-[24px] p-5"><h3 class="font-bold mb-2">✏️ Edit</h3><input id="eName" class="w-full border-2 rounded-xl p-3 mb-2 text-sm"><select id="eArea" class="w-full border-2 rounded-xl p-3 mb-2 text-sm"><option>Oddamavadi</option><option>Chenkalady</option><option>Eravur</option></select><input id="ePhone" class="w-full border-2 rounded-xl p-3 mb-2 text-sm"><input id="eOld" type="number" class="w-full border-2 rounded-xl p-3 mb-3 font-bold"><div class="flex gap-2"><button onclick="document.getElementById('editM').classList.add('hidden')" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="saveEdit()" class="flex-1 bg-[#0a5c26] text-white py-3 rounded-xl font-bold">Save</button></div></div></div>
<div id="addM" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4"><div class="bg-white w-full max-w-sm rounded-[24px] p-5"><h3 class="font-bold mb-3">+ New Customer</h3><input id="aName" placeholder="பெயர்" class="w-full border-2 rounded-xl p-3 mb-2 text-sm"><select id="aArea" class="w-full border-2 rounded-xl p-3 mb-2 text-sm"><option>Oddamavadi</option><option>Chenkalady</option><option selected>Eravur</option></select><input id="aPhone" placeholder="Phone" class="w-full border-2 rounded-xl p-3 mb-2 text-sm"><input id="aOld" type="number" placeholder="Old Balance" class="w-full border-2 rounded-xl p-3 mb-3 text-sm"><div class="flex gap-2"><button onclick="document.getElementById('addM').classList.add('hidden')" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="doAdd()" class="flex-1 bg-yellow-400 py-3 rounded-xl font-bold">Add</button></div></div></div>
<div id="saleM" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-end justify-center"><div class="bg-white w-full rounded-t-[24px] p-5 max-h-[90vh] overflow-y-auto"><div class="flex justify-between mb-2"><h3 id="sTitle" class="font-bold text-sm"></h3></div><label class="text-xs font-bold">📅 Sale Date Edit</label><input id="sDate" type="date" class="w-full border-2 border-blue-300 bg-blue-50 rounded-xl p-3 mb-3 text-sm font-bold"><div id="sInputs" class="space-y-2"></div><div class="mt-3 p-3 bg-green-50 border-2 border-dashed rounded-xl text-center"><div class="text-xs">Sale: <b id="sToday">0</b> | Sale மீதி: <b id="sGrand">0</b></div><div id="sDet" class="text-[10px]"></div></div><div class="flex gap-2 mt-3"><button onclick="document.getElementById('saleM').classList.add('hidden')" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="doSale()" class="flex-1 bg-[#0a5c26] text-white py-3 rounded-xl font-bold">Sale Add</button></div></div></div>
<div id="payM" class="hidden fixed inset-0 bg-black/50 z-[70] flex items-center justify-center p-4"><div class="bg-white w-full max-w-sm rounded-[24px] p-5"><h3 id="pTitle" class="font-bold mb-2"></h3><label class="text-xs font-bold">📅 Paid Date</label><input id="pDate" type="date" class="w-full border-2 rounded-xl p-2 mb-2 text-sm"><div id="pCalc" class="bg-gray-50 p-3 rounded-xl text-xs mb-3"></div><div class="grid grid-cols-2 gap-2 mb-3"><button id="payOldBtn" onclick="setPayType('old')" class="border-2 py-3 rounded-xl font-bold text-xs">📦 OLD க்கு</button><button id="paySaleBtn" onclick="setPayType('sale')" class="border-2 py-3 rounded-xl font-bold text-xs">🥚 SALE க்கு</button></div><input id="pAmt" type="number" class="w-full border-2 rounded-xl p-3 mb-3 font-bold text-lg" placeholder="Amount"><div id="pPreview" class="text-xs bg-blue-50 p-2 rounded-xl mb-3 hidden"></div><div class="flex gap-2"><button onclick="document.getElementById('payM').classList.add('hidden')" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="doPay()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold">Paid கழி</button></div></div></div>
<div id="repM" class="hidden fixed inset-0 bg-white z-[70] overflow-y-auto"><div class="bg-[#0a5c26] text-white p-4 flex justify-between sticky top-0"><div><h3 id="rTitle" class="font-bold text-[11px]"></h3><div id="rPhone" class="text-[10px] opacity-80"></div></div><div class="flex gap-2"><button onclick="downloadCustomerExcel()" class="bg-yellow-400 text-black px-3 py-1 rounded-full text-xs font-bold">Excel</button><button id="waBtn" class="bg-green-500 px-3 py-1 rounded-full text-xs font-bold">WA</button><button onclick="document.getElementById('repM').classList.add('hidden')" class="bg-white/20 px-3 py-1 rounded-full">X</button></div></div><div id="rContent" class="p-4"></div></div>
<div id="allRepM" class="hidden fixed inset-0 bg-white z-[80] overflow-y-auto"><div class="bg-[#0a5c26] text-white p-4 flex justify-between sticky top-0"><h3 class="font-bold text-sm">📊 ALL REPORTS SHEET</h3><button onclick="document.getElementById('allRepM').classList.add('hidden')" class="bg-white/20 px-3 py-1 rounded-full">X</button></div><div class="p-3"><div id="allRepContent"></div></div></div>
<script>
const USER="eravur", PIN="1234";
function getAllKeysData(){
  let keys=[]; for(let i=0;i<localStorage.length;i++) keys.push(localStorage.key(i));
  let shopKeys=keys.filter(k=>k.includes('egg_') &&!k.includes('tx') &&!k.includes('logged'));
  let txKeys=keys.filter(k=>k.includes('tx'));
  let allShops=[], allTx=[];
  shopKeys.forEach(k=>{try{let d=JSON.parse(localStorage.getItem(k)||'[]'); if(Array.isArray(d)) allShops=allShops.concat(d.map(x=>({...x,_src:k})));}catch(e){}});
  txKeys.forEach(k=>{try{let d=JSON.parse(localStorage.getItem(k)||'[]'); if(Array.isArray(d)) allTx=allTx.concat(d);}catch(e){}});
  return {shopKeys, allShops, allTx};
}
function deduplicateShops(list){
  let map=new Map();
  list.forEach(s=>{
    if(!s.name) return;
    let key=s.name.trim().toLowerCase();
    if(!map.has(key)){
      map.set(key,{id:s.id||Date.now()+Math.random(),name:s.name.trim(),area:s.area||'Eravur',phone:s.phone||'',oldBalance:s.oldBalance||s.old_balance||0,oldPaid:s.oldPaid||0,totalSale:s.totalSale||s.sale_total||0,salePaid:s.salePaid||0});
    } else {
      let ex=map.get(key);
      ex.oldBalance=Math.max(ex.oldBalance, s.oldBalance||0);
      ex.totalSale=Math.max(ex.totalSale, s.totalSale||0);
      ex.oldPaid=Math.max(ex.oldPaid, s.oldPaid||0);
      ex.salePaid=Math.max(ex.salePaid, s.salePaid||0);
      ex.phone=ex.phone||s.phone||'';
      if(s.area && s.area!='Eravur') ex.area=s.area;
    }
  });
  return Array.from(map.values());
}
let shops=JSON.parse(localStorage.getItem('egg_MASTER')||'[]');
let tx=JSON.parse(localStorage.getItem('egg_tx_MASTER')||'[]');
if(shops.length==0){
  let {allShops, allTx}=getAllKeysData();
  let dedup=deduplicateShops(allShops);
  if(dedup.length>0){ shops=dedup; tx=allTx; }
}
if(shops.length==0){
  shops=[{id:1,name:"ரிபாஸ்",area:"Eravur",phone:"774540269",oldBalance:10000,oldPaid:0,totalSale:39600,salePaid:0},{id:2,name:"மன்சூர்",area:"Eravur",phone:"(077) 753 4552",oldBalance:362960,oldPaid:0,totalSale:47220,salePaid:6000}];
}
function saveMaster(){ localStorage.setItem('egg_MASTER',JSON.stringify(shops)); localStorage.setItem('egg_tx_MASTER',JSON.stringify(tx)); localStorage.setItem('egg_recovered',JSON.stringify(shops)); localStorage.setItem('egg_tx_recovered',JSON.stringify(tx)); localStorage.setItem('egg_editable',JSON.stringify(shops));}
function autoRecover(){
  let {shopKeys, allShops, allTx}=getAllKeysData();
  let dedup=deduplicateShops(allShops);
  let msg=`Phone ல் கண்டுபிடித்த Database:\nKeys: ${shopKeys.join(', ')}\nTotal records: ${allShops.length}\nUnique shops: ${dedup.length}\nOddamavadi: ${dedup.filter(s=>s.area=='Oddamavadi').length}\nChenkalady: ${dedup.filter(s=>s.area=='Chenkalady').length}\nEravur: ${dedup.filter(s=>s.area=='Eravur').length}`;
  let banner=document.getElementById('recoverBanner');
  if(dedup.length>shops.length){
    if(confirm(msg+'\n\nRecover பண்ணவா?')){
      shops=dedup;
      // merge tx
      let txMap=new Map(); tx.forEach(t=>txMap.set(t.id,t)); allTx.forEach(t=>{if(!txMap.has(t.id)) tx.push(t);});
      saveMaster(); render();
      banner.classList.remove('hidden');
      banner.innerHTML=`✅ Recovered! ${dedup.length} கடைகள் மீட்டெடுக்கப்பட்டது! Oddamavadi: ${dedup.filter(s=>s.area=='Oddamavadi').length}, Chenkalady: ${dedup.filter(s=>s.area=='Chenkalady').length}, Eravur: ${dedup.filter(s=>s.area=='Eravur').length}`;
    }
  } else {
    banner.classList.remove('hidden');
    banner.innerHTML=`ℹ️ Phone ல் ${dedup.length} கடைகள் தான் உள்ளது. தற்போது ${shops.length} உள்ளது. Details:<br>${msg}<br><br>Keys ல் Data இல்லை என்றால் நீங்கள் முன்பு Excel Download பண்ணிய File இருந்தா Upload பண்ணலாம்.`;
    alert(msg);
  }
}
let curA='ALL',curId=null,saleSt={},payType='sale',rates={240:33,260:33,280:28,300:30},sizes=[240,260,280,300];
function doLogin(){if(document.getElementById('lu').value==USER&&document.getElementById('lp').value==PIN){localStorage.setItem('egg_logged','yes');document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden'); let {allShops}=getAllKeysData(); let dedup=deduplicateShops(allShops); if(dedup.length>shops.length){document.getElementById('recoverBanner').classList.remove('hidden'); document.getElementById('recoverBanner').innerHTML=`♻️ Phone ல் ${dedup.length} கடைகள் உள்ளது! தற்போது ${shops.length} தான் காட்டுது. மேலே <b>♻️ RECOVER NOW</b> Click பண்ணுங்க! Oddamavadi/Chenkalady திரும்ப வரும்!`; } render();}else alert('eravur / 1234');}
function logout(){localStorage.removeItem('egg_logged');location.reload();}
if(localStorage.getItem('egg_logged')=='yes'){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');}
function setA(a){curA=a; document.querySelectorAll('[id^=t-]').forEach(b=>{b.className='bg-white border px-4 py-2 rounded-full text-xs font-bold';}); let el=document.getElementById('t-'+a); if(el) el.className='bg-[#0a5c26] text-white px-4 py-2 rounded-full text-xs font-bold'; render();}
function getRem(s){let oldRem=(s.oldBalance||0)-(s.oldPaid||0); let saleRem=(s.totalSale||0)-(s.salePaid||0); return {oldRem,saleRem,total:oldRem+saleRem};}
function render(){let q=document.getElementById('search').value.toLowerCase(); let f=shops.filter(s=>(curA=='ALL'||s.area==curA)&&s.name.toLowerCase().includes(q)); let h=''; f.forEach(s=>{let r=getRem(s); h+=`<div class="bg-white rounded-[16px] p-4 border-l-[5px] ${s.area=='Oddamavadi'?'border-blue-600':s.area=='Chenkalady'?'border-purple-600':'border-[#0a5c26]'} shadow"><div onclick="openRep(${s.id})" class="flex justify-between"><div class="flex-1"><div class="font-bold text-[14px]">${s.name} <span class="text-[9px] ${s.area=='Oddamavadi'?'bg-blue-100 text-blue-700':s.area=='Chenkalady'?'bg-purple-100 text-purple-700':'bg-green-100 text-green-700'} px-2 py-0.5 rounded-full">${s.area}</span> ${s.phone?`<span class="text-[9px] bg-gray-100 px-2 py-0.5 rounded-full">📱${s.phone}</span>`:''}</div><div class="grid grid-cols-2 gap-2 mt-2 text-[11px]"><div class="bg-orange-50 border p-2 rounded-xl"><div class="text-[9px] font-bold text-orange-600">OLD தனி</div><div>Old: ${s.oldBalance}</div><div>Paid: ${s.oldPaid}</div><div class="font-bold">மீதி Old: Rs.${r.oldRem}</div></div><div class="bg-green-50 border p-2 rounded-xl"><div class="text-[9px] font-bold text-green-600">SALE தனி</div><div>Sale: ${s.totalSale}</div><div>Paid: ${s.salePaid}</div><div class="font-bold">மீதி Sale: Rs.${r.saleRem}</div></div></div><div class="mt-2 text-[11px] font-bold text-red-600">மொத்தம் = ${r.oldRem} + ${r.saleRem} = Rs.${r.total}</div></div><button onclick="openEdit(${s.id})" class="h-8 w-8 bg-yellow-50 rounded-full ml-2">✏️</button></div><div class="grid grid-cols-4 gap-2 mt-3"><button onclick="openSale(${s.id})" class="bg-[#0a5c26] text-white py-2 rounded-xl text-[11px] font-bold">Sale +</button><button onclick="openPay(${s.id})" class="bg-blue-600 text-white py-2 rounded-xl text-[11px] font-bold">Paid -</button><button onclick="openRep(${s.id})" class="bg-gray-800 text-white py-2 rounded-xl text-[11px] font-bold">📊 Report Sheet</button><button onclick="sendWAReport(${s.id})" class="bg-green-500 text-white py-2 rounded-xl text-[11px]">WA</button></div></div>`;}); document.getElementById('list').innerHTML=h||`<div class="text-center p-6 bg-white rounded-xl"><div class="text-gray-400 mb-2">${curA} ல் கடைகள் இல்லை</div><button onclick="autoRecover()" class="bg-red-600 text-white px-4 py-2 rounded-full text-xs font-bold">♻️ Database Recover பண்ண</button><div class="mt-2 text-[10px] text-gray-500">உங்க Phone ல் பழைய Data இருந்தா Auto வரும்</div></div>`; let totOld=shops.reduce((a,b)=>a+getRem(b).oldRem,0), totSale=shops.reduce((a,b)=>a+getRem(b).saleRem,0); document.getElementById('totOld').innerText='Rs.'+totOld; document.getElementById('totSale').innerText='Rs.'+totSale; document.getElementById('tot').innerText='Rs.'+(totOld+totSale); saveMaster();}
function openAdd(){document.getElementById('aArea').value=curA=='ALL'?'Eravur':curA; document.getElementById('addM').classList.remove('hidden');}
function doAdd(){let n=document.getElementById('aName').value.trim(), a=document.getElementById('aArea').value, p=document.getElementById('aPhone').value.trim(), o=parseFloat(document.getElementById('aOld').value)||0; if(!n) return alert('பெயர்'); shops.unshift({id:Date.now(),name:n,area:a,phone:p,oldBalance:o,oldPaid:0,totalSale:0,salePaid:0}); saveMaster(); document.getElementById('addM').classList.add('hidden'); document.getElementById('aName').value=''; document.getElementById('aPhone').value=''; document.getElementById('aOld').value=''; render();}
function openEdit(id){curId=id; let s=shops.find(x=>x.id==id); document.getElementById('eName').value=s.name; document.getElementById('eArea').value=s.area; document.getElementById('ePhone').value=s.phone; document.getElementById('eOld').value=s.oldBalance; document.getElementById('editM').classList.remove('hidden');}
function saveEdit(){let s=shops.find(x=>x.id==curId); s.name=document.getElementById('eName').value.trim(); s.area=document.getElementById('eArea').value; s.phone=document.getElementById('ePhone').value.trim(); s.oldBalance=parseFloat(document.getElementById('eOld').value)||0; saveMaster(); document.getElementById('editM').classList.add('hidden'); render();}
function openSale(id){curId=id; saleSt={}; sizes.forEach(sz=>saleSt[sz]={qty:0,rate:rates[sz]}); document.getElementById('sTitle').innerText=shops.find(x=>x.id==id).name+' - Sale'; document.getElementById('sDate').valueAsDate=new Date(); let ht=''; sizes.forEach(sz=>{ht+=`<div class="flex items-center gap-2"><div class="w-[50px] font-bold text-sm">W${sz}</div><div class="flex-1 flex border-2 rounded-xl overflow-hidden"><button onclick="chg(${sz},-1)" class="px-3 py-2 bg-green-50 font-bold">-</button><input id="q${sz}" type="number" value="0" oninput="saleSt[${sz}].qty=parseInt(this.value)||0;calc()" class="flex-1 text-center font-bold"><button onclick="chg(${sz},1)" class="px-3 py-2 bg-green-50 font-bold">+</button></div><input id="r${sz}" type="number" value="${rates[sz]}" oninput="saleSt[${sz}].rate=parseFloat(this.value)||0;calc()" class="w-[55px] border-2 rounded-xl p-2 text-center text-sm"></div>`;}); document.getElementById('sInputs').innerHTML=ht; calc(); document.getElementById('saleM').classList.remove('hidden');}
function chg(sz,d){saleSt[sz].qty=Math.max(0,saleSt[sz].qty+d); document.getElementById('q'+sz).value=saleSt[sz].qty; calc();}
function calc(){let today=0,det=[]; sizes.forEach(sz=>{today+=sz*(saleSt[sz].qty||0)*(saleSt[sz].rate||0); if(saleSt[sz].qty>0) det.push(`W${sz}x${saleSt[sz].qty}`);}); document.getElementById('sToday').innerText='Rs.'+today; document.getElementById('sGrand').innerText='Rs.'+(getRem(shops.find(x=>x.id==curId)).saleRem+today); document.getElementById('sDet').innerText=det.join(','); return {today,det};}
function doSale(){let c=calc(); if(c.today==0) return alert('Qty'); let s=shops.find(x=>x.id==curId); let dateVal=document.getElementById('sDate').value; let dateStr=dateVal? new Date(dateVal).toLocaleDateString(): new Date().toLocaleDateString(); s.totalSale+=c.today; tx.unshift({id:Date.now(),shopId:s.id,shopName:s.name,area:s.area,type:'sale',total:c.today,details:c.det.join(','),dateStr:dateStr,dateISO:dateVal||new Date().toISOString().split('T')[0],for:'sale'}); saveMaster(); document.getElementById('saleM').classList.add('hidden'); render();}
function setPayType(t){payType=t; document.getElementById('payOldBtn').className=t=='old'?'border-2 border-orange-600 bg-orange-600 text-white py-3 rounded-xl font-bold text-xs':'border-2 border-orange-200 bg-orange-50 py-3 rounded-xl font-bold text-xs'; document.getElementById('paySaleBtn').className=t=='sale'?'border-2 border-green-600 bg-green-600 text-white py-3 rounded-xl font-bold text-xs':'border-2 border-green-200 bg-green-50 py-3 rounded-xl font-bold text-xs'; updatePayPreview();}
function openPay(id){curId=id; payType='sale'; setPayType('sale'); document.getElementById('pDate').valueAsDate=new Date(); let s=shops.find(x=>x.id==id); let r=getRem(s); document.getElementById('pTitle').innerText=s.name; document.getElementById('pCalc').innerHTML=`<div class="grid grid-cols-2 gap-2 text-center"><div class="bg-orange-50 p-2 rounded-xl">OLD மீதி<b><br>Rs.${r.oldRem}</b></div><div class="bg-green-50 p-2 rounded-xl">SALE மீதி<b><br>Rs.${r.saleRem}</b></div></div>`; document.getElementById('pAmt').value=''; document.getElementById('pPreview').classList.add('hidden'); document.getElementById('payM').classList.remove('hidden'); document.getElementById('pAmt').oninput=updatePayPreview;}
function updatePayPreview(){let amt=parseFloat(document.getElementById('pAmt').value)||0; if(!amt){document.getElementById('pPreview').classList.add('hidden'); return;} let s=shops.find(x=>x.id==curId); let r=getRem(s); let nOld=r.oldRem, nSale=r.saleRem; if(payType=='old') nOld=r.oldRem-amt; else nSale=r.saleRem-amt; document.getElementById('pPreview').classList.remove('hidden'); document.getElementById('pPreview').innerHTML=`${payType=='old'?'OLD':'SALE'} Rs.${amt} கழித்தால்<br>Old: ${nOld} | Sale: ${nSale} | Total: ${nOld+nSale}`;}
function doPay(){let amt=parseFloat(document.getElementById('pAmt').value); if(!amt) return alert('Amount'); let s=shops.find(x=>x.id==curId); let dateVal=document.getElementById('pDate').value; let dateStr=dateVal? new Date(dateVal).toLocaleDateString(): new Date().toLocaleDateString(); if(payType=='old') s.oldPaid+=amt; else s.salePaid+=amt; tx.unshift({id:Date.now(),shopId:s.id,shopName:s.name,area:s.area,type:'payment',amount:amt,for:payType,dateStr:dateStr,dateISO:dateVal||new Date().toISOString().split('T')[0]}); saveMaster(); document.getElementById('payM').classList.add('hidden'); render();}
function openRep(id){curId=id; let s=shops.find(x=>x.id==id); let r=getRem(s); let list=tx.filter(t=>t.shopId==id).sort((a,b)=> new Date(b.dateISO||b.dateStr) - new Date(a.dateISO||a.dateStr)); document.getElementById('rTitle').innerText=`${s.name} (${s.area}) - REPORT SHEET`; document.getElementById('rPhone').innerText=`📱 ${s.phone||''} | Old:${r.oldRem} Sale:${r.saleRem} Total:${r.total}`; let html=`<div class="grid grid-cols-2 gap-3 mb-4"><div class="bg-orange-50 border-2 p-3 rounded-2xl text-center"><div class="text-[10px] font-bold">OLD தனி</div><div class="text-xs">Old: ${s.oldBalance} Paid:${s.oldPaid}</div><div class="font-bold text-orange-700">Rs.${r.oldRem}</div></div><div class="bg-green-50 border-2 p-3 rounded-2xl text-center"><div class="text-[10px] font-bold">SALE தனி</div><div class="text-xs">Sale:${s.totalSale} Paid:${s.salePaid}</div><div class="font-bold text-green-700">Rs.${r.saleRem}</div></div></div><div class="bg-[#0a5c26] text-white p-3 rounded-xl text-center mb-4 font-bold">மொத்தம் = ${r.oldRem} + ${r.saleRem} = Rs.${r.total}</div><div class="overflow-x-auto border-2 rounded-xl"><table class="w-full text-[11px]"><tr class="bg-gray-800 text-white"><th class="p-2 border">Date</th><th class="p-2 border">Type</th><th class="p-2 border">For</th><th class="p-2 border">Amount</th><th class="p-2 border">Details</th><th class="p-2 border">Action</th></tr>${list.map(t=>`<tr class="${t.type=='sale'?'bg-green-50':'bg-blue-50'}"><td class="p-2 border"><input type="date" value="${t.dateISO||''}" onchange="quickDateEdit(${t.id},this.value)" class="border rounded p-1 text-[10px]"><div class="text-[9px]">${t.dateStr}</div></td><td class="p-2 border">${t.type=='sale'?'SALE':'PAID'}</td><td class="p-2 border">${t.for.toUpperCase()}</td><td class="p-2 border font-bold">Rs.${t.type=='sale'?t.total:t.amount}</td><td class="p-2 border text-[10px]">${t.details||'-'}</td><td class="p-2 border"><button onclick="delTx(${t.id})" class="bg-red-100 px-2 py-1 rounded text-[9px]">Delete</button></td></tr>`).join('')||'<tr><td colspan=6 class="p-4 text-center text-gray-400">No data - இவருக்கு Report Sheet Empty</td></tr>'}</table></div>`; document.getElementById('rContent').innerHTML=html; document.getElementById('waBtn').onclick=()=>sendWAReport(s.id); document.getElementById('repM').classList.remove('hidden');}
function quickDateEdit(tid,val){let t=tx.find(x=>x.id==tid); if(!val) return; t.dateISO=val; t.dateStr=new Date(val).toLocaleDateString(); saveMaster(); openRep(t.shopId); render();}
function delTx(tid){if(!confirm('Delete?')) return; let t=tx.find(x=>x.id==tid); let s=shops.find(x=>x.id==t.shopId); if(t.type=='sale') s.totalSale-=t.total; else {if(t.for=='old') s.oldPaid-=t.amount; else s.salePaid-=t.amount;} tx=tx.filter(x=>x.id!=tid); saveMaster(); openRep(s.id); render();}
function openAllReports(){let html=`<div class="overflow-x-auto"><table class="w-full text-[11px]"><tr class="bg-[#0a5c26] text-white"><th class="p-2 border">Date</th><th class="p-2 border">Name</th><th class="p-2 border">Area</th><th class="p-2 border">Type</th><th class="p-2 border">Amount</th></tr>${tx.map(t=>`<tr class="${t.type=='sale'?'bg-green-50':'bg-blue-50'}"><td class="p-2 border">${t.dateStr}</td><td class="p-2 border">${t.shopName}</td><td class="p-2 border">${t.area}</td><td class="p-2 border">${t.type} ${t.for}</td><td class="p-2 border">Rs.${t.type=='sale'?t.total:t.amount}</td></tr>`).join('')}</table></div>`; document.getElementById('allRepContent').innerHTML=html||'No data'; document.getElementById('allRepM').classList.remove('hidden');}
function downloadCustomerExcel(){let s=shops.find(x=>x.id==curId); let r=getRem(s); let list=tx.filter(t=>t.shopId==curId); let csv=`Report Sheet - ${s.name}\nPhone,${s.phone}\nOld,${s.oldBalance}-${s.oldPaid}=${r.oldRem}\nSale,${s.totalSale}-${s.salePaid}=${r.saleRem}\nTotal,${r.total}\n\nDate,Type,For,Amount,Details\n`; list.forEach(t=>{csv+=`"${t.dateStr}","${t.type}","${t.for}","${t.type=='sale'?t.total:t.amount}","${t.details||''}"\n`;}); let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${s.name}_Report.csv`; a.click();}
function downloadAllExcel(){let csv='Date,Name,Area,Type,For,Amount,Details\n'; tx.forEach(t=>{csv+=`"${t.dateStr}","${t.shopName}","${t.area}","${t.type}","${t.for}","${t.type=='sale'?t.total:t.amount}","${t.details||''}"\n`;}); let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='All_Reports.csv'; a.click();}
function sendWAReport(id){let s=shops.find(x=>x.id==id); let r=getRem(s); let msg=`🥚 ${s.name} REPORT SHEET\n📱${s.phone}\nOLD: ${s.oldBalance}-${s.oldPaid}= Rs.${r.oldRem}\nSALE: ${s.totalSale}-${s.salePaid}= Rs.${r.saleRem}\nமொத்தம் Rs.${r.total}`; let phone=s.phone? '94'+s.phone.replace(/[^0-9]/g,'').slice(-9):''; window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`);}
render();
</script></body></html>
