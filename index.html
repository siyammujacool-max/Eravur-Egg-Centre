<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>V7 FIX</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#f0f4ec]">
<div id="loginScreen" class="fixed inset-0 bg-[#0a5c26] z-[100] flex items-center justify-center p-5"><div class="bg-white max-w-sm w-full rounded-[24px] p-7 text-center"><div class="text-6xl">🥚</div><h1 class="font-bold">V7 DUPLICATE FIX</h1><input id="loginUser" class="w-full border-2 rounded-xl p-3 mt-4" value="eravur"><input id="loginPin" type="password" class="w-full border-2 rounded-xl p-3 mt-2" value="1234"><button onclick="doLogin()" class="w-full bg-[#0a5c26] text-white py-3 rounded-xl mt-3 font-bold">Login</button></div></div>
<div id="appContent" class="hidden pb-[100px]"><div class="bg-[#0a5c26] text-white p-4 sticky top-0 z-40"><div class="flex justify-between"><h1 class="font-bold text-[11px]">V7 - <span id="syncStatus">Checking...</span></h1><div class="flex gap-1"><button onclick="cleanDuplicates()" class="bg-red-500 px-3 py-1 rounded-full text-[10px] font-bold">CLEAN DUP</button><button onclick="doLogout()" class="bg-white/20 px-2 py-1 rounded-full text-[9px]">Logout</button></div></div><div class="mt-3 flex gap-2"><input id="search" oninput="renderShops()" placeholder="search" class="flex-1 px-4 py-2 rounded-full text-black text-sm"><button onclick="openAddShop()" class="bg-yellow-400 text-black px-4 py-2 rounded-full text-xs font-bold">+ kadai</button></div></div><div class="flex gap-2 p-3 overflow-x-auto"><button onclick="setArea('ALL')" id="tab-ALL" class="bg-[#0a5c26] text-white px-5 py-2 rounded-full text-xs">ALL</button><button onclick="setArea('Oddamavadi')" id="tab-Oddamavadi" class="bg-white px-5 py-2 rounded-full text-xs border">Oddamavadi</button><button onclick="setArea('Chenkalady')" id="tab-Chenkalady" class="bg-white px-5 py-2 rounded-full text-xs border">Chenkalady</button><button onclick="setArea('Eravur')" id="tab-Eravur" class="bg-white px-5 py-2 rounded-full text-xs border">Eravur</button></div><div id="shopList" class="px-3 space-y-3"></div><div class="fixed bottom-0 left-0 right-0 bg-white border-t-2 p-2 flex justify-between"><div id="totBalance" class="font-bold text-[11px]"></div><button onclick="exportExcel()" class="text-[10px] font-bold">Excel</button></div></div>
<div id="addModal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-end justify-center p-3"><div class="bg-white w-full max-w-md rounded-t-[24px] p-6"><h3 class="font-bold">New kadai</h3><input id="newName" class="w-full border-2 rounded-xl p-3 mt-3 mb-2" placeholder="Name"><select id="newArea" class="w-full border-2 rounded-xl p-3 mb-2"><option>Oddamavadi</option><option>Chenkalady</option><option>Eravur</option></select><input id="newPhone" class="w-full border-2 rounded-xl p-3 mb-2" placeholder="Phone"><input id="newOld" type="number" class="w-full border-2 rounded-xl p-3 mb-2" value="0"><div class="flex gap-2"><button onclick="closeAddShop()" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="saveNewShop()" class="flex-1 bg-[#0a5c26] text-white py-3 rounded-xl">Save</button></div></div></div>
<div id="saleModal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-end justify-center p-3"><div class="bg-white w-full max-w-md rounded-t-[24px] p-5"><div class="flex justify-between"><h3 id="saleTitle" class="font-bold"></h3><span id="saleOld" class="text-xs bg-yellow-100 px-2 py-1 rounded-full"></span></div><input id="saleDate" type="date" class="w-full border-2 rounded-xl p-2 mt-3"><div id="eggInputs" class="space-y-2 mt-3"></div><div class="mt-3 p-3 bg-[#0a5c26] text-white rounded-xl text-center"><span id="saleToday">0</span> | <span id="saleGrand">0</span><div id="saleDetails" class="text-[10px]"></div></div><div class="flex gap-2 mt-3"><button onclick="closeSale()" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="confirmSale()" class="flex-1 bg-[#0a5c26] text-white py-3 rounded-xl">Save</button></div></div></div>
<div id="payModal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4"><div class="bg-white w-full max-w-sm rounded-[24px] p-6"><h3 id="payTitle" class="font-bold"></h3><div id="payInfo" class="bg-blue-50 p-2 rounded-xl mb-2"></div><input id="payDate" type="date" class="w-full border-2 rounded-xl p-2 mb-2"><input id="payAmount" type="number" class="w-full border-2 rounded-xl p-3 mb-3" placeholder="Paid"><div class="flex gap-2"><button onclick="closePay()" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="confirmPay()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl">Paid</button></div></div></div>
<div id="reportModal" class="hidden fixed inset-0 bg-white z-[70] overflow-y-auto"><div class="bg-[#0a5c26] text-white p-4 flex justify-between"><h3 id="repTitle" class="font-bold text-sm"></h3><button onclick="closeReport()" class="bg-white/20 px-3 py-1 rounded-full">X</button></div><div id="repContent" class="p-4"></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyA-OQKxJeDhALnecWc2Jyv_mNxr3W6NFA8", authDomain: "eravur-egg.firebaseapp.com", projectId: "eravur-egg", storageBucket: "eravur-egg.firebasestorage.app", messagingSenderId: "721546852813", appId: "1:721546852813:web:91efbc2c7d5f36f4332c84" };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let shops=[]; let tx=[]; let rates={240:24,260:26,280:28,300:30};
let curArea='ALL'; let curShopId=null; let saleState={};
const sizes=[240,260,280,300];
window.doLogin=()=>{ let u=document.getElementById('loginUser').value; let p=document.getElementById('loginPin').value; if(u==='eravur'&&p==='1234'){ localStorage.setItem('egg_logged','yes'); document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('appContent').classList.remove('hidden'); loadFromCloud(); } };
window.doLogout=()=>{ localStorage.removeItem('egg_logged'); location.reload(); };
if(localStorage.getItem('egg_logged')==='yes'){ document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('appContent').classList.remove('hidden'); loadFromCloud(); }
async function loadFromCloud(){
  onSnapshot(collection(db,'shops'), (snap)=>{
    shops=[]; snap.forEach(d=>shops.push({id:d.id,...d.data()}));
    let seen={}; let dups=0; shops.forEach(s=>{ let k=s.name.trim().toLowerCase()+'|'+s.area.trim().toLowerCase(); if(seen[k]) dups++; else seen[k]=true; });
    if(dups>0){ document.getElementById('syncStatus').innerText='⚠️ '+dups+' DUP FOUND! CLEAN DUP click!'; document.getElementById('syncStatus').style.background='red'; document.getElementById('syncStatus').style.padding='2px 6px'; document.getElementById('syncStatus').style.borderRadius='8px'; }
    else document.getElementById('syncStatus').innerText='✅ '+shops.length+' kadai OK';
    renderShops();
  });
  onSnapshot(query(collection(db,'transactions'), orderBy('date','desc')), (snap)=>{ tx=[]; snap.forEach(d=>tx.push({id:d.id,...d.data()})); });
}
window.cleanDuplicates=async()=>{
  if(!confirm('Duplicate delete pannava?')) return;
  let map={}; let toDelete=[];
  let sorted=[...shops].sort((a,b)=>(b.balance||0)-(a.balance||0));
  sorted.forEach(s=>{ let k=s.name.trim().toLowerCase()+'|'+s.area.trim().toLowerCase(); if(!map[k]) map[k]=s; else toDelete.push(s); });
  for(let d of toDelete){ await deleteDoc(doc(db,'shops',d.id)); }
  alert(toDelete.length+' dup deleted! Now '+Object.keys(map).length+' kadai');
};
window.setArea=(a)=>{ curArea=a; document.querySelectorAll('[id^=tab-]').forEach(b=>b.className='bg-white px-5 py-2 rounded-full text-xs border'); document.getElementById('tab-'+a).className='bg-[#0a5c26] text-white px-5 py-2 rounded-full text-xs'; renderShops(); };
window.renderShops=()=>{ let q=document.getElementById('search').value.toLowerCase(); let f=shops.filter(s=>(curArea=='ALL'||s.area==curArea)&&s.name.toLowerCase().includes(q)); let h=''; f.forEach(s=>{ h+=`<div class="bg-white rounded-[16px] p-4 border-l-[6px] border-[#0a5c26]"><div class="flex justify-between"><div onclick="openReport('${s.id}')" class="flex-1"><div class="font-bold text-[13px]">${s.name} <span class="text-[9px] bg-gray-100 px-2 rounded-full">${s.area}</span></div><div class="text-[11px] text-gray-500">Bal Rs.${s.balance}</div></div></div><div class="grid grid-cols-3 gap-2 mt-3"><button onclick="openSale('${s.id}')" class="bg-[#0a5c26] text-white py-2 rounded-xl text-xs">Sale +</button><button onclick="openPay('${s.id}')" class="bg-blue-600 text-white py-2 rounded-xl text-xs">Paid</button><button onclick="openReport('${s.id}')" class="bg-gray-100 py-2 rounded-xl text-xs">Report</button></div></div>`; }); document.getElementById('shopList').innerHTML=h; document.getElementById('totBalance').innerText='Rs.'+shops.reduce((a,b)=>a+(b.balance||0),0)+' | '+shops.length+' kadai'; };
window.openAddShop=()=>document.getElementById('addModal').classList.remove('hidden');
window.closeAddShop=()=>document.getElementById('addModal').classList.add('hidden');
window.saveNewShop=async()=>{ let n=document.getElementById('newName').value.trim(); if(!n) return; let exists=shops.some(s=>s.name.toLowerCase()===n.toLowerCase() && s.area===document.getElementById('newArea').value); if(exists) return alert('Already irukku!'); let a=document.getElementById('newArea').value; let p=document.getElementById('newPhone').value; let o=parseFloat(document.getElementById('newOld').value)||0; await addDoc(collection(db,'shops'),{name:n,area:a,phone:p,oldBalance:o,oldPaid:0,totalSale:0,totalPaid:0,balance:o}); closeAddShop(); };
window.openSale=(id)=>{ curShopId=id; saleState={}; sizes.forEach(sz=>saleState[sz]={qty:0,rate:rates[sz]}); let s=shops.find(x=>x.id==id); document.getElementById('saleTitle').innerText=s.name; document.getElementById('saleOld').innerText='Bal '+s.balance; document.getElementById('saleDate').valueAsDate=new Date(); let h=''; sizes.forEach(sz=>{ h+=`<div class="flex gap-2"><div class="w-12 font-bold">W${sz}</div><div class="flex-1 flex border-2 rounded-xl overflow-hidden"><button onclick="chgSale(${sz},-1)" class="px-3 bg-green-50">-</button><input id="qs${sz}" type="number" value="0" oninput="saleState[${sz}].qty=parseInt(this.value)||0;calcSale()" class="flex-1 text-center"><button onclick="chgSale(${sz},1)" class="px-3 bg-green-50">+</button></div><input id="rs${sz}" type="number" value="${rates[sz]}" oninput="saleState[${sz}].rate=parseFloat(this.value)||0;calcSale()" class="w-14 border-2 rounded-xl text-center"></div>`; }); document.getElementById('eggInputs').innerHTML=h; calcSale(); document.getElementById('saleModal').classList.remove('hidden'); };
window.chgSale=(sz,d)=>{ saleState[sz].qty=Math.max(0,saleState[sz].qty+d); document.getElementById('qs'+sz).value=saleState[sz].qty; calcSale(); };
window.calcSale=()=>{ let s=shops.find(x=>x.id==curShopId); let today=0,eggs=0,det=[]; sizes.forEach(sz=>{ let q=saleState[sz].qty,r=saleState[sz].rate; let e=sz*q; today+=e*r; eggs+=e; if(q>0) det.push(`W${sz}x${q}=${e}@${r}`); }); document.getElementById('saleToday').innerText=today; document.getElementById('saleGrand').innerText='Rs.'+(today+s.balance); document.getElementById('saleDetails').innerText=det.join(' | '); return {today,grand:today+s.balance,eggs,det}; };
window.closeSale=()=>document.getElementById('saleModal').classList.add('hidden');
window.confirmSale=async()=>{ let c=calcSale(); if(c.today==0) return; let s=shops.find(x=>x.id==curShopId); let d=document.getElementById('saleDate').value; let dateObj=d?new Date(d):new Date(); let newBal=c.grand; await updateDoc(doc(db,'shops',s.id),{balance:newBal, totalSale:(s.totalSale||0)+c.today}); await addDoc(collection(db,'transactions'),{shopId:s.id,shopName:s.name,area:s.area,type:'sale',total:c.today,balance:newBal,eggs:c.eggs,details:c.det.join(', '),date:dateObj.toISOString(),dateStr:dateObj.toLocaleDateString()}); closeSale(); };
window.openPay=(id)=>{ curShopId=id; let s=shops.find(x=>x.id==id); document.getElementById('payTitle').innerText=s.name+' Paid'; document.getElementById('payInfo').innerText='Bal Rs.'+s.balance; document.getElementById('payDate').valueAsDate=new Date(); document.getElementById('payModal').classList.remove('hidden'); };
window.closePay=()=>document.getElementById('payModal').classList.add('hidden');
window.confirmPay=async()=>{ let amt=parseFloat(document.getElementById('payAmount').value); if(!amt) return; let s=shops.find(x=>x.id==curShopId); let d=document.getElementById('payDate').value; let dateObj=d?new Date(d):new Date(); let newBal=s.balance-amt; await updateDoc(doc(db,'shops',s.id),{balance:newBal, totalPaid:(s.totalPaid||0)+amt}); await addDoc(collection(db,'transactions'),{shopId:s.id,shopName:s.name,area:s.area,type:'payment',amount:amt,balance:newBal,date:dateObj.toISOString(),dateStr:dateObj.toLocaleDateString()}); closePay(); };
window.openReport=(id)=>{ curShopId=id; let s=shops.find(x=>x.id==id); let list=tx.filter(t=>t.shopId==id); document.getElementById('repTitle').innerText=s.name+' Bal '+s.balance; let html=`<div>Bal Rs.${s.balance}</div>`; html+=list.map(t=> t.type=='sale'? `<div class="border-l-4 border-green-600 p-2 bg-gray-50 mb-2 text-xs">SALE Rs.${t.total} ${t.dateStr}<br>${t.details}</div>` : `<div class="border-l-4 border-blue-500 p-2 bg-blue-50 mb-2 text-xs">PAID Rs.${t.amount} ${t.dateStr}</div>`).join(''); document.getElementById('repContent').innerHTML=html; document.getElementById('reportModal').classList.remove('hidden'); };
window.closeReport=()=>document.getElementById('reportModal').classList.add('hidden');
window.exportExcel=()=>{ let csv="Shop,Area,Balance\n"+shops.map(s=>`"${s.name}","${s.area}",${s.balance}`).join("\n"); let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Eravur.csv'; a.click(); };
</script></body></html>
