<!DOCTYPE html><html lang="ta"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ERAVUR EGG PRO</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>body{font-family:system-ui}</style></head><body class="bg-[#f4f7f2]">
<!-- LOGIN SCREEN -->
<div id="loginScreen" class="fixed inset-0 bg-[#0a5c26] z-[100] flex items-center justify-center p-5">
<div class="bg-white w-full max-w-sm rounded-[24px] p-6 text-center shadow-2xl">
<div class="text-5xl mb-3">🥚</div><h1 class="text-2xl font-bold text-[#0a5c26]">ERAVUR EGG</h1><p class="text-xs text-gray-500 mb-5">Admin Login Required</p>
<input id="loginUser" placeholder="Username" class="w-full border-2 border-green-100 rounded-xl p-3 mb-2" value="eravur">
<input id="loginPin" type="password" placeholder="PIN / Password" class="w-full border-2 border-green-100 rounded-xl p-3 mb-3" value="">
<button onclick="doLogin()" class="w-full bg-[#0a5c26] text-white py-3 rounded-xl font-bold">Login</button>
<p class="text-[11px] text-gray-400 mt-3">Demo: Username: eravur / PIN: 1234</p>
</div></div>

<!-- APP -->
<div id="appContent" class="hidden pb-[90px]">
<div class="bg-[#0a5c26] text-white p-4 sticky top-0 z-50">
<div class="flex justify-between items-center"><div><h1 class="text-lg font-bold">🥚 ERAVUR EGG CENTRE</h1><p class="text-[10px] opacity-80">siyammujacool@gmail.com • Online</p></div><button onclick="doLogout()" class="bg-white/20 px-3 py-1 rounded-full text-xs">Logout</button></div>
<div class="mt-3 flex gap-2"><input id="search" oninput="renderShops()" placeholder="தேடு..." class="flex-1 px-4 py-2.5 rounded-full text-black text-sm outline-none"><button onclick="openAddShop()" class="bg-yellow-400 text-black px-4 py-2.5 rounded-full font-bold text-xs">+ புது கடை</button></div>
</div>
<div class="flex gap-2 p-3 overflow-x-auto"><button onclick="setArea('ALL')" id="tab-ALL" class="bg-[#0a5c26] text-white px-4 py-2 rounded-full text-xs font-bold">ALL</button><button onclick="setArea('Oddamavadi')" id="tab-Oddamavadi" class="bg-white px-4 py-2 rounded-full text-xs font-bold border">Oddamavadi</button><button onclick="setArea('Chenkalady')" id="tab-Chenkalady" class="bg-white px-4 py-2 rounded-full text-xs font-bold border">Chenkalady</button><button onclick="setArea('Eravur')" id="tab-Eravur" class="bg-white px-4 py-2 rounded-full text-xs font-bold border">Eravur</button></div>
<div id="shopList" class="px-3 space-y-3"></div>
<div class="fixed bottom-0 left-0 right-0 bg-white border-t p-3 flex justify-around text-center"><div><div class="text-[10px] text-gray-500">மொத்த பாக்கி</div><div id="totBalance" class="font-bold text-[#0a5c26] text-sm">Rs.0</div></div><div><div class="text-[10px] text-gray-500">இன்று</div><div id="totToday" class="font-bold text-sm">Rs.0</div></div><div><button onclick="openSheetConfig()" class="bg-[#0a5c26] text-white px-3 py-2 rounded-full text-[10px]">Sheet Setup</button></div></div>
</div>

<!-- MODALS (Add, Sale, Pay, Report) Same as before -->
<div id="addModal" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-end justify-center"><div class="bg-white w-full rounded-t-[20px] p-5"><h3 class="font-bold mb-3">புது கடை</h3><input id="newName" class="w-full border-2 rounded-xl p-3 mb-2 text-sm" placeholder="பெயர் *"><select id="newArea" class="w-full border-2 rounded-xl p-3 mb-2 text-sm"><option>Oddamavadi</option><option>Chenkalady</option><option>Eravur</option></select><input id="newPhone" class="w-full border-2 rounded-xl p-3 mb-2 text-sm" placeholder="Phone"><input id="newOld" type="number" class="w-full border-2 rounded-xl p-3 mb-3 text-sm" value="0" placeholder="பழைய பாக்கி"><div class="flex gap-2"><button onclick="closeAddShop()" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="saveNewShop()" class="flex-1 bg-[#0a5c26] text-white py-3 rounded-xl font-bold">Save</button></div></div></div>
<div id="saleModal" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-end justify-center"><div class="bg-white w-full rounded-t-[20px] p-5 max-h-[90vh] overflow-y-auto"><div class="flex justify-between mb-3"><h3 id="saleTitle" class="font-bold"></h3><span id="saleOld" class="text-xs bg-yellow-100 px-2 py-1 rounded"></span></div><div id="eggInputs" class="space-y-2"></div><div class="mt-3 p-3 bg-green-50 border-2 border-dashed rounded-xl text-center text-xs"><div>Bill: <span id="saleToday" class="font-bold">0</span> | Total: <span id="saleGrand" class="font-bold text-[#0a5c26]">0</span></div><div id="saleDetails" class="text-[10px] mt-1"></div></div><div class="flex gap-2 mt-3"><button onclick="closeSale()" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="confirmSale()" class="flex-1 bg-[#0a5c26] text-white py-3 rounded-xl font-bold">Save & WA</button></div></div></div>
<div id="payModal" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4"><div class="bg-white w-full max-w-sm rounded-[20px] p-5"><h3 id="payTitle" class="font-bold mb-3"></h3><input id="payAmount" type="number" class="w-full border-2 rounded-xl p-3 mb-3 font-bold" placeholder="Paid Amount"><div id="payInfo" class="text-sm bg-blue-50 p-3 rounded-xl mb-3"></div><div class="flex gap-2"><button onclick="closePay()" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="confirmPay()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold">Paid</button></div></div></div>
<div id="reportModal" class="hidden fixed inset-0 bg-white z-[70] overflow-y-auto"><div class="bg-[#0a5c26] text-white p-4 flex justify-between items-center"><h3 id="repTitle" class="font-bold text-sm"></h3><div class="flex gap-2"><button onclick="syncCurrentToSheet()" class="bg-yellow-400 text-black px-3 py-1 rounded-full text-xs font-bold">📊 Sheet க்கு அனுப்பு</button><button onclick="closeReport()" class="bg-white/20 px-3 py-1 rounded-full">X</button></div></div><div id="repContent" class="p-4"></div></div>
<div id="sheetModal" class="hidden fixed inset-0 bg-black/50 z-[80] flex items-center justify-center p-4"><div class="bg-white w-full max-w-sm rounded-[20px] p-5"><h3 class="font-bold mb-2">Google Sheet Setup</h3><p class="text-[11px] text-gray-500 mb-2">Apps Script Web App Link ஐ Paste பண்ணுங்க. உங்க Gmail: siyammujacool@gmail.com</p><input id="sheetUrl" class="w-full border-2 rounded-xl p-3 mb-3 text-xs" placeholder="https://script.google.com/macros/s/.../exec"><button onclick="saveSheetUrl()" class="w-full bg-[#0a5c26] text-white py-3 rounded-xl font-bold">Save Link</button><button onclick="closeSheetConfig()" class="w-full bg-gray-100 py-2 rounded-xl mt-2">Close</button></div></div>

<script>
const GOOGLE_SHEET_URL_KEY='egg_sheet_url';
let GOOGLE_SHEET_URL=localStorage.getItem(GOOGLE_SHEET_URL_KEY)||"";
const LOGIN_USER="eravur"; const LOGIN_PIN="1234";
const DEFAULT=[{area:"Oddamavadi",name:"ரஹுமான் ஹாஜியார்"},{area:"Oddamavadi",name:"ஜாமல்"},{area:"Oddamavadi",name:"post office கடை"},{area:"Oddamavadi",name:"ராபி டா நானா"},{area:"Oddamavadi",name:"ஹார்ட். கடை"},{area:"Oddamavadi",name:"மீரவோடை கடை"},{area:"Oddamavadi",name:"மீரவோடை புது கடை"},{area:"Oddamavadi",name:"அபுபக்கர்"},{area:"Oddamavadi",name:"வாளச்சேனை மரக்கறி கடை"},{area:"Oddamavadi",name:"ஜீவா"},{area:"Chenkalady",name:"R. தம்பி"},{area:"Chenkalady",name:"நிரோஷன்"},{area:"Chenkalady",name:"ஆனந்தன்"},{area:"Chenkalady",name:"வெற்றில கடை"},{area:"Chenkalady",name:"வசந்தன்"},{area:"Chenkalady",name:"ரஜனி மகன்"},{area:"Chenkalady",name:"கருவாட்டு கடை"},{area:"Chenkalady",name:"பிரபாஸ் hotel"},{area:"Chenkalady",name:"மலர் food city"},{area:"Chenkalady",name:"Bar. MA"},{area:"Chenkalady",name:"மதுராம் hotel"},{area:"Eravur",name:"ரிபாஸ்"},{area:"Eravur",name:"மன்சூர்"},{area:"Eravur",name:"மன்சூர் 2"},{area:"Eravur",name:"சபீர் மௌலவி"},{area:"Eravur",name:"பதுரியா 1"},{area:"Eravur",name:"புகாரி மருமகன்"},{area:"Eravur",name:"colombu store"},{area:"Eravur",name:"நதிர்"},{area:"Eravur",name:"நஜீம்"},{area:"Eravur",name:"மௌனுதீன்"}];
let shops=JSON.parse(localStorage.getItem('egg_shops_v2')||'null'); if(!shops){shops=DEFAULT.map((s,i)=>({id:Date.now()+i,...s,phone:"",oldBalance:0,balance:0,totalSale:0,totalPaid:0}));localStorage.setItem('egg_shops_v2',JSON.stringify(shops));}
let tx=JSON.parse(localStorage.getItem('egg_tx_v2')||'[]'); let curArea='ALL'; let curShopId=null; let saleState={}; const sizes=[240,260,280,300]; const rates={240:24,260:26,280:28,300:30};
function save(){localStorage.setItem('egg_shops_v2',JSON.stringify(shops));localStorage.setItem('egg_tx_v2',JSON.stringify(tx));}
function doLogin(){let u=document.getElementById('loginUser').value.trim(); let p=document.getElementById('loginPin').value.trim(); if(u===LOGIN_USER && p===LOGIN_PIN){localStorage.setItem('egg_logged','yes'); document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('appContent').classList.remove('hidden'); renderShops();} else alert('Wrong Username or PIN! Use eravur / 1234');}
function doLogout(){localStorage.removeItem('egg_logged'); location.reload();}
if(localStorage.getItem('egg_logged')==='yes'){document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('appContent').classList.remove('hidden');}
function setArea(a){curArea=a; document.querySelectorAll('[id^=tab-]').forEach(b=>b.className='bg-white px-4 py-2 rounded-full text-xs font-bold border'); document.getElementById('tab-'+a).className='bg-[#0a5c26] text-white px-4 py-2 rounded-full text-xs font-bold'; renderShops();}
function renderShops(){let q=document.getElementById('search').value.toLowerCase(); let filtered=shops.filter(s=>(curArea=='ALL'||s.area==curArea)&&s.name.toLowerCase().includes(q)); let html=''; filtered.forEach(s=>{html+=`<div onclick="openReport(${s.id})" class="bg-white rounded-[16px] p-4 border-l-[5px] border-[#0a5c26] shadow cursor-pointer"><div class="flex justify-between"><div><div class="font-bold text-[14px]">${s.name} <span class="text-[9px] bg-gray-100 px-2 py-0.5 rounded-full">${s.area}</span></div><div class="text-[11px] text-gray-500 mt-1">📞 ${s.phone||'No Phone'} | Old: ${s.oldBalance} | <b class="text-[#0a5c26]">Bal Rs.${s.balance}</b></div></div><button onclick="event.stopPropagation(); editShop(${s.id})" class="text-gray-400">✏️</button></div><div class="grid grid-cols-4 gap-2 mt-3"><button onclick="event.stopPropagation(); openSale(${s.id})" class="bg-[#0a5c26] text-white py-2 rounded-xl text-xs">Sale</button><button onclick="event.stopPropagation(); openPay(${s.id})" class="bg-blue-600 text-white py-2 rounded-xl text-xs">Paid</button><button onclick="event.stopPropagation(); openReport(${s.id})" class="bg-gray-100 py-2 rounded-xl text-xs">Report</button><button onclick="event.stopPropagation(); waShop(${s.id})" class="bg-green-500 text-white py-2 rounded-xl text-xs">WA</button></div></div>`;}); document.getElementById('shopList').innerHTML=html; let totBal=shops.reduce((a,b)=>a+b.balance,0); let todayStr=new Date().toLocaleDateString(); let totToday=tx.filter(t=>t.dateStr==todayStr&&t.type=='sale').reduce((a,b)=>a+b.total,0); document.getElementById('totBalance').innerText='Rs.'+totBal; document.getElementById('totToday').innerText='Rs.'+totToday;}
function openAddShop(){document.getElementById('addModal').classList.remove('hidden');} function closeAddShop(){document.getElementById('addModal').classList.add('hidden');}
function saveNewShop(){let n=document.getElementById('newName').value.trim(); if(!n) return alert('பெயர்'); let a=document.getElementById('newArea').value; let p=document.getElementById('newPhone').value; let o=parseFloat(document.getElementById('newOld').value)||0; shops.unshift({id:Date.now(),name:n,area:a,phone:p,oldBalance:o,balance:o,totalSale:0,totalPaid:0}); save(); closeAddShop(); renderShops();}
function editShop(id){let s=shops.find(x=>x.id==id); let np=prompt('Phone',s.phone); if(np===null) return; let ob=prompt('Old Balance',s.oldBalance); if(ob===null) return; let diff=(parseFloat(ob)||0)-s.oldBalance; s.phone=np; s.oldBalance=parseFloat(ob)||0; s.balance+=diff; save(); renderShops();}
function openSale(id){curShopId=id; saleState={}; sizes.forEach(sz=>saleState[sz]={qty:0,rate:rates[sz]}); let s=shops.find(x=>x.id==id); document.getElementById('saleTitle').innerText=s.name; document.getElementById('saleOld').innerText='Bal '+s.balance; let h=''; sizes.forEach(sz=>{h+=`<div class="flex items-center gap-2"><div class="w-[60px] font-bold text-sm">W${sz}</div><div class="flex-1 flex border-2 rounded-xl overflow-hidden"><button onclick="chgSale(${sz},-1)" class="px-3 py-2 bg-green-50 font-bold">-</button><input id="qs${sz}" type="number" value="0" oninput="saleState[${sz}].qty=parseInt(this.value)||0;calcSale()" class="flex-1 text-center font-bold"><button onclick="chgSale(${sz},1)" class="px-3 py-2 bg-green-50 font-bold">+</button></div><input id="rs${sz}" type="number" value="${rates[sz]}" oninput="saleState[${sz}].rate=parseFloat(this.value)||0;calcSale()" class="w-[60px] border-2 rounded-xl p-2 text-sm text-center"></div>`;}); document.getElementById('eggInputs').innerHTML=h; calcSale(); document.getElementById('saleModal').classList.remove('hidden');}
function chgSale(sz,d){saleState[sz].qty=Math.max(0,saleState[sz].qty+d); document.getElementById('qs'+sz).value=saleState[sz].qty; calcSale();}
function calcSale(){let s=shops.find(x=>x.id==curShopId); let today=0,eggs=0,det=[]; sizes.forEach(sz=>{let q=saleState[sz].qty,r=saleState[sz].rate; let e=sz*q; today+=e*r; eggs+=e; if(q>0) det.push(`W${sz}x${q}=${e}`);}); document.getElementById('saleToday').innerText=today; document.getElementById('saleGrand').innerText='Rs.'+(today+s.balance); document.getElementById('saleDetails').innerText=det.join(' | ')+' Eggs:'+eggs; return {today,grand:today+s.balance,eggs,det};}
function closeSale(){document.getElementById('saleModal').classList.add('hidden');}
function confirmSale(){let c=calcSale(); if(c.today==0) return alert('Qty'); let s=shops.find(x=>x.id==curShopId); s.balance=c.grand; s.totalSale+=c.today; let rec={id:Date.now(),shopId:s.id,shopName:s.name,area:s.area,type:'sale',total:c.today,balance:c.grand,eggs:c.eggs,details:c.det.join(', '),date:new Date().toISOString(),dateStr:new Date().toLocaleDateString()}; tx.unshift(rec); save(); closeSale(); renderShops(); autoSyncToSheet(s, rec);}
function openPay(id){curShopId=id; let s=shops.find(x=>x.id==id); document.getElementById('payTitle').innerText=s.name+' Paid'; document.getElementById('payAmount').value=''; document.getElementById('payInfo').innerHTML=`Bal Rs.${s.balance}`; document.getElementById('payModal').classList.remove('hidden');}
function closePay(){document.getElementById('payModal').classList.add('hidden');}
function confirmPay(){let amt=parseFloat(document.getElementById('payAmount').value); if(!amt) return alert('Amount'); let s=shops.find(x=>x.id==curShopId); s.balance-=amt; s.totalPaid+=amt; let rec={id:Date.now(),shopId:s.id,shopName:s.name,area:s.area,type:'payment',amount:amt,balance:s.balance,date:new Date().toISOString(),dateStr:new Date().toLocaleDateString()}; tx.unshift(rec); save(); closePay(); renderShops(); autoSyncToSheet(s, rec);}
function openReport(id){curShopId=id; let s=shops.find(x=>x.id==id); let list=tx.filter(t=>t.shopId==id); document.getElementById('repTitle').innerText=s.name+' ('+s.area+') Bal Rs.'+s.balance; let html=`<div class="grid grid-cols-3 gap-2 mb-3"><div class="bg-green-50 p-2 rounded-xl text-center text-xs">Sale<br><b>Rs.${s.totalSale}</b></div><div class="bg-blue-50 p-2 rounded-xl text-center text-xs">Paid<br><b>Rs.${s.totalPaid}</b></div><div class="bg-yellow-50 p-2 rounded-xl text-center text-xs">Bal<br><b>Rs.${s.balance}</b></div></div><div class="text-xs mb-2">📞 ${s.phone||'No phone'} | Old: Rs.${s.oldBalance}</div>`; html+=list.map(t=>{if(t.type=='sale') return `<div class="border-l-4 border-[#0a5c26] p-2 bg-gray-50 rounded-r-xl mb-2 text-xs"><b>SALE Rs.${t.total}</b> ${t.dateStr}<br>${t.details}</div>`; else return `<div class="border-l-4 border-blue-500 p-2 bg-blue-50 rounded-r-xl mb-2 text-xs"><b>PAID Rs.${t.amount}</b> ${t.dateStr} Bal ${t.balance}</div>`;}).join('')||'No data'; document.getElementById('repContent').innerHTML=html; document.getElementById('reportModal').classList.remove('hidden');}
function closeReport(){document.getElementById('reportModal').classList.add('hidden');}
function waShop(id){let s=shops.find(x=>x.id==id); let num=s.phone.replace(/[^0-9]/g,''); if(!num) return alert('Phone இல்லை'); if(num.length==9) num='94'+num; window.open('https://wa.me/'+num+'?text='+encodeURIComponent(s.name+' Bal Rs.'+s.balance));}
function openSheetConfig(){document.getElementById('sheetUrl').value=GOOGLE_SHEET_URL; document.getElementById('sheetModal').classList.remove('hidden');}
function closeSheetConfig(){document.getElementById('sheetModal').classList.add('hidden');}
function saveSheetUrl(){let url=document.getElementById('sheetUrl').value.trim(); GOOGLE_SHEET_URL=url; localStorage.setItem(GOOGLE_SHEET_URL_KEY, url); alert('Saved!'); closeSheetConfig();}
function autoSyncToSheet(shop, rec){if(!GOOGLE_SHEET_URL) return; fetch(GOOGLE_SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({area:shop.area,shopName:shop.name,phone:shop.phone,dateStr:rec.dateStr,type:rec.type,total:rec.total||0,amount:rec.amount||0,balance:rec.balance,details:rec.details||''})});}
function syncCurrentToSheet(){let s=shops.find(x=>x.id==curShopId); let list=tx.filter(t=>t.shopId==curShopId); if(!GOOGLE_SHEET_URL) return alert('Sheet Link Setup பண்ணுங்க! Bottom Sheet Setup Button'); if(!list.length) return alert('No data'); if(!confirm(s.name+' இன் '+list.length+' records Google Sheet க்கு அனுப்பவா?')) return; fetch(GOOGLE_SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({area:s.area,shopName:s.name,phone:s.phone,transactions:list})}); alert('✅ Google Sheet க்கு அனுப்பப்பட்டது! siyammujacool@gmail.com Sheet ஐ Check பண்ணுங்க');}
renderShops();
</script>
</body></html>
