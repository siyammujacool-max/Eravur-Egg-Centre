<!DOCTYPE html><html lang="ta"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ERAVUR EGG - CORRECT BAL</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#f4f7f2]">
<div id="loginScreen" class="fixed inset-0 bg-[#0a5c26] z-[100] flex items-center justify-center p-5"><div class="bg-white w-full max-w-sm rounded-[24px] p-6 text-center"><div class="text-5xl mb-2">🥚</div><h1 class="font-bold text-[#0a5c26]">ERAVUR EGG</h1><p class="text-[11px] text-gray-500 mb-4">Old - Paid = Balance ✅</p><input id="loginUser" class="w-full border-2 rounded-xl p-3 mb-2 text-sm" value="eravur"><input id="loginPin" type="password" class="w-full border-2 rounded-xl p-3 mb-3 text-sm" placeholder="PIN 1234"><button onclick="doLogin()" class="w-full bg-[#0a5c26] text-white py-3 rounded-xl font-bold">Login</button></div></div>
<div id="app" class="hidden pb-[95px]"><div class="bg-[#0a5c26] text-white p-4 sticky top-0 z-50"><div class="flex justify-between"><h1 class="font-bold text-sm">🥚 ERAVUR EGG - BALANCE FIXED</h1><button onclick="localStorage.removeItem('egg_logged');location.reload()" class="bg-white/20 px-3 py-1 rounded-full text-xs">Logout</button></div><input id="search" oninput="render()" placeholder="தேடு - மன்சூர்..." class="w-full mt-3 px-4 py-2.5 rounded-full text-black text-sm outline-none"></div>
<div class="flex gap-2 p-3 overflow-x-auto"><button onclick="setA('ALL')" id="t-ALL" class="bg-[#0a5c26] text-white px-4 py-2 rounded-full text-xs font-bold">ALL</button><button onclick="setA('Oddamavadi')" id="t-Oddamavadi" class="bg-white px-4 py-2 rounded-full text-xs font-bold border">Oddamavadi</button><button onclick="setA('Chenkalady')" id="t-Chenkalady" class="bg-white px-4 py-2 rounded-full text-xs font-bold border">Chenkalady</button><button onclick="setA('Eravur')" id="t-Eravur" class="bg-white px-4 py-2 rounded-full text-xs font-bold border">Eravur</button></div>
<div id="list" class="px-3 space-y-3"></div>
<div class="fixed bottom-0 left-0 right-0 bg-white border-t p-2 flex justify-around"><button class="text-center"><div class="text-[10px] text-gray-500">மொத்த பாக்கி</div><div id="tot" class="font-bold text-[#0a5c26] text-sm">Rs.0</div></button><button onclick="openAllRep()" class="bg-[#0a5c26] text-white px-6 py-2 rounded-full font-bold text-xs">📊 REPORTS</button><button onclick="exportCSV()" class="text-center"><div class="text-lg">📥</div><div class="text-[9px]">Excel</div></button></div></div>

<div id="editModal" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-end justify-center"><div class="bg-white w-full rounded-t-[22px] p-5"><h3 id="editName" class="font-bold mb-2"></h3><p class="text-[11px] text-gray-500 mb-3">Old Balance + Total Sale - Total Paid = Balance என Auto Calculate ஆகும்</p><label class="text-xs font-bold">Old Balance (பழைய பாக்கி)</label><input id="eOld" type="number" class="w-full border-2 border-yellow-300 rounded-xl p-3 mb-2 font-bold bg-yellow-50"><div id="eInfo" class="bg-gray-50 p-3 rounded-xl text-xs mb-3"></div><div class="flex gap-2"><button onclick="closeEdit()" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="saveEdit()" class="flex-1 bg-[#0a5c26] text-white py-3 rounded-xl font-bold">Update</button></div></div></div>

<div id="saleM" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-end justify-center"><div class="bg-white w-full rounded-t-[22px] p-5 max-h-[90vh] overflow-y-auto"><div class="flex justify-between mb-2"><h3 id="sTitle" class="font-bold"></h3><span id="sBal" class="text-xs bg-yellow-100 px-2 py-1 rounded"></span></div><div id="sInputs" class="space-y-2"></div><div class="mt-3 p-3 bg-green-50 border-2 border-dashed rounded-xl text-center"><div class="text-xs">இன்றைய Bill: <b id="sToday">0</b> | புது Balance: <b id="sGrand" class="text-[#0a5c26]">0</b></div><div id="sDet" class="text-[10px] mt-1"></div></div><div class="flex gap-2 mt-3"><button onclick="document.getElementById('saleM').classList.add('hidden')" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="doSale()" class="flex-1 bg-[#0a5c26] text-white py-3 rounded-xl font-bold">Sale Save</button></div></div></div>

<div id="payM" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4"><div class="bg-white w-full max-w-sm rounded-[22px] p-5"><h3 id="pTitle" class="font-bold mb-2"></h3><div id="pCalc" class="bg-blue-50 p-3 rounded-xl text-xs mb-3"></div><label class="text-xs font-bold">Paid Amount (கட்டிய பணம்)</label><input id="pAmt" type="number" class="w-full border-2 border-blue-300 rounded-xl p-3 mb-3 font-bold text-lg"><div class="flex gap-2"><button onclick="document.getElementById('payM').classList.add('hidden')" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="doPay()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold">கழி - Paid</button></div></div></div>

<div id="repM" class="hidden fixed inset-0 bg-white z-[70] overflow-y-auto"><div class="bg-[#0a5c26] text-white p-4 flex justify-between sticky top-0"><h3 id="rTitle" class="font-bold text-sm"></h3><button onclick="document.getElementById('repM').classList.add('hidden')" class="bg-white/20 px-3 py-1 rounded-full">X</button></div><div id="rContent" class="p-4"></div></div>

<div id="allM" class="hidden fixed inset-0 bg-white z-[80] overflow-y-auto"><div class="bg-[#0a5c26] text-white p-4 flex justify-between sticky top-0"><h3 class="font-bold">📊 FULL REPORTS</h3><button onclick="document.getElementById('allM').classList.add('hidden')" class="bg-white/20 px-3 py-1 rounded-full">X</button></div><div id="allContent" class="p-4"></div></div>

<script>
const USER="eravur", PIN="1234";
let shops=JSON.parse(localStorage.getItem('egg_shops_fix')||'null');
if(!shops){
let d=[{area:"Oddamavadi",name:"ரஹுமான் ஹாஜியார்"},{area:"Oddamavadi",name:"ஜாமல்"},{area:"Oddamavadi",name:"post office கடை"},{area:"Oddamavadi",name:"ராபி டா நானா"},{area:"Oddamavadi",name:"ஹார்ட். கடை"},{area:"Oddamavadi",name:"மீரவோடை கடை"},{area:"Oddamavadi",name:"மீரவோடை புது கடை"},{area:"Oddamavadi",name:"அபுபக்கர்"},{area:"Oddamavadi",name:"வாளச்சேனை மரக்கறி கடை"},{area:"Oddamavadi",name:"ஜீவா"},{area:"Chenkalady",name:"R. தம்பி"},{area:"Chenkalady",name:"நிரோஷன்"},{area:"Chenkalady",name:"ஆனந்தன்"},{area:"Chenkalady",name:"வெற்றில கடை"},{area:"Chenkalady",name:"வசந்தன்"},{area:"Chenkalady",name:"ரஜனி மகன்"},{area:"Chenkalady",name:"கருவாட்டு கடை"},{area:"Chenkalady",name:"பிரபாஸ் hotel"},{area:"Chenkalady",name:"மலர் food city"},{area:"Chenkalady",name:"Bar. MA"},{area:"Chenkalady",name:"மதுராம் hotel"},{area:"Eravur",name:"ரிபாஸ்",old:10000,phone:"774540269"},{area:"Eravur",name:"மன்சூர்",old:362960,phone:""},{area:"Eravur",name:"மன்சூர் 2"},{area:"Eravur",name:"சபீர் மௌலவி"},{area:"Eravur",name:"பதுரியா 1"},{area:"Eravur",name:"புகாரி மருமகன்"},{area:"Eravur",name:"colombu store"},{area:"Eravur",name:"நதிர்"},{area:"Eravur",name:"நஜீம்"},{area:"Eravur",name:"மௌனுதீன்"}];
shops=d.map((s,i)=>({id:Date.now()+i,name:s.name,area:s.area,phone:s.phone||"",oldBalance:s.old||0,totalSale:0,totalPaid:0,balance:s.old||0}));
let oldData=JSON.parse(localStorage.getItem('egg_shops_v2')||'[]'); if(oldData.length>0){ shops=oldData.map(o=>{ let n=shops.find(x=>x.name==o.name); return {...o, balance:(o.oldBalance||0)+(o.totalSale||0)-(o.totalPaid||0)};});}
localStorage.setItem('egg_shops_fix',JSON.stringify(shops));
}
let tx=JSON.parse(localStorage.getItem('egg_tx_fix')|| localStorage.getItem('egg_tx_v2')|| '[]');
let curA='ALL', curId=null, saleSt={}, rates={240:24,260:26,280:28,300:30}, sizes=[240,260,280,300];
function save(){localStorage.setItem('egg_shops_fix',JSON.stringify(shops));localStorage.setItem('egg_tx_fix',JSON.stringify(tx));}
function doLogin(){let u=document.getElementById('loginUser').value, p=document.getElementById('loginPin').value; if(u==USER&&p==PIN){localStorage.setItem('egg_logged','yes');document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render();}else alert('eravur / 1234');}
if(localStorage.getItem('egg_logged')=='yes'){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');}
function setA(a){curA=a; document.querySelectorAll('[id^=t-]').forEach(b=>b.className='bg-white px-4 py-2 rounded-full text-xs font-bold border'); document.getElementById('t-'+a).className='bg-[#0a5c26] text-white px-4 py-2 rounded-full text-xs font-bold'; render();}
function recalc(s){ s.balance = (s.oldBalance||0) + (s.totalSale||0) - (s.totalPaid||0); }
function render(){ let q=document.getElementById('search').value.toLowerCase(); let f=shops.filter(s=>(curA=='ALL'||s.area==curA)&&s.name.toLowerCase().includes(q)); let h=''; f.forEach(s=>{ recalc(s); h+=`<div onclick="openRep(${s.id})" class="bg-white rounded-[16px] p-4 border-l-[5px] border-[#0a5c26] shadow"><div class="flex justify-between"><div><div class="font-bold text-[14px]">${s.name} <span class="text-[9px] bg-gray-100 px-2 py-0.5 rounded-full">${s.area}</span></div><div class="text-[11px] text-gray-600 mt-1">Old:${s.oldBalance} | Sale:${s.totalSale} | Paid:${s.totalPaid}</div><div class="text-[12px] font-bold mt-1 ${s.balance>0?'text-red-600':'text-green-600'}">மீதி Bal Rs.${s.balance}</div></div><button onclick="event.stopPropagation();openEdit(${s.id})" class="h-8 w-8 bg-yellow-50 rounded-full">✏️</button></div><div class="grid grid-cols-4 gap-2 mt-3"><button onclick="event.stopPropagation();openSale(${s.id})" class="bg-[#0a5c26] text-white py-2 rounded-xl text-xs font-bold">Sale</button><button onclick="event.stopPropagation();openPay(${s.id})" class="bg-blue-600 text-white py-2 rounded-xl text-xs font-bold">Paid</button><button onclick="event.stopPropagation();openRep(${s.id})" class="bg-gray-100 py-2 rounded-xl text-xs">Report</button><button onclick="event.stopPropagation();sendWA(${s.id})" class="bg-green-500 text-white py-2 rounded-xl text-xs">WA</button></div></div>`;}); document.getElementById('list').innerHTML=h||'<div class="text-center mt-10 text-gray-400">No shops</div>'; document.getElementById('tot').innerText='Rs.'+shops.reduce((a,b)=>{recalc(b);return a+b.balance;},0); save();}

function openEdit(id){curId=id; let s=shops.find(x=>x.id==id); document.getElementById('editName').innerText=s.name+' - Edit Old Balance'; document.getElementById('eOld').value=s.oldBalance; document.getElementById('eInfo').innerHTML=`Old: ${s.oldBalance}<br>Sale: ${s.totalSale}<br>Paid: ${s.totalPaid}<br><b>Balance = ${s.oldBalance}+${s.totalSale}-${s.totalPaid} = ${s.balance}</b>`; document.getElementById('editModal').classList.remove('hidden');}
function closeEdit(){document.getElementById('editModal').classList.add('hidden');}
function saveEdit(){let s=shops.find(x=>x.id==curId); s.oldBalance=parseFloat(document.getElementById('eOld').value)||0; recalc(s); save(); closeEdit(); render();}

function openSale(id){curId=id; saleSt={}; sizes.forEach(sz=>saleSt[sz]={qty:0,rate:rates[sz]}); let s=shops.find(x=>x.id==id); document.getElementById('sTitle').innerText=s.name; document.getElementById('sBal').innerText='Bal '+s.balance; let ht=''; sizes.forEach(sz=>{ht+=`<div class="flex items-center gap-2"><div class="w-[55px] font-bold text-sm">W${sz}</div><div class="flex-1 flex border-2 rounded-xl overflow-hidden"><button onclick="chg(${sz},-1)" class="px-3 py-2 bg-green-50 font-bold">-</button><input id="q${sz}" type="number" value="0" oninput="saleSt[${sz}].qty=parseInt(this.value)||0;calc()" class="flex-1 text-center font-bold"><button onclick="chg(${sz},1)" class="px-3 py-2 bg-green-50 font-bold">+</button></div><input id="r${sz}" type="number" value="${rates[sz]}" oninput="saleSt[${sz}].rate=parseFloat(this.value)||0;calc()" class="w-[60px] border-2 rounded-xl p-2 text-center text-sm"></div>`;}); document.getElementById('sInputs').innerHTML=ht; calc(); document.getElementById('saleM').classList.remove('hidden');}
function chg(sz,d){saleSt[sz].qty=Math.max(0,saleSt[sz].qty+d); document.getElementById('q'+sz).value=saleSt[sz].qty; calc();}
function calc(){let s=shops.find(x=>x.id==curId); let today=0,eggs=0,det=[]; sizes.forEach(sz=>{let q=saleSt[sz].qty,r=saleSt[sz].rate; today+=sz*q*r; eggs+=sz*q; if(q>0) det.push(`W${sz}x${q}`);}); document.getElementById('sToday').innerText=today; document.getElementById('sGrand').innerText=s.balance+today; document.getElementById('sDet').innerText=det.join(' | ')+' Eggs:'+eggs; return {today,grand:s.balance+today,eggs,det};}
function doSale(){let c=calc(); if(c.today==0) return alert('Qty போடுங்க'); let s=shops.find(x=>x.id==curId); s.totalSale+=c.today; recalc(s); tx.unshift({id:Date.now(),shopId:s.id,shopName:s.name,area:s.area,type:'sale',total:c.today,balance:s.balance,eggs:c.eggs,details:c.det.join(','),dateStr:new Date().toLocaleDateString(),date:new Date().toISOString()}); save(); document.getElementById('saleM').classList.add('hidden'); render();}

function openPay(id){curId=id; let s=shops.find(x=>x.id==id); document.getElementById('pTitle').innerText=s.name+' - பணம் கட்டுதல்'; document.getElementById('pCalc').innerHTML=`Old: ${s.oldBalance} + Sale: ${s.totalSale} - Paid: ${s.totalPaid} = <b>Bal Rs.${s.balance}</b><br><br>இப்போ கட்டினா மீதி Auto கழியும்`; document.getElementById('pAmt').value=''; document.getElementById('payM').classList.remove('hidden'); document.getElementById('pAmt').oninput=function(){let amt=parseFloat(this.value)||0; document.getElementById('pCalc').innerHTML=`Bal Rs.${s.balance} - Paid Rs.${amt} = <b class="text-green-600">New Bal Rs.${s.balance-amt}</b>`;};}
function doPay(){let amt=parseFloat(document.getElementById('pAmt').value); if(!amt) return alert('Amount'); let s=shops.find(x=>x.id==curId); s.totalPaid+=amt; recalc(s); tx.unshift({id:Date.now(),shopId:s.id,shopName:s.name,area:s.area,type:'payment',amount:amt,balance:s.balance,dateStr:new Date().toLocaleDateString(),date:new Date().toISOString()}); save(); document.getElementById('payM').classList.add('hidden'); render();}

function openRep(id){curId=id; let s=shops.find(x=>x.id==id); let list=tx.filter(t=>t.shopId==id); document.getElementById('rTitle').innerText=s.name+' | Old:'+s.oldBalance+' | Bal:'+s.balance; let html=`<div class="grid grid-cols-4 gap-2 mb-3 text-center text-[11px]"><div class="bg-yellow-50 p-2 rounded-xl"><div>Old</div><b>${s.oldBalance}</b></div><div class="bg-green-50 p-2 rounded-xl"><div>Sale</div><b>${s.totalSale}</b></div><div class="bg-blue-50 p-2 rounded-xl"><div>Paid</div><b>${s.totalPaid}</b></div><div class="bg-red-50 p-2 rounded-xl"><div>Bal</div><b class="text-red-600">${s.balance}</b></div></div><div class="bg-[#0a5c26] text-white p-2 rounded-xl text-center text-xs mb-3">Formula: ${s.oldBalance} + ${s.totalSale} - ${s.totalPaid} = <b>Rs.${s.balance}</b></div>`; html+=list.map(t=>{if(t.type=='sale') return `<div class="border-l-4 border-[#0a5c26] p-2 bg-gray-50 rounded-r-xl mb-2 text-xs"><b>SALE Rs.${t.total}</b> ${t.dateStr} | Bal Rs.${t.balance}<br>${t.details}</div>`; else return `<div class="border-l-4 border-blue-500 p-2 bg-blue-50 rounded-r-xl mb-2 text-xs"><b>PAID Rs.${t.amount} ✅ கழிக்கப்பட்டது</b> ${t.dateStr}<br>மீதி Rs.${t.balance}</div>`;}).join('')||'<div class="text-center text-gray-400 text-xs">No transactions</div>'; document.getElementById('rContent').innerHTML=html; document.getElementById('repM').classList.remove('hidden');}
function openAllRep(){let totO=shops.reduce((a,b)=>a+b.oldBalance,0), totS=shops.reduce((a,b)=>a+b.totalSale,0), totP=shops.reduce((a,b)=>a+b.totalPaid,0), totB=shops.reduce((a,b)=>a+b.balance,0); let top=[...shops].sort((a,b)=>b.balance-a.balance).slice(0,15); let html=`<div class="grid grid-cols-2 gap-3 mb-4"><div class="bg-[#0a5c26] text-white p-4 rounded-2xl"><div class="text-[11px] opacity-80">மொத்த பாக்கி (Old+Sale-Paid)</div><div class="text-xl font-bold">Rs.${totB}</div><div class="text-[10px]">Old ${totO} + Sale ${totS} - Paid ${totP}</div></div><div class="bg-blue-600 text-white p-4 rounded-2xl"><div class="text-[11px]">மொத்த கடைகள்</div><div class="text-xl font-bold">${shops.length}</div><div class="text-[10px]">${shops.filter(s=>s.balance>0).length} பாக்கி உள்ளவர்கள்</div></div></div><div class="mb-4"><div class="font-bold text-sm mb-2">🔝 அதிக பாக்கி (Top)</div>${top.map((s,i)=>`<div class="flex justify-between bg-white border p-2 rounded-xl mb-1 text-xs"><span>${i+1}. ${s.name} (${s.area}) Old:${s.oldBalance} Paid:${s.totalPaid}</span><b class="text-red-600">Rs.${s.balance}</b></div>`).join('')}</div>`; document.getElementById('allContent').innerHTML=html; document.getElementById('allM').classList.remove('hidden');}
function sendWA(id){let s=shops.find(x=>x.id==id); let msg=`🥚 ERAVUR EGG CENTRE\n${s.name}\nOld: ${s.oldBalance}\nSale: ${s.totalSale}\nPaid: ${s.totalPaid}\nமீதி Balance: Rs.${s.balance}`; window.open(`https://wa.me/${s.phone? '94'+s.phone.replace(/[^0-9]/g,'').slice(-9):''}?text=${encodeURIComponent(msg)}`);}
function exportCSV(){let csv="Name,Area,Old,TotalSale,TotalPaid,Balance=Old+Sale-Paid\n"+shops.map(s=>`"${s.name}","${s.area}",${s.oldBalance},${s.totalSale},${s.totalPaid},${s.balance}`).join('\n'); let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='Eravur_Balance_'+new Date().toLocaleDateString()+'.csv'; a.click();}
render();
</script></body></html>
