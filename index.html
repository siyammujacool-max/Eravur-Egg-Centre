<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ERAVUR FIXED</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#f4f7f2]">
<div id="loginScreen" class="fixed inset-0 bg-[#0a5c26] z-[100] flex items-center justify-center p-5"><div class="bg-white w-full max-w-sm rounded-[24px] p-6 text-center"><div style="font-size:40px">🥚</div><h1 class="font-bold">ERAVUR FIXED SYNC</h1><input id="lu" class="w-full border-2 rounded-xl p-3 mb-2" value="eravur"><input id="lp" type="password" class="w-full border-2 rounded-xl p-3 mb-3" value="1234"><button onclick="doLogin()" class="w-full bg-[#0a5c26] text-white py-3 rounded-xl font-bold">Login</button></div></div>
<div id="app" class="hidden pb-[140px]"><div class="bg-[#0a5c26] text-white p-4 sticky top-0 z-50"><div class="flex justify-between"><h1 class="font-bold text-[11px]">🥚 FIXED TELEGRAM SYNC</h1><span id="syncDot" class="bg-green-400 text-black px-2 py-1 rounded-full text-[8px]">Token Fixed</span></div>
<div class="mt-3 bg-white/10 rounded-xl p-2"><div class="text-[9px] font-bold mb-1">📲 Auto Configured</div><div class="flex gap-1"><input id="botToken" class="flex-1 px-2 py-1.5 rounded text-black text-[8px]"><input id="chatId" class="w-[90px] px-2 py-1.5 rounded text-black text-[10px]"></div><div class="flex gap-1 mt-1"><button onclick="saveTG()" class="bg-white/20 px-2 py-1 rounded-full text-[9px]">Save</button><button onclick="syncToTelegram()" class="bg-yellow-400 text-black px-3 py-1 rounded-full text-[9px] font-bold">⬆️ Sync to TG</button><button onclick="loadFromTelegram()" class="bg-green-400 text-black px-3 py-1 rounded-full text-[9px] font-bold">⬇️ Load</button></div><div id="tgStatus" class="text-[8px] mt-1">Ready - Click Sync to TG</div></div>

<div class="flex gap-2 p-3 overflow-x-auto flex-wrap"><button onclick="setA('ALL')" id="t-ALL" class="bg-[#0a5c26] text-white px-4 py-2 rounded-full text-xs font-bold">ALL</button><button onclick="setA('Oddamavadi')" class="bg-white border px-4 py-2 rounded-full text-xs">Oddamavadi</button><button onclick="setA('Chenkalady')" class="bg-white border px-4 py-2 rounded-full text-xs">Chenkalady</button><button onclick="setA('Eravur')" class="bg-white border px-4 py-2 rounded-full text-xs">Eravur</button><button onclick="openAdd()" class="bg-yellow-400 text-black px-4 py-2 rounded-full text-xs font-bold">+ New</button></div>

<div id="editM" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-end justify-center"><div class="bg-white w-full rounded-t-[24px] p-5"><input id="eName" class="w-full border-2 rounded-xl p-3 mb-2 text-sm"><select id="eArea" class="w-full border-2 rounded-xl p-3 mb-2 text-sm"><option>Oddamavadi</option><option>Chenkalady</option><option>Eravur</option></select><input id="ePhone" class="w-full border-2 rounded-xl p-3 mb-2 text-sm"><input id="eOld" type="number" class="w-full border-2 rounded-xl p-3 mb-3 font-bold"><div class="flex gap-2"><button onclick="document.getElementById('editM').classList.add('hidden')" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="saveEdit()" class="flex-1 bg-[#0a5c26] text-white py-3 rounded-xl font-bold">Save</button></div></div></div>
<div id="addM" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4"><div class="bg-white w-full max-w-sm rounded-[24px] p-5"><input id="aName" placeholder="Name" class="w-full border-2 rounded-xl p-3 mb-2 text-sm"><select id="aArea" class="w-full border-2 rounded-xl p-3 mb-2 text-sm"><option>Oddamavadi</option><option>Chenkalady</option><option selected>Eravur</option></select><input id="aPhone" placeholder="Phone" class="w-full border-2 rounded-xl p-3 mb-2 text-sm"><input id="aOld" type="number" placeholder="Old Balance" class="w-full border-2 rounded-xl p-3 mb-3 text-sm"><div class="flex gap-2"><button onclick="document.getElementById('addM').classList.add('hidden')" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="doAdd()" class="flex-1 bg-yellow-400 py-3 rounded-xl font-bold">Add</button></div></div></div>
<div id="saleM" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-end justify-center"><div class="bg-white w-full rounded-t-[24px] p-5 max-h-[92vh] overflow-y-auto"><h3 id="sTitle" class="font-bold text-sm mb-2"></h3><input id="sDate" type="date" class="w-full border-2 border-blue-300 bg-blue-50 rounded-xl p-3 mb-3 text-sm font-bold"><div id="sInputs" class="space-y-3"></div><div class="mt-4 p-3 bg-green-50 border-2 border-green-400 rounded-xl"><div id="sLiveCalc" class="text-[11px] font-mono"></div><div class="border-t-2 border-dashed mt-2 pt-2 text-center"><div class="text-xs">Total: <b id="sToday" class="text-lg text-green-700">0</b></div></div></div><div class="flex gap-2 mt-3"><button onclick="document.getElementById('saleM').classList.add('hidden')" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="doSale()" class="flex-1 bg-[#0a5c26] text-white py-3 rounded-xl font-bold">Add Sale</button></div></div></div>
<div id="saleEditM" class="hidden fixed inset-0 bg-black/50 z-[85] flex items-end justify-center"><div class="bg-white w-full rounded-t-[24px] p-5 max-h-[92vh] overflow-y-auto"><div class="flex justify-between mb-2"><h3 id="seTitle" class="font-bold text-sm text-red-600">SALE EDIT</h3><button onclick="document.getElementById('saleEditM').classList.add('hidden')" class="bg-gray-100 px-3 py-1 rounded-full">X</button></div><input id="seDate" type="date" class="w-full border-2 border-orange-300 bg-orange-50 rounded-xl p-3 mb-3 text-sm font-bold"><div id="seInputs" class="space-y-3"></div><div class="mt-4 p-3 bg-orange-50 border-2 border-orange-400 rounded-xl"><div id="seLiveCalc" class="text-[11px] font-mono mt-1"></div><div class="border-t-2 border-dashed mt-2 pt-2 text-center"><div class="text-xs">Old: <span id="seOldTot" class="line-through"></span> New: <b id="seNewTot" class="text-lg text-orange-700">0</b></div></div></div><div class="flex gap-2 mt-3"><button onclick="document.getElementById('saleEditM').classList.add('hidden')" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="doUpdateSale()" class="flex-1 bg-orange-600 text-white py-3 rounded-xl font-bold">Update</button></div></div></div>
<div id="payM" class="hidden fixed inset-0 bg-black/50 z-[70] flex items-center justify-center p-4"><div class="bg-white w-full max-w-sm rounded-[24px] p-5"><h3 id="pTitle" class="font-bold mb-2"></h3><input id="pDate" type="date" class="w-full border-2 rounded-xl p-2 mb-2 text-sm"><div id="pCalc" class="bg-gray-50 p-3 rounded-xl text-xs mb-3"></div><div class="grid grid-cols-2 gap-2 mb-3"><button id="payOldBtn" onclick="setPayType('old')" class="border-2 py-3 rounded-xl font-bold text-xs">OLD</button><button id="paySaleBtn" onclick="setPayType('sale')" class="border-2 py-3 rounded-xl font-bold text-xs">SALE</button></div><input id="pAmt" type="number" class="w-full border-2 rounded-xl p-3 mb-3 font-bold text-lg"><div id="pPreview" class="text-xs bg-blue-50 p-2 rounded-xl mb-3 hidden"></div><div class="flex gap-2"><button onclick="document.getElementById('payM').classList.add('hidden')" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="doPay()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold">Paid</button></div></div></div>
<div id="repM" class="hidden fixed inset-0 bg-white z-[70] overflow-y-auto"><div class="bg-[#0a5c26] text-white p-4 flex justify-between sticky top-0"><div><h3 id="rTitle" class="font-bold text-[11px]"></h3><div id="rPhone" class="text-[10px] opacity-80"></div></div><button onclick="document.getElementById('repM').classList.add('hidden')" class="bg-white/20 px-3 py-1 rounded-full">X</button></div><div id="rContent" class="p-4"></div></div>
<script>
const USER="eravur",PIN="1234",FIXED_TOKEN="8962292487:AAFN_r6yzT3sa918cK5Z05WIFA47J3ZjHc",FIXED_CHAT="632676752";
let shops=JSON.parse(localStorage.getItem('egg_MASTER')||'[]');let tx=JSON.parse(localStorage.getItem('egg_tx_MASTER')||'[]');if(shops.length==0)shops=[{id:1,name:"ரிபாஸ்",area:"Eravur",phone:"",oldBalance:0,oldPaid:0,totalSale:23760,salePaid:0}];if(tx.length==0)tx=[{id:1,shopId:1,shopName:"ரிபாஸ்",area:"Eravur",type:'sale',total:23760,for:'sale',dateStr:new Date().toLocaleDateString(),dateISO:new Date().toISOString().split('T')[0],details:'W240x3',calcDetails:['W240: 240 x 3 x 33 = 23760'],breakdown:{240:{qty:3,rate:33},260:{qty:0,rate:33},280:{qty:0,rate:28},300:{qty:0,rate:30}}}];function saveMaster(){localStorage.setItem('egg_MASTER',JSON.stringify(shops));localStorage.setItem('egg_tx_MASTER',JSON.stringify(tx));}
(function(){document.getElementById('botToken').value=localStorage.getItem('tg_token')||FIXED_TOKEN;document.getElementById('chatId').value=localStorage.getItem('tg_chat')||FIXED_CHAT;localStorage.setItem('tg_token',document.getElementById('botToken').value);localStorage.setItem('tg_chat',document.getElementById('chatId').value);})();
function saveTG(){localStorage.setItem('tg_token',document.getElementById('botToken').value);localStorage.setItem('tg_chat',document.getElementById('chatId').value);document.getElementById('tgStatus').innerText='Saved!';}
async function syncToTelegram(){let token=document.getElementById('botToken').value.trim();let chatId=document.getElementById('chatId').value.trim();if(!token||!chatId){alert('Token missing');return;}document.getElementById('tgStatus').innerText='Uploading...';let data={shops:shops,tx:tx,updated:new Date().toISOString()};let blob=new Blob([JSON.stringify(data)],{type:'application/json'});let form=new FormData();form.append('chat_id',chatId);form.append('document',blob,'eravur_backup_'+Date.now()+'.json');form.append('caption','Backup '+shops.length+' '+new Date().toLocaleString());try{let res=await fetch('https://api.telegram.org/bot'+token+'/sendDocument',{method:'POST',body:form});let j=await res.json();if(j.ok){document.getElementById('tgStatus').innerText='Sync OK '+new Date().toLocaleTimeString();alert('✅ Telegram Save OK!');}else{alert('❌ Error:'+j.description);document.getElementById('tgStatus').innerText='Error:'+j.description;}}catch(e){alert(e.message);}}
async function loadFromTelegram(){let token=document.getElementById('botToken').value.trim();let chatId=document.getElementById('chatId').value.trim();document.getElementById('tgStatus').innerText='Loading...';try{let res=await fetch('https://api.telegram.org/bot'+token+'/getUpdates?limit=20');let j=await res.json();let docs=j.result.filter(u=>u.message&&u.message.document).reverse();if(docs.length==0){alert('No backup yet!');return;}let fileId=docs[0].message.document.file_id;let fileRes=await fetch('https://api.telegram.org/bot'+token+'/getFile?file_id='+fileId);let fileJ=await fileRes.json();let filePath=fileJ.result.file_path;let downloadUrl='https://api.telegram.org/file/bot'+token+'/'+filePath;let dataRes=await fetch(downloadUrl);let data=await dataRes.json();shops=data.shops||[];tx=data.tx||[];saveMaster();render();document.getElementById('tgStatus').innerText='Loaded '+shops.length;alert('Load OK');}catch(e){alert('Load failed:'+e.message);}}
let curA='ALL',curId=null,curEditTxId=null,saleSt={},editSaleSt={},payType='sale',rates={240:33,260:33,280:28,300:30},sizes=[240,260,280,300];
function doLogin(){if(document.getElementById('lu').value==USER&&document.getElementById('lp').value==PIN){localStorage.setItem('egg_logged','yes');document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render();}else alert('eravur 1234');}
if(localStorage.getItem('egg_logged')=='yes'){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');}
function setA(a){curA=a;render();}function getRem(s){let o=(s.oldBalance||0)-(s.oldPaid||0);let sa=(s.totalSale||0)-(s.salePaid||0);return{oldRem:o,saleRem:sa,total:o+sa};}
function render(){let q=document.getElementById('search').value.toLowerCase();let f=shops.filter(s=>(curA=='ALL'||s.area==curA)&&s.name.toLowerCase().includes(q));document.getElementById('t-ALL').innerText='ALL ('+shops.length+')';let h='';f.forEach(s=>{let r=getRem(s);h+='<div class="bg-white rounded-[16px] p-4 border-l-[5px] border-[#0a5c26] shadow"><div onclick="openRep('+s.id+')" class="flex justify-between"><div class="flex-1"><div class="font-bold text-[14px]">'+s.name+' <span class="text-[9px] bg-green-100 px-2 py-0.5 rounded-full">'+s.area+'</span></div><div class="grid grid-cols-2 gap-2 mt-2 text-[11px]"><div class="bg-orange-50 border p-2 rounded-xl">OLD:'+r.oldRem+'</div><div class="bg-green-50 border p-2 rounded-xl">SALE:'+r.saleRem+'</div></div><div class="mt-2 text-[11px] font-bold text-red-600">TOTAL '+r.total+'</div></div><button onclick="openEdit('+s.id+')" class="h-8 w-8 bg-yellow-50 rounded-full ml-2">Edit</button></div><div class="grid grid-cols-3 gap-2 mt-3"><button onclick="openSale('+s.id+')" class="bg-[#0a5c26] text-white py-2 rounded-xl text-[11px] font-bold">Sale+</button><button onclick="openPay('+s.id+')" class="bg-blue-600 text-white py-2 rounded-xl text-[11px] font-bold">Paid</button><button onclick="openRep('+s.id+')" class="bg-gray-800 text-white py-2 rounded-xl text-[11px] font-bold">Report</button></div></div>';});document.getElementById('list').innerHTML=h||'No shops';let totOld=shops.reduce((a,b)=>a+getRem(b).oldRem,0),totSale=shops.reduce((a,b)=>a+getRem(b).saleRem,0);document.getElementById('totOld').innerText=totOld;document.getElementById('totSale').innerText=totSale;document.getElementById('tot').innerText=totOld+totSale;saveMaster();}
function openAdd(){document.getElementById('addM').classList.remove('hidden');}function doAdd(){let n=document.getElementById('aName').value.trim(),a=document.getElementById('aArea').value,p=document.getElementById('aPhone').value.trim(),o=parseFloat(document.getElementById('aOld').value)||0;if(!n)return;shops.unshift({id:Date.now(),name:n,area:a,phone:p,oldBalance:o,oldPaid:0,totalSale:0,salePaid:0});saveMaster();document.getElementById('addM').classList.add('hidden');render();}
function openEdit(id){curId=id;let s=shops.find(x=>x.id==id);document.getElementById('eName').value=s.name;document.getElementById('eArea').value=s.area;document.getElementById('ePhone').value=s.phone;document.getElementById('eOld').value=s.oldBalance;document.getElementById('editM').classList.remove('hidden');}function saveEdit(){let s=shops.find(x=>x.id==curId);s.name=document.getElementById('eName').value.trim();s.area=document.getElementById('eArea').value;s.phone=document.getElementById('ePhone').value.trim();s.oldBalance=parseFloat(document.getElementById('eOld').value)||0;saveMaster();document.getElementById('editM').classList.add('hidden');render();}
function openSale(id){curId=id;saleSt={};sizes.forEach(sz=>saleSt[sz]={qty:0,rate:rates[sz]});document.getElementById('sTitle').innerText=shops.find(x=>x.id==id).name+' Sale';document.getElementById('sDate').valueAsDate=new Date();let ht='';sizes.forEach(sz=>{ht+='<div class="border-2 rounded-xl p-2 bg-gray-50"><div class="flex items-center gap-2"><div class="w-[55px] font-bold text-sm">W'+sz+'</div><div class="flex-1 flex border-2 rounded-xl overflow-hidden bg-white"><button onclick="chg('+sz+',-1,&apos;add&apos;)" class="px-4 py-2 bg-green-50 font-bold">-</button><input id="q'+sz+'" type="number" value="0" oninput="saleSt['+sz+'].qty=parseInt(this.value)||0;calc(&apos;add&apos;)" class="flex-1 text-center font-bold"><button onclick="chg('+sz+',1,&apos;add&apos;)" class="px-4 py-2 bg-green-50 font-bold">+</button></div><div class="w-[70px]"><input id="r'+sz+'" type="number" value="'+rates[sz]+'" oninput="saleSt['+sz+'].rate=parseFloat(this.value)||0;calc(&apos;add&apos;)" class="w-full border-2 rounded-xl p-2 text-center font-bold bg-yellow-50"></div></div><div id="calc'+sz+'" class="text-[10px] font-mono mt-1 text-green-700 hidden"></div></div>';});document.getElementById('sInputs').innerHTML=ht;calc('add');document.getElementById('saleM').classList.remove('hidden');}
function chg(sz,d,mode){let st=mode=='add'?saleSt:editSaleSt;st[sz].qty=Math.max(0,st[sz].qty+d);document.getElementById((mode=='add'?'q':'eq')+sz).value=st[sz].qty;calc(mode);}
function calc(mode){let st=mode=='add'?saleSt:editSaleSt;let today=0,det=[],calcLines=[];sizes.forEach(sz=>{let qty=st[sz].qty||0,rate=st[sz].rate||0;let amt=sz*qty*rate;let el=document.getElementById((mode=='add'?'calc':'ecalc')+sz);if(qty>0){today+=amt;det.push('W'+sz+'x'+qty);calcLines.push('W'+sz+': '+sz+' x '+qty+' x '+rate+' = '+amt);if(el){el.innerText=sz+' x '+qty+' x '+rate+' = '+amt;el.classList.remove('hidden');}}else{if(el)el.classList.add('hidden');}});if(mode=='add'){document.getElementById('sLiveCalc').innerHTML=calcLines.length?calcLines.map(l=>'<div>'+l+'</div>').join('')+'<div class="border-t mt-1 pt-1 font-bold">Total='+today+'</div>':'Qty';document.getElementById('sToday').innerText=today;}else{document.getElementById('seLiveCalc').innerHTML=calcLines.length?calcLines.map(l=>'<div>'+l+'</div>').join('')+'<div class="border-t mt-1 pt-1 font-bold">New='+today+'</div>':'Qty 0';document.getElementById('seNewTot').innerText=today;}return{today,det,calcLines};}
function doSale(){let c=calc('add');if(c.today==0)return alert('Qty');let s=shops.find(x=>x.id==curId);let dateVal=document.getElementById('sDate').value;let dateStr=dateVal?new Date(dateVal).toLocaleDateString():new Date().toLocaleDateString();s.totalSale+=c.today;let breakdown={};sizes.forEach(sz=>breakdown[sz]={qty:saleSt[sz].qty,rate:saleSt[sz].rate});tx.unshift({id:Date.now(),shopId:s.id,shopName:s.name,area:s.area,type:'sale',total:c.today,details:c.det.join(','),calcDetails:c.calcLines,breakdown:breakdown,dateStr:dateStr,dateISO:dateVal||new Date().toISOString().split('T')[0],for:'sale'});saveMaster();document.getElementById('saleM').classList.add('hidden');render();}
function openSaleEdit(txId){let t=tx.find(x=>x.id==txId);if(!t)return;curEditTxId=txId;curId=t.shopId;editSaleSt={};if(t.breakdown){sizes.forEach(sz=>{editSaleSt[sz]={qty:t.breakdown[sz]?.qty||0,rate:t.breakdown[sz]?.rate||rates[sz]};});}else{sizes.forEach(sz=>editSaleSt[sz]={qty:0,rate:rates[sz]});if(t.details){t.details.split(',').forEach(part=>{let m=part.match(/W(\d+)x(\d+)/);if(m){let sz=parseInt(m[1]);let q=parseInt(m[2]);if(editSaleSt[sz])editSaleSt[sz].qty=q;}});}}document.getElementById('seTitle').innerText=t.shopName+' '+t.dateStr+' Edit';document.getElementById('seDate').value=t.dateISO||new Date().toISOString().split('T')[0];document.getElementById('seOldTot').innerText=t.total;let ht='';sizes.forEach(sz=>{ht+='<div class="border-2 rounded-xl p-2 bg-orange-50"><div class="flex items-center gap-2"><div class="w-[55px] font-bold text-sm">W'+sz+'</div><div class="flex-1 flex border-2 rounded-xl overflow-hidden bg-white"><button onclick="chg('+sz+',-1,&apos;edit&apos;)" class="px-4 py-2 bg-orange-100 font-bold">-</button><input id="eq'+sz+'" type="number" value="'+editSaleSt[sz].qty+'" oninput="editSaleSt['+sz+'].qty=parseInt(this.value)||0;calc(&apos;edit&apos;)" class="flex-1 text-center font-bold"><button onclick="chg('+sz+',1,&apos;edit&apos;)" class="px-4 py-2 bg-orange-100 font-bold">+</button></div><div class="w-[70px]"><input id="er'+sz+'" type="number" value="'+editSaleSt[sz].rate+'" oninput="editSaleSt['+sz+'].rate=parseFloat(this.value)||0;calc(&apos;edit&apos;)" class="w-full border-2 border-orange-300 rounded-xl p-2 text-center font-bold bg-yellow-50"></div></div><div id="ecalc'+sz+'" class="text-[10px] font-mono mt-1 text-orange-700 hidden"></div></div>';});document.getElementById('seInputs').innerHTML=ht;calc('edit');document.getElementById('saleEditM').classList.remove('hidden');}
function doUpdateSale(){let c=calc('edit');let t=tx.find(x=>x.id==curEditTxId);if(!t)return;let s=shops.find(x=>x.id==t.shopId);let oldTotal=t.total;let newTotal=c.today;if(newTotal==0)return alert('Qty 0 Delete');s.totalSale=s.totalSale-oldTotal+newTotal;let breakdown={};sizes.forEach(sz=>breakdown[sz]={qty:editSaleSt[sz].qty,rate:editSaleSt[sz].rate});t.total=newTotal;t.details=c.det.join(',');t.calcDetails=c.calcLines;t.breakdown=breakdown;t.dateISO=document.getElementById('seDate').value;t.dateStr=new Date(t.dateISO).toLocaleDateString();saveMaster();document.getElementById('saleEditM').classList.add('hidden');openRep(s.id);render();}
function setPayType(t){payType=t;document.getElementById('payOldBtn').className=t=='old'?'border-2 border-orange-600 bg-orange-600 text-white py-3 rounded-xl font-bold text-xs':'border-2 bg-orange-50 py-3 rounded-xl font-bold text-xs';document.getElementById('paySaleBtn').className=t=='sale'?'border-2 border-green-600 bg-green-600 text-white py-3 rounded-xl font-bold text-xs':'border-2 bg-green-50 py-3 rounded-xl font-bold text-xs';updatePayPreview();}
function openPay(id){curId=id;payType='sale';setPayType('sale');document.getElementById('pDate').valueAsDate=new Date();let s=shops.find(x=>x.id==id);let r=getRem(s);document.getElementById('pTitle').innerText=s.name;document.getElementById('pCalc').innerHTML='<div class="grid grid-cols-2 gap-2 text-center"><div class="bg-orange-50 p-2 rounded-xl">OLD '+r.oldRem+'</div><div class="bg-green-50 p-2 rounded-xl">SALE '+r.saleRem+'</div></div>';document.getElementById('pAmt').value='';document.getElementById('pPreview').classList.add('hidden');document.getElementById('payM').classList.remove('hidden');document.getElementById('pAmt').oninput=updatePayPreview;}
function updatePayPreview(){let amt=parseFloat(document.getElementById('pAmt').value)||0;if(!amt){document.getElementById('pPreview').classList.add('hidden');return;}let s=shops.find(x=>x.id==curId);let r=getRem(s);let nOld=r.oldRem,nSale=r.saleRem;if(payType=='old')nOld=r.oldRem-amt;else nSale=r.saleRem-amt;document.getElementById('pPreview').classList.remove('hidden');document.getElementById('pPreview').innerHTML=payType+' '+amt+' -> Old:'+nOld+' Sale:'+nSale;}
function doPay(){let amt=parseFloat(document.getElementById('pAmt').value);if(!amt)return;let s=shops.find(x=>x.id==curId);let dateVal=document.getElementById('pDate').value;let dateStr=dateVal?new Date(dateVal).toLocaleDateString():new Date().toLocaleDateString();if(payType=='old')s.oldPaid+=amt;else s.salePaid+=amt;tx.unshift({id:Date.now(),shopId:s.id,shopName:s.name,area:s.area,type:'payment',amount:amt,for:payType,dateStr:dateStr,dateISO:dateVal||new Date().toISOString().split('T')[0]});saveMaster();document.getElementById('payM').classList.add('hidden');render();}
function openRep(id){curId=id;let s=shops.find(x=>x.id==id);let r=getRem(s);let list=tx.filter(t=>t.shopId==id).sort((a,b)=>new Date(b.dateISO)-new Date(a.dateISO));document.getElementById('rTitle').innerText=s.name+' ('+s.area+')';document.getElementById('rPhone').innerText='Old:'+r.oldRem+' Sale:'+r.saleRem+' Total:'+r.total;let html='<div class="grid grid-cols-2 gap-3 mb-4"><div class="bg-orange-50 border-2 p-3 rounded-2xl text-center"><div class="text-[10px] font-bold">OLD</div><div class="font-bold">'+r.oldRem+'</div></div><div class="bg-green-50 border-2 p-3 rounded-2xl text-center"><div class="text-[10px] font-bold">SALE</div><div class="font-bold">'+r.saleRem+'</div></div></div><div class="bg-[#0a5c26] text-white p-3 rounded-xl text-center mb-4 font-bold">TOTAL = '+r.total+'</div><div class="border-2 rounded-xl overflow-hidden"><table class="w-full text-[11px]"><tr class="bg-gray-800 text-white"><th class="p-2 border">Date</th><th class="p-2 border">Type</th><th class="p-2 border">Amount</th><th class="p-2 border">Action</th></tr>'+list.map(t=>{if(t.type=='sale'){let calcHtml=t.calcDetails?t.calcDetails.map(c=>'<div>'+c+'</div>').join(''):t.details;return '<tr class="bg-green-50"><td class="p-2 border text-[9px]">'+t.dateStr+'</td><td class="p-2 border font-bold text-green-700">SALE</td><td class="p-2 border font-bold">'+t.total+'</td><td class="p-2 border"><div class="font-mono text-[10px]">'+calcHtml+'</div><div class="flex gap-1 mt-2"><button onclick="openSaleEdit('+t.id+')" class="bg-orange-500 text-white px-2 py-1 rounded text-[9px] font-bold">Edit Qty/Rate</button><button onclick="delTx('+t.id+')" class="bg-red-100 px-2 py-1 rounded text-[9px]">Del</button></div></td></tr>';}else{return '<tr class="bg-blue-50"><td class="p-2 border text-[9px]">'+t.dateStr+'</td><td class="p-2 border font-bold text-blue-700">PAID-'+t.for+'</td><td class="p-2 border">'+t.amount+'</td><td class="p-2 border"><button onclick="delTx('+t.id+')" class="bg-red-100 px-2 py-1 rounded text-[9px]">Del</button></td></tr>';}}).join('')+'</table></div>';document.getElementById('rContent').innerHTML=html;document.getElementById('repM').classList.remove('hidden');}
function delTx(tid){if(!confirm('Delete?'))return;let t=tx.find(x=>x.id==tid);let s=shops.find(x=>x.id==t.shopId);if(t.type=='sale')s.totalSale-=t.total;else{if(t.for=='old')s.oldPaid-=t.amount;else s.salePaid-=t.amount;}tx=tx.filter(x=>x.id!=tid);saveMaster();openRep(s.id);render();}
