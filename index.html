<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERAVUR EGG V19.5.0</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-[#f0f4ec]">

<!-- LOGIN -->
<div id="loginScreen" class="fixed inset-0 bg-[#0a5c26] z-[100] flex items-center justify-center p-5">
  <div class="bg-white w-full max-w-sm rounded-[28px] p-8 text-center border-4 border-[#0a5c26]">
    <div class="w-24 h-24 mx-auto rounded-full border-4 border-[#0a5c26] bg-yellow-100 flex items-center justify-center text-5xl">🥚</div>
    <h1 class="text-xl font-black text-[#0a5c26] mt-3">ERAVUR EGG CENTRE</h1>
    <p class="text-[10px] bg-[#0a5c26] text-white px-3 py-1 rounded-full inline-block mt-1">V19.5.0 - SHARE FIX</p>
    <input id="loginUser" class="w-full border-2 border-black rounded-xl p-3 mt-5 font-bold" value="eravur">
    <input id="loginPin" type="password" class="w-full border-2 border-black rounded-xl p-3 mt-2 font-bold" value="1234">
    <button onclick="doLogin()" class="w-full bg-[#0a5c26] text-white py-3.5 rounded-xl mt-4 font-black border-2 border-black">Login</button>
  </div>
</div>

<!-- APP -->
<div id="appContent" class="hidden pb-[110px]">
  <div class="bg-[#0a5c26] text-white p-3 pb-4 sticky top-0 z-40">
    <div class="flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-10 h-10 rounded-full border-2 border-white bg-yellow-100 flex items-center justify-center text-xl">🥚</div>
        <div><div class="font-black text-[13px]">ERAVUR EGG</div><div class="text-[9px]" id="syncStatus">Loading...</div></div>
      </div>
      <div class="flex gap-1">
        <button onclick="openPriceSettings()" class="bg-yellow-400 text-black px-2 py-1.5 rounded-full text-[9px] font-black border-2 border-black">⚙️<br>விலை</button>
        <button onclick="seedBackupToCloud()" class="bg-white text-black px-2 py-1.5 rounded-full text-[9px] font-black border-2 border-black">📤<br>Cloud</button>
        <button onclick="doLogout()" class="bg-white/20 px-2 py-1.5 rounded-full text-[8px] border">Logout</button>
      </div>
    </div>
    <div class="mt-3 flex gap-2">
      <input id="search" oninput="renderShops()" placeholder="🔍 தேடு..." class="flex-1 px-5 py-3 rounded-full text-black font-bold border-2 border-black">
      <button onclick="openAddShop()" class="bg-yellow-400 text-black px-5 py-3 rounded-full font-black border-2 border-black text-xs">+ கடை</button>
    </div>
  </div>

  <div class="flex gap-2 p-3 overflow-x-auto">
    <button onclick="setArea('ALL')" id="tab-ALL" class="bg-[#0a5c26] text-white px-5 py-2 rounded-full text-xs font-bold border-2 border-black">ALL</button>
    <button onclick="setArea('Oddamavadi')" id="tab-Oddamavadi" class="bg-white px-5 py-2 rounded-full text-xs font-bold border-2 border-black">Oddamavadi</button>
    <button onclick="setArea('Chenkalady')" id="tab-Chenkalady" class="bg-white px-5 py-2 rounded-full text-xs font-bold border-2 border-black">Chenkalady</button>
    <button onclick="setArea('Eravur')" id="tab-Eravur" class="bg-white px-5 py-2 rounded-full text-xs font-bold border-2 border-black">Eravur</button>
  </div>

  <div id="shopList" class="px-3 space-y-3"></div>

  <div class="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-black p-2.5 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full border-2 border-black bg-yellow-100 flex items-center justify-center">🥚</div>
      <div><div id="totBalance" class="font-black text-[#0a5c26] text-[11px]">Rs.0</div><div class="text-[8px]" id="totCount">0 kadai</div></div>
    </div>
    <div class="flex gap-2">
      <button onclick="openAllReport()" class="bg-[#0a5c26] text-white px-4 py-2 rounded-full text-[10px] font-bold border-2 border-black">📊 REPORTS</button>
      <button onclick="exportExcel()" class="bg-yellow-100 px-3 py-2 rounded-full text-[10px] font-bold border-2 border-black">📥 Excel</button>
    </div>
  </div>
</div>

<!-- SHOP DETAIL MODAL -->
<div id="shopModal" class="hidden fixed inset-0 bg-black/60 z-[90] flex items-end justify-center">
  <div class="bg-white w-full max-w-md rounded-t-[24px] p-4 max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between"><h2 id="mShopName" class="font-black text-lg"></h2><button onclick="closeModal('shopModal')" class="font-black">X</button></div>
    <div class="grid grid-cols-3 gap-2 mt-3 text-center">
      <div class="border-2 rounded-xl p-2"><div class="text-[9px]">OLD REM</div><div id="mOld" class="font-black">Rs.0</div></div>
      <div class="border-2 rounded-xl p-2"><div class="text-[9px]">LAST PAID</div><div id="mLastPaid" class="font-black text-[11px]">-</div></div>
      <div class="border-2 rounded-xl p-2"><div class="text-[9px]">LAST SALE</div><div id="mLastSale" class="font-black text-[11px]">-</div></div>
    </div>
    <div class="mt-3">
      <label class="text-xs font-bold">Tray / Eggs</label>
      <input id="saleQty" type="number" class="w-full border-2 border-black rounded-xl p-3 mt-1 font-bold" placeholder="Ex: 240">
      <label class="text-xs font-bold mt-2 block">Rate (Rs)</label>
      <input id="saleRate" type="number" class="w-full border-2 border-black rounded-xl p-3 mt-1 font-bold" value="36">
      <button onclick="addSale()" class="w-full bg-[#0a5c26] text-white py-3 rounded-xl mt-3 font-black border-2 border-black">+ SALE ADD</button>
    </div>
    <div class="mt-3">
      <label class="text-xs font-bold">Payment (Rs)</label>
      <input id="payAmt" type="number" class="w-full border-2 border-black rounded-xl p-3 mt-1 font-bold" placeholder="Ex: 20000">
      <button onclick="addPayment()" class="w-full bg-yellow-400 py-3 rounded-xl mt-2 font-black border-2 border-black">💰 PAYMENT ADD</button>
    </div>
    <button onclick="shareShop(currentShopId)" class="w-full bg-blue-600 text-white py-3 rounded-xl mt-3 font-black border-2 border-black">📤 SHARE - Current Balance Only</button>
    <div id="historyList" class="mt-4 space-y-2"></div>
  </div>
</div>

<!-- SHARE MODAL - V19.5.0 FIXED -->
<div id="shareModal" class="hidden fixed inset-0 bg-black/60 z-[95] flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-sm rounded-[24px] p-4">
    <div class="flex justify-between items-center"><h3 class="font-black">📤 Share V19.5.0</h3><button onclick="closeModal('shareModal')" class="w-8 h-8 border-2 border-black rounded-full font-black">X</button></div>
    <div class="bg-green-50 border-2 border-[#0a5c26] rounded-xl p-3 mt-3 text-center">
      <div id="shareTitle" class="font-bold text-[13px]"></div>
      <div id="shareBalance" class="font-black text-red-600 text-xl mt-1"></div>
    </div>
    <div class="bg-yellow-50 border rounded-xl p-3 mt-3 text-[13px] whitespace-pre-line font-bold" id="shareText"></div>
    <div class="flex gap-2 mt-4">
      <button onclick="copyShare()" class="flex-1 bg-yellow-100 py-3 rounded-xl font-black border-2 border-black text-xs">📋 COPY</button>
      <button onclick="whatsappShare()" class="flex-1 bg-green-500 text-white py-3 rounded-xl font-black border-2 border-black text-xs">📱 WhatsApp</button>
      <button onclick="closeModal('shareModal')" class="flex-1 bg-blue-500 text-white py-3 rounded-xl font-black border-2 border-black text-xs">💬 Local</button>
    </div>
    <p class="text-[10px] text-center mt-2 text-gray-500">Old kanakku history varathu - Current Balance mattum!</p>
  </div>
</div>

<!-- ADD SHOP -->
<div id="addShopModal" class="hidden fixed inset-0 bg-black/60 z-[90] flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-sm rounded-[24px] p-5">
    <h3 class="font-black">+ Puthu Kadai</h3>
    <input id="newName" class="w-full border-2 border-black rounded-xl p-3 mt-3 font-bold" placeholder="Kadai Peru">
    <input id="newPhone" class="w-full border-2 border-black rounded-xl p-3 mt-2 font-bold" placeholder="Phone +94...">
    <select id="newArea" class="w-full border-2 border-black rounded-xl p-3 mt-2 font-bold"><option>Oddamavadi</option><option>Chenkalady</option><option>Eravur</option></select>
    <button onclick="saveShop()" class="w-full bg-[#0a5c26] text-white py-3 rounded-xl mt-3 font-black border-2 border-black">SAVE</button>
    <button onclick="closeModal('addShopModal')" class="w-full py-2 mt-2 font-bold">Cancel</button>
  </div>
</div>

<script>
// ===== CONFIG - UN FIREBASE CONFIG INGA PODU DA =====
const firebaseConfig = { apiKey: "YOUR_API_KEY", authDomain: "YOUR_PROJECT.firebaseapp.com", projectId: "YOUR_PROJECT_ID" };
try{ firebase.initializeApp(firebaseConfig); var db = firebase.firestore(); }catch(e){ var db=null; }

let shops = JSON.parse(localStorage.getItem('eravur_shops')||'[]');
let currentArea='ALL', currentShopId=null, shareTextGlobal='';
let price = parseInt(localStorage.getItem('eravur_price')||'36');

function doLogin(){ if(document.getElementById('loginUser').value=='eravur' && document.getElementById('loginPin').value=='1234'){ document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('appContent').classList.remove('hidden'); loadFromCloud(); } else alert('Wrong Login da!'); }
function doLogout(){ location.reload(); }
function saveLocal(){ localStorage.setItem('eravur_shops', JSON.stringify(shops)); }
function setArea(a){ currentArea=a; renderShops(); }
function fmt(n){ return 'Rs.'+Number(n||0).toLocaleString('en-LK'); }

// ===== RENDER =====
function renderShops(){
  let q = (document.getElementById('search').value||'').toLowerCase();
  let list = shops.filter(s=> (currentArea=='ALL'||s.area==currentArea) && s.name.toLowerCase().includes(q));
  let total = list.reduce((a,s)=>a+Number(s.balance||0),0);
  document.getElementById('totBalance').innerText = fmt(total);
  document.getElementById('totCount').innerText = list.length+' kadai';
  document.getElementById('shopList').innerHTML = list.map(s=>`
    <div class="bg-white border-2 border-black rounded-2xl p-3 flex justify-between items-center" onclick="openShop('${s.id}')">
      <div><div class="font-black text-[13px]">${s.name}</div><div class="text-[10px] text-gray-500">${s.area} • ${s.phone||''}</div><div class="text-[10px]">Last: ${s.lastSaleDate||'-'}</div></div>
      <div class="text-right"><div class="font-black text-red-600">${fmt(s.balance)}</div><button onclick="event.stopPropagation();shareShop('${s.id}')" class="bg-blue-100 px-3 py-1 rounded-full text-[10px] font-black border">📤 Share</button></div>
    </div>`).join('') || '<div class="text-center p-5 font-bold">Kadai illa da!</div>';
}

// ===== SHOP DETAIL =====
function openShop(id){
  currentShopId=id; let s=shops.find(x=>x.id==id);
  document.getElementById('mShopName').innerText=s.name+' - '+s.area;
  document.getElementById('mOld').innerText=fmt(s.old||0);
  document.getElementById('mLastPaid').innerText=(s.lastPaidDate||'-')+'\n'+fmt(s.lastPaid||0);
  document.getElementById('mLastSale').innerText=(s.lastSaleDate||'-')+'\n'+fmt(s.lastSale||0);
  document.getElementById('saleRate').value=price;
  document.getElementById('historyList').innerHTML=(s.history||[]).slice().reverse().slice(0,10).map(h=>`<div class="border rounded-xl p-2 text-xs font-bold flex justify-between"><span>${h.date} - ${h.type}</span><span>${fmt(h.amount)}</span></div>`).join('');
  document.getElementById('shopModal').classList.remove('hidden');
}
function addSale(){
  let s=shops.find(x=>x.id==currentShopId);
  let qty=parseInt(document.getElementById('saleQty').value||0), rate=parseInt(document.getElementById('saleRate').value||price);
  if(!qty) return alert('Eggs podu da!');
  let amt=qty*rate; let d=new Date().toLocaleDateString('en-GB');
  s.balance=Number(s.balance||0)+amt; s.lastSale=amt; s.lastSaleDate=d;
  s.history=s.history||[]; s.history.push({date:d,type:`${qty} eggs * ${rate}`,amount:amt});
  saveLocal(); renderShops(); openShop(currentShopId); document.getElementById('saleQty').value='';
}
function addPayment(){
  let s=shops.find(x=>x.id==currentShopId);
  let amt=parseInt(document.getElementById('payAmt').value||0); if(!amt) return alert('Amount podu da!');
  let d=new Date().toLocaleDateString('en-GB');
  s.balance=Number(s.balance||0)-amt; s.lastPaid=amt; s.lastPaidDate=d;
  s.history=s.history||[]; s.history.push({date:d,type:'PAYMENT',amount:-amt});
  saveLocal(); renderShops(); openShop(currentShopId); document.getElementById('payAmt').value='';
}
function openAddShop(){ document.getElementById('addShopModal').classList.remove('hidden'); }
function saveShop(){
  let name=document.getElementById('newName').value.trim(); if(!name) return alert('Peru podu da!');
  if(shops.some(s=>s.name.toLowerCase()==name.toLowerCase())) return alert('Already irukku da!');
  shops.push({id:Date.now().toString(), name, phone:document.getElementById('newPhone').value, area:document.getElementById('newArea').value, balance:0, old:0, history:[], lastSale:0, lastPaid:0});
  saveLocal(); renderShops(); closeModal('addShopModal');
}

// ===== ⭐ V19.5.0 SHARE FIX - OLD KANAKKU VARATHU! CURRENT BALANCE MATTUM! =====
function shareShop(id){
  let s=shops.find(x=>x.id==id); if(!s) return;
  // OLD HISTORY-A SERKKA KUDATHU DA! HISTORY LOOP-A FULL-A DELETE PANNITTOM!
  let txt = `*${s.name} - ${s.area}*\n`;
  txt += `📞 ${s.phone||''}\n\n`;
  txt += `*Current Balance:* ${fmt(s.balance)}\n`;
  txt += `Last Sale: ${s.lastSaleDate||'-'} - ${fmt(s.lastSale||0)}\n`;
  txt += `Last Paid: ${s.lastPaidDate||'-'} - ${fmt(s.lastPaid||0)}\n\n`;
  txt += `ERAVUR EGG CENTRE 🥚`;
  shareTextGlobal = txt;
  document.getElementById('shareTitle').innerText = `${s.name} - ${s.area}`;
  document.getElementById('shareBalance').innerText = `${fmt(s.balance)} | Old Rs.0`;
  document.getElementById('shareText').innerText = txt;
  document.getElementById('shopModal').classList.add('hidden');
  document.getElementById('shareModal').classList.remove('hidden');
}
function copyShare(){ navigator.clipboard.writeText(shareTextGlobal); alert('Copy aagiduchu da!'); }
function whatsappShare(){ window.open('https://wa.me/?text='+encodeURIComponent(shareTextGlobal)); }

function closeModal(id){ document.getElementById(id).classList.add('hidden'); }
function openPriceSettings(){ let p=prompt('Puthu Rate Rs?', price); if(p){ price=parseInt(p); localStorage.setItem('eravur_price', price); } }
function openAllReport(){ alert('Total: '+fmt(shops.reduce((a,s)=>a+Number(s.balance||0),0))+'\nKadai: '+shops.length); }
function exportExcel(){
  let csv='Kadai,Area,Phone,Balance\n'+shops.map(s=>`${s.name},${s.area},${s.phone||''},${s.balance}`).join('\n');
  let a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='eravur-egg.csv'; a.click();
}

// ===== CLOUD - DUP FIX =====
async function seedBackupToCloud(){
  if(!db) return alert('Firebase config podala da!');
  let existing = await db.collection('shops').get();
  if(existing.size>0 && !confirm('Already Cloud la irukku da! Overwrite pannava?')) return;
  for(let s of shops){ await db.collection('shops').doc(s.id).set(s); }
  document.getElementById('syncStatus').innerText='Cloud Saved ✅';
  alert('Cloud la save aagiduchu da!');
}
async function loadFromCloud(){
  if(!db){ renderShops(); return; }
  try{ let snap=await db.collection('shops').get(); if(snap.size>0){ shops=snap.docs.map(d=>d.data()); saveLocal(); } }catch(e){}
  renderShops(); document.getElementById('syncStatus').innerText='Ready ✅';
}
renderShops();
</script>
</body>
</html>
