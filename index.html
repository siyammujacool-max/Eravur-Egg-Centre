<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V14 LOGO FIX</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#eef2eb]">
<div id="loginScreen" class="fixed inset-0 bg-[#0a5c26] z-[100] flex items-center justify-center p-5"><div class="bg-white w-full max-w-sm rounded-[28px] p-8 text-center border-4 border-[#0a5c26]"><img id="mainLogo" src="logo.png" onerror="this.src='https://i.ibb.co/0p0Q0p0/logo.png'" class="w-32 h-32 mx-auto rounded-full border-4 border-[#0a5c26] mb-3 bg-white"><h1 class="font-black text-[#0a5c26]">ERAVUR EGG CENTRE</h1><p class="text-[10px] bg-[#0a5c26] text-white px-3 py-1 rounded-full mt-1 inline-block">SINCE 2010</p><input id="loginUser" class="w-full border-2 border-black rounded-xl p-3 mt-5 font-bold" value="eravur"><input id="loginPin" type="password" class="w-full border-2 border-black rounded-xl p-3 mt-2 font-bold" value="1234"><button onclick="doLogin()" class="w-full bg-[#0a5c26] text-white py-3.5 rounded-xl mt-4 font-black border-2 border-black">Login</button></div></div>
<div id="appContent" class="hidden pb-[110px]"><div class="bg-[#0e5c28] text-white p-3 pb-4 sticky top-0 z-40"><div class="flex justify-between items-center"><div class="flex items-center gap-2"><img src="logo.png" class="w-10 h-10 rounded-full border-2 border-white bg-white"><div class="text-[12px] font-black"><div>ERAVUR EGG</div><div class="text-[9px]"><span id="syncStatus">Loading...</span></div></div></div><div class="flex gap-1"><button onclick="seedBackupToCloud()" class="bg-[#c8e6c9] text-black px-3 py-2 rounded-full text-[10px] font-black border-2 border-black">📤<br>To Cloud</button><button onclick="cleanDuplicates()" class="bg-white text-red-600 px-3 py-2 rounded-full text-[9px] font-black border-2 border-black">🧹<br>Dup</button><button onclick="doLogout()" class="bg-white/20 px-2 py-2 rounded-full text-[9px] border">Logout</button></div></div><div class="mt-3 flex gap-2"><input id="search" oninput="render()" placeholder="🔍 தேடு..." class="flex-1 px-5 py-3 rounded-full text-black font-bold border-2 border-black"><button onclick="openAddShop()" class="bg-[#ffcc00] text-black px-5 py-3 rounded-full font-black border-2 border-black">+ கடை</button></div></div><div class="flex gap-2 p-3 overflow-x-auto"><button onclick="setArea('ALL')" id="tab-ALL" class="bg-[#0a5c26] text-white px-5 py-2 rounded-full text-xs font-bold border-2 border-black">ALL</button><button onclick="setArea('Oddamavadi')" id="tab-Oddamavadi" class="bg-white px-5 py-2 rounded-full text-xs font-bold border-2 border-black">Oddamavadi</button><button onclick="setArea('Chenkalady')" id="tab-Chenkalady" class="bg-white px-5 py-2 rounded-full text-xs font-bold border-2 border-black">Chenkalady</button><button onclick="setArea('Eravur')" id="tab-Eravur" class="bg-white px-5 py-2 rounded-full text-xs font-bold border-2 border-black">Eravur</button></div><div id="shopList" class="px-3 space-y-3"></div><div class="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-black p-3 flex justify-between"><div class="flex items-center gap-2"><img src="logo.png" class="w-8 h-8 rounded-full border-2"><div><div id="totBalance" class="font-black text-[#0a5c26] text-[12px]">Rs.0</div><div class="text-[8px]">SINCE 2010 | <span id="totCount">0</span></div></div></div><button onclick="exportExcel()" class="bg-yellow-100 border-2 border-black px-3 py-2 rounded-full text-[10px] font-black">📥 Excel</button></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyA-OQKxJeDhALnecWc2Jyv_mNxr3W6NFA8", authDomain: "eravur-egg.firebaseapp.com", projectId: "eravur-egg", storageBucket: "eravur-egg.firebasestorage.app", messagingSenderId: "721546852813", appId: "1:721546852813:web:91efbc2c7d5f36f4332c84" };
const BACKUP=[{"name":"Opera BK","area":"Eravur","phone":"0776511096","oldBalance":14000,"oldPaid":7000},{"name":"Haq Hajiyar","area":"Eravur"},{"name":"ரஹுமான் ஹாஜியார்","area":"Oddamavadi"},{"name":"ஜாமல்","area":"Oddamavadi"},{"name":"post office கடை","area":"Oddamavadi"},{"name":"ராபி டா நானா","area":"Oddamavadi"},{"name":"ஹார்ட். கடை","area":"Oddamavadi"},{"name":"மீரவோடை கடை","area":"Oddamavadi"},{"name":"மீரவோடை புது கடை","area":"Oddamavadi"},{"name":"அபுபக்கர்","area":"Oddamavadi"},{"name":"வாளச்சேனை மரக்கறி கடை","area":"Oddamavadi"},{"name":"ஜீவா","area":"Oddamavadi"},{"name":"R. தம்பி","area":"Chenkalady"},{"name":"நிரோஷன்","area":"Chenkalady"},{"name":"ஆனந்தன்","area":"Chenkalady"},{"name":"வெற்றில கடை","area":"Chenkalady"},{"name":"வசந்தன்","area":"Chenkalady"},{"name":"ரஜனி மகன்","area":"Chenkalady"},{"name":"கருவாட்டு கடை","area":"Chenkalady"},{"name":"பிரபாஸ் hotel","area":"Chenkalady","oldBalance":20000},{"name":"மலர் food city","area":"Chenkalady"},{"name":"Bar. MA","area":"Chenkalady"},{"name":"மதுராம் hotel","area":"Chenkalady","oldBalance":42720,"oldPaid":10000},{"name":"ரிபாஸ்","area":"Eravur","oldBalance":10000},{"name":"மன்சூர்","area":"Eravur","oldBalance":362960,"oldPaid":6000},{"name":"மன்சூர் 2","area":"Eravur","oldBalance":18000,"oldPaid":12000},{"name":"சபீர் மௌலவி","area":"Eravur"},{"name":"பதுரியா 1","area":"Eravur","oldBalance":10000},{"name":"புகாரி மருமகன்","area":"Eravur"},{"name":"colombu store","area":"Eravur"},{"name":"நதிர்","area":"Eravur"},{"name":"நஜீம்","area":"Eravur"},{"name":"மௌனுதீன்","area":"Eravur"}];
const app=initializeApp(firebaseConfig);const db=getFirestore(app);let shops=[];let curArea='ALL';
window.doLogin=()=>{localStorage.setItem('egg_logged','yes');document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appContent').classList.remove('hidden');load();};window.doLogout=()=>{localStorage.removeItem('egg_logged');location.reload();};
if(localStorage.getItem('egg_logged')==='yes'){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appContent').classList.remove('hidden');load();}
function load(){onSnapshot(collection(db,'shops'),(snap)=>{shops=[];snap.forEach(d=>shops.push({id:d.id,...d.data()}));let seen={};let dup=0;shops.forEach(s=>{let k=s.name.trim().toLowerCase()+'|'+s.area.trim().toLowerCase();if(seen[k])dup++;else seen[k]=true;});document.getElementById('syncStatus').innerText=dup>0?dup+' DUP! Dup click':shops.length+' OK';render();});}
window.seedBackupToCloud=async()=>{const q=await getDocs(collection(db,'shops'));let ex=new Set();q.forEach(d=>{let da=d.data();ex.add((da.name||'').trim().toLowerCase()+'|'+(da.area||'').trim().toLowerCase());});let added=0;for(let s of BACKUP){let k=s.name.trim().toLowerCase()+'|'+s.area.trim().toLowerCase();if(ex.has(k))continue;let b=(s.oldBalance||0)-(s.oldPaid||0);await addDoc(collection(db,'shops'),{name:s.name,area:s.area,phone:s.phone||'',oldBalance:s.oldBalance||0,oldPaid:s.oldPaid||0,totalSale:0,totalPaid:s.oldPaid||0,balance:b});added++;}alert(added>0?added+' added':'Already in cloud');};
window.cleanDuplicates=async()=>{if(!confirm('Delete dups?'))return;let map={};let del=[];let sorted=[...shops].sort((a,b)=>(b.balance||0)-(a.balance||0));sorted.forEach(s=>{let k=s.name.trim().toLowerCase()+'|'+s.area.trim().toLowerCase();if(!map[k])map[k]=s;else del.push(s);});for(let d of del){await deleteDoc(doc(db,'shops',d.id));}alert(del.length+' deleted');};
window.setArea=(a)=>{curArea=a;document.querySelectorAll('[id^=tab-]').forEach(b=>b.className='bg-white px-5 py-2 rounded-full text-xs font-bold border-2 border-black');document.getElementById('tab-'+a).className='bg-[#0a5c26] text-white px-5 py-2 rounded-full text-xs font-bold border-2 border-black';render();};
window.render=()=>{let q=document.getElementById('search').value.toLowerCase();let f=shops.filter(s=>(curArea=='ALL'||s.area==curArea)&&s.name.toLowerCase().includes(q));f.sort((a,b)=>(b.balance||0)-(a.balance||0));let h='';f.forEach(s=>{h+=`<div class="bg-white rounded-[18px] p-4 border-l-[6px] border-l-[#0a5c26] border-2"><div class="flex justify-between"><div><b>${s.name}</b> <span class="text-[10px] bg-gray-100 px-2 rounded-full">${s.area}</span><div class="text-[11px]">Bal Rs.${s.balance||0}</div></div><img src="logo.png" class="w-8 h-8 rounded-full border"></div></div>`;});document.getElementById('shopList').innerHTML=h;document.getElementById('totBalance').innerText='Rs.'+shops.reduce((a,b)=>a+(b.balance||0),0).toLocaleString();document.getElementById('totCount').innerText=shops.length+' kadai';};
window.openAddShop=()=>{let n=prompt('Kadai peru:');if(!n)return;let ar=prompt('Area (Oddamavadi/Chenkalady/Eravur):','Eravur');if(!ar)return;let o=parseFloat(prompt('Old Balance:','0'))||0;addDoc(collection(db,'shops'),{name:n,area:ar,phone:'',oldBalance:o,oldPaid:0,totalSale:0,totalPaid:0,balance:o});};
window.exportExcel=()=>{let csv="Shop,Balance\n"+shops.map(s=>`"${s.name}",${s.balance}`).join("\n");let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Eravur.csv';a.click();};
</script>
