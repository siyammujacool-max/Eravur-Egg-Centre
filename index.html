<script type="module">

const app=initializeApp(firebaseConfig);const db=getFirestore(app);let shops=[];let tx=[];let rates={240:24,260:26,280:28,300:30};let curArea='ALL';let curShopId=null;let saleState={};const sizes=[240,260,280,300];
window.doLogin=()=>{let u=document.getElementById('loginUser').value.trim();let p=document.getElementById('loginPin').value.trim();if(u==='eravur'&&p==='1234'){localStorage.setItem('egg_logged','yes');document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appContent').classList.remove('hidden');loadFromCloud();}};
window.doLogout=()=>{localStorage.removeItem('egg_logged');location.reload();};
if(localStorage.getItem('egg_logged')==='yes'){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appContent').classList.remove('hidden');loadFromCloud();}
async function loadFromCloud(){onSnapshot(collection(db,'shops'),(snap)=>{shops=[];snap.forEach(d=>shops.push({id:d.id,...d.data()}));let seen={};let dup=0;shops.forEach(s=>{let k=s.name.trim().toLowerCase()+'|'+s.area.trim().toLowerCase();if(seen[k])dup++;else seen[k]=true;});document.getElementById('syncStatus').innerText=dup>0?'⚠️ '+dup+' DUP! Dup click':'Connected '+shops.length+' kadai';renderShops();});onSnapshot(query(collection(db,'transactions'),orderBy('date','desc')),(snap)=>{tx=[];snap.forEach(d=>tx.push({id:d.id,...d.data()}));});onSnapshot(doc(db,'settings','rates'),(snap)=>{if(snap.exists())rates=snap.data();});}
window.cleanDuplicates=async()=>{if(!confirm('Duplicate delete pannava?'))return;let map={};let del=[];let sorted=[...shops].sort((a,b)=>(b.balance||0)-(a.balance||0));sorted.forEach(s=>{let k=s.name.trim().toLowerCase()+'|'+s.area.trim().toLowerCase();if(!map[k])map[k]=s;else del.push(s);});for(let d of del){await deleteDoc(doc(db,'shops',d.id));}alert(del.length+' deleted!');};
window.setArea=(a)=>{curArea=a;document.querySelectorAll('[id^=tab-]').forEach(b=>b.className='bg-white px-5 py-2 rounded-full text-xs font-bold border-2 border-black');document.getElementById('tab-'+a).className='bg-[#0a5c26] text-white px-5 py-2 rounded-full text-xs font-bold border-2 border-black';renderShops();};
window.renderShops=()=>{let q=document.getElementById('search').value.toLowerCase();let f=shops.filter(s=>(curArea=='ALL'||s.area==curArea)&&s.name.toLowerCase().includes(q));let h='';f.forEach(s=>{h+=`<div class="bg-white rounded-[18px] p-4 shadow-sm border-2 border-gray-100 border-l-[6px] border-l-[#0a5c26]"><div class="flex justify-between"><div class="flex-1"><div class="flex items-center gap-2"><span class="font-black text-[14px]">${s.name}</span><span class="text-[10px] bg-gray-100 px-2.5 py-0.5 rounded-full font-bold border">${s.area}</span></div><div class="text-[11px] text-gray-500 mt-1">Bal Rs.${s.balance||0}.0 | Sale ${s.totalSale||0}</div></div><img src="logo.png" class="w-8 h-8 rounded-full border ml-2"></div><div class="grid grid-cols-3 gap-2 mt-3"><button onclick="openSale('${s.id}')" class="bg-[#0a5c26] text-white py-2.5 rounded-[12px] text-[13px] font-black border-2 border-black">Sale +</button><button onclick="openPay('${s.id}')" class="bg-[#1a5cff] text-white py-2.5 rounded-[12px] text-[13px] font-black border-2 border-black">Paid</button><button onclick="openReport('${s.id}')" class="bg-[#f1f1f1] text-black py-2.5 rounded-[12px] text-[13px] font-bold border-2 border-black">Report</button></div></div>`;});document.getElementById('shopList').innerHTML=h;document.getElementById('totBalance').innerText='Rs.'+shops.reduce((a,b)=>a+(b.balance||0),0);};
window.openAddShop=()=>document.getElementById('addModal').classList.remove('hidden');window.closeAddShop=()=>document.getElementById('addModal').classList.add('hidden');window.saveNewShop=async()=>{let n=document.getElementById('newName').value.trim();if(!n)return;let ar=document.getElementById('newArea').value;if(shops.some(s=>s.name.toLowerCase()===n.toLowerCase()&&s.area===ar))return alert('Already irukku!');let p=document.getElementById('newPhone').value;let o=parseFloat(document.getElementById('newOld').value)||0;await addDoc(collection(db,'shops'),{name:n,area:ar,phone:p,oldBalance:o,oldPaid:0,totalSale:0,totalPaid:0,balance:o});closeAddShop();};
window.openPriceSettings=()=>{let h='';sizes.forEach(sz=>{h+=`<div class="flex justify-between bg-gray-50 p-3 rounded-xl border-2 border-black"><span class="font-black">W${sz}</span><input id="rate${sz}" type="number" value="${rates[sz]}" class="w-20 border-2 border-black rounded-xl p-2 text-center font-bold"></div>`;});document.getElementById('priceInputs').innerHTML=h;document.getElementById('priceModal').classList.remove('hidden');};window.closePriceSettings=()=>document.getElementById('priceModal').classList.add('hidden');window.savePriceSettings=async()=>{let nr={};sizes.forEach(sz=>{nr[sz]=parseFloat(document.getElementById('rate'+sz).value)||0;});await setDoc(doc(db,'settings','rates'),nr);closePriceSettings();};
window.openSale=(id)=>{curShopId=id;saleState={};sizes.forEach(sz=>saleState[sz]={qty:0,rate:rates[sz]});let s=shops.find(x=>x.id==id);document.getElementById('saleTitleText').innerText=s.name;document.getElementById('saleOld').innerText='Bal Rs.'+s.balance;document.getElementById('saleDate').valueAsDate=new Date();let h='';sizes.forEach(sz=>{h+=`<div class="flex gap-2"><div class="w-12 font-black">W${sz}</div><div class="flex-1 flex border-2 rounded-xl overflow-hidden"><button onclick="chgSale(${sz},-1)" class="px-3 bg-green-50 font-black">-</button><input id="qs${sz}" type="number" value="0" oninput="saleState[${sz}].qty=parseInt(this.value)||0;calcSale()" class="flex-1 text-center font-black"><button onclick="chgSale(${sz},1)" class="px-3 bg-green-50 font-black">+</button></div><input id="rs${sz}" type="number" value="${rates[sz]}" oninput="saleState[${sz}].rate=parseFloat(this.value)||0;calcSale()" class="w-14 border-2 rounded-xl text-center font-bold"></div>`;});document.getElementById('eggInputs').innerHTML=h;calcSale();document.getElementById('saleModal').classList.remove('hidden');};window.chgSale=(sz,d)=>{saleState[sz].qty=Math.max(0,saleState[sz].qty+d);document.getElementById('qs'+sz).value=saleState[sz].qty;calcSale();};window.calcSale=()=>{let s=shops.find(x=>x.id==curShopId);let today=0,eggs=0,det=[];sizes.forEach(sz=>{let q=saleState[sz].qty,r=saleState[sz].rate;let e=sz*q;today+=e*r;eggs+=e;if(q>0)det.push(`W${sz}x${q}=${e}@${r}`);});document.getElementById('saleToday').innerText='Rs.'+today;document.getElementById('saleGrand').innerText='Rs.'+(today+s.balance);document.getElementById('saleDetails').innerText=det.join(' | ');return{today,grand:today+s.balance,eggs,det};};window.closeSale=()=>document.getElementById('saleModal').classList.add('hidden');window.confirmSale=async()=>{let c=calcSale();if(c.today==0)return;let s=shops.find(x=>x.id==curShopId);let d=document.getElementById('saleDate').value;let dateObj=d?new Date(d):new Date();let newBal=c.grand;await updateDoc(doc(db,'shops',s.id),{balance:newBal,totalSale:(s.totalSale||0)+c.today});await addDoc(collection(db,'transactions'),{shopId:s.id,shopName:s.name,area:s.area,type:'sale',total:c.today,balance:newBal,eggs:c.eggs,details:c.det.join(', '),date:dateObj.toISOString(),dateStr:dateObj.toLocaleDateString()});closeSale();};
window.openPay=(id)=>{curShopId=id;let s=shops.find(x=>x.id==id);document.getElementById('payTitleText').innerText=s.name+' Paid';document.getElementById('payInfo').innerText='Bal Rs.'+s.balance;document.getElementById('payDate').valueAsDate=new Date();document.getElementById('payModal').classList.remove('hidden');};window.closePay=()=>document.getElementById('payModal').classList.add('hidden');window.confirmPay=async()=>{let amt=parseFloat(document.getElementById('payAmount').value);if(!amt)return;let s=shops.find(x=>x.id==curShopId);let d=document.getElementById('payDate').value;let dateObj=d?new Date(d):new Date();let newBal=s.balance-amt;await updateDoc(doc(db,'shops',s.id),{balance:newBal,totalPaid:(s.totalPaid||0)+amt});await addDoc(collection(db,'transactions'),{shopId:s.id,shopName:s.name,area:s.area,type:'payment',amount:amt,balance:newBal,date:dateObj.toISOString(),dateStr:dateObj.toLocaleDateString()});closePay();};
window.openReport=(id)=>{curShopId=id;let s=shops.find(x=>x.id==id);let list=tx.filter(t=>t.shopId==id);document.getElementById('repTitle').innerText=s.name+' Bal Rs.'+s.balance;let html=`<div class="grid grid-cols-3 gap-2 mb-3"><div class="bg-green-50 border-2 p-2 rounded-xl text-center text-xs"><b>Rs.${s.totalSale||0}</b></div><div class="bg-blue-50 border-2 p-2 rounded-xl text-center text-xs"><b>Rs.${s.totalPaid||0}</b></div><div class="bg-yellow-50 border-2 border-black p-2 rounded-xl text-center text-xs"><b>Rs.${s.balance||0}</b></div></div>`;html+=list.map(t=>t.type=='sale'?`<div class="border-l-4 border-green-600 p-2 bg-gray-50 mb-2 text-xs">SALE Rs.${t.total} ${t.dateStr}</div>`:`<div class="border-l-4 border-blue-500 p-2 bg-blue-50 mb-2 text-xs">PAID Rs.${t.amount} ${t.dateStr}</div>`).join('');document.getElementById('repContent').innerHTML=html;document.getElementById('reportModal').classList.remove('hidden');};window.closeReport=()=>document.getElementById('reportModal').classList.add('hidden');
window.exportExcel=()=>{let csv="Shop,Area,Balance\n"+shops.map(s=>`"${s.name}","${s.area}",${s.balance}`).join("\n");let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Eravur.csv';a.click();};
</script></body></html>
