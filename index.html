<!DOCTYPE html><html lang="ta"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ERAVUR EGG SEPARATE</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#f4f7f2]">
<div id="loginScreen" class="fixed inset-0 bg-[#0a5c26] z-[100] flex items-center justify-center p-5"><div class="bg-white w-full max-w-sm rounded-[24px] p-6 text-center"><div class="text-5xl mb-2">🥚</div><h1 class="font-bold text-[#0a5c26]">ERAVUR EGG</h1><p class="text-[10px] text-gray-500 mb-3">Old தனி | Sale தனி</p><input id="lu" class="w-full border-2 rounded-xl p-3 mb-2 text-sm" value="eravur"><input id="lp" type="password" class="w-full border-2 rounded-xl p-3 mb-3 text-sm" placeholder="1234"><button onclick="doLogin()" class="w-full bg-[#0a5c26] text-white py-3 rounded-xl font-bold">Login</button></div></div>
<div id="app" class="hidden pb-[90px]"><div class="bg-[#0a5c26] text-white p-4 sticky top-0 z-50"><div class="flex justify-between"><h1 class="font-bold text-[12px]">🥚 OLD தனி | SALE தனி - Eravur Egg</h1><button onclick="logout()" class="bg-white/20 px-3 py-1 rounded-full text-xs">Logout</button></div><input id="search" oninput="render()" placeholder="தேடு - ரிபாஸ், மன்சூர்..." class="w-full mt-3 px-4 py-2.5 rounded-full text-black text-sm outline-none"></div>
<div class="flex gap-2 p-3 overflow-x-auto"><button onclick="setA('ALL')" id="t-ALL" class="bg-[#0a5c26] text-white px-4 py-2 rounded-full text-xs font-bold">ALL</button><button onclick="setA('Oddamavadi')" id="t-Oddamavadi" class="bg-white border px-4 py-2 rounded-full text-xs font-bold">Oddamavadi</button><button onclick="setA('Chenkalady')" id="t-Chenkalady" class="bg-white border px-4 py-2 rounded-full text-xs font-bold">Chenkalady</button><button onclick="setA('Eravur')" id="t-Eravur" class="bg-white border px-4 py-2 rounded-full text-xs font-bold">Eravur</button></div>
<div id="list" class="px-3 space-y-3"></div>
<div class="fixed bottom-0 left-0 right-0 bg-white border-t p-2 flex justify-around text-center"><div><div class="text-[8px] text-gray-500">OLD பாக்கி</div><div id="totOld" class="font-bold text-orange-600 text-xs">Rs.0</div></div><div><div class="text-[8px] text-gray-500">SALE பாக்கி</div><div id="totSale" class="font-bold text-[#0a5c26] text-xs">Rs.0</div></div><div><div class="text-[8px] text-gray-500">மொத்தம்</div><div id="tot" class="font-bold text-red-600 text-sm">Rs.0</div></div><button onclick="openAll()" class="bg-[#0a5c26] text-white px-4 py-2 rounded-full font-bold text-xs">📊 REPORTS</button></div></div>

<div id="editM" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-end justify-center"><div class="bg-white w-full rounded-t-[22px] p-5"><h3 id="eName" class="font-bold mb-2"></h3><label class="text-xs font-bold">Old Balance (பழைய பாக்கி தனி)</label><input id="eOld" type="number" class="w-full border-2 border-orange-300 bg-orange-50 rounded-xl p-3 mb-3 font-bold"><div class="flex gap-2"><button onclick="document.getElementById('editM').classList.add('hidden')" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="saveEdit()" class="flex-1 bg-orange-600 text-white py-3 rounded-xl font-bold">Old Update</button></div></div></div>

<div id="saleM" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-end justify-center"><div class="bg-white w-full rounded-t-[22px] p-5"><div class="flex justify-between mb-3"><h3 id="sTitle" class="font-bold text-sm"></h3><span id="sBal" class="text-xs bg-gray-100 px-2 py-1 rounded">Old தனி</span></div><div id="sInputs" class="space-y-2"></div><div class="mt-3 p-3 bg-green-50 border-2 border-dashed rounded-xl text-center"><div class="text-xs">New Sale: <b id="sToday">0</b> | Sale Bal: <b id="sGrand" class="text-[#0a5c26]">0</b></div><div id="sDet" class="text-[10px] mt-1"></div></div><div class="flex gap-2 mt-3"><button onclick="document.getElementById('saleM').classList.add('hidden')" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="doSale()" class="flex-1 bg-[#0a5c26] text-white py-3 rounded-xl font-bold">Sale Add + (தனி)</button></div></div></div>

<div id="payM" class="hidden fixed inset-0 bg-black/50 z-[70] flex items-center justify-center p-4"><div class="bg-white w-full max-w-sm rounded-[22px] p-5"><h3 id="pTitle" class="font-bold mb-3"></h3><div id="pCalc" class="bg-gray-50 p-3 rounded-xl text-xs mb-3"></div><label class="text-xs font-bold mb-2 block">இந்த பணம் எதற்கு கழிக்க வேண்டும்?</label><div class="grid grid-cols-2 gap-2 mb-3"><button id="payOldBtn" onclick="setPayType('old')" class="border-2 border-orange-400 bg-orange-50 py-3 rounded-xl font-bold text-xs">📦 OLD க்கு கழி</button><button id="paySaleBtn" onclick="setPayType('sale')" class="border-2 border-green-400 bg-green-50 py-3 rounded-xl font-bold text-xs">🥚 SALE க்கு கழி</button></div><input id="pAmt" type="number" class="w-full border-2 border-blue-300 rounded-xl p-3 mb-3 font-bold text-lg" placeholder="Amount"><div id="pPreview" class="text-xs bg-blue-50 p-2 rounded-xl mb-3 hidden"></div><div class="flex gap-2"><button onclick="document.getElementById('payM').classList.add('hidden')" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="doPay()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold">கழி - Paid</button></div></div></div>

<div id="repM" class="hidden fixed inset-0 bg-white z-[70] overflow-y-auto"><div class="bg-[#0a5c26] text-white p-4 flex justify-between sticky top-0"><h3 id="rTitle" class="font-bold text-[11px]"></h3><button onclick="document.getElementById('repM').classList.add('hidden')" class="bg-white/20 px-3 py-1 rounded-full">X</button></div><div id="rContent" class="p-4"></div></div>
<div id="allM" class="hidden fixed inset-0 bg-white z-[80] overflow-y-auto"><div class="bg-[#0a5c26] text-white p-4 flex justify-between sticky top-0"><h3 class="font-bold">📊 SEPARATE REPORTS</h3><button onclick="document.getElementById('allM').classList.add('hidden')" class="bg-white/20 px-3 py-1 rounded-full">X</button></div><div id="allContent" class="p-4"></div></div>

<script>
const USER="eravur", PIN="1234";
let shops=JSON.parse(localStorage.getItem('egg_sep')||'null');
if(!shops){let old=JSON.parse(localStorage.getItem('egg_final')||localStorage.getItem('egg_shops_fix')||localStorage.getItem('egg_shops_v2')||'[]'); if(old.length>0){shops=old.map(s=>({id:s.id,name:s.name,area:s.area,phone:s.phone||"",oldBalance:s.oldBalance||0,oldPaid:s.oldPaid||0,totalSale:s.totalSale||0,salePaid:s.salePaid||0,totalPaid:s.totalPaid||0})); shops.forEach(s=>{if(!s.oldPaid&&!s.salePaid){s.oldPaid=0;s.salePaid=0;}});} else {shops=[{id:1,name:"ரிபாஸ்",area:"Eravur",phone:"774540269",oldBalance:10000,oldPaid:0,totalSale:39600,salePaid:0,totalPaid:0},{id:2,name:"மன்சூர்",area:"Eravur",phone:"",oldBalance:362960,oldPaid:0,totalSale:0,salePaid:0,totalPaid:0}];} localStorage.setItem('egg_sep',JSON.stringify(shops));}
let tx=JSON.parse(localStorage.getItem('egg_tx_sep')||localStorage.getItem('egg_tx_final')||localStorage.getItem('egg_tx_fix')||'[]');
let curA='ALL',curId=null,saleSt={},payType='old',rates={240:33,260:27,280:28,300:30},sizes=[240,260,280,300];
function save(){localStorage.setItem('egg_sep',JSON.stringify(shops));localStorage.setItem('egg_tx_sep',JSON.stringify(tx));}
function doLogin(){if(document.getElementById('lu').value==USER&&document.getElementById('lp').value==PIN){localStorage.setItem('egg_logged','yes');document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render();}else alert('eravur / 1234');}
function logout(){localStorage.removeItem('egg_logged');location.reload();}
if(localStorage.getItem('egg_logged')=='yes'){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');}
function setA(a){curA=a; document.querySelectorAll('[id^=t-]').forEach(b=>b.className='bg-white border px-4 py-2 rounded-full text-xs font-bold'); document.getElementById('t-'+a).className='bg-[#0a5c26] text-white px-4 py-2 rounded-full text-xs font-bold'; render();}
function getRem(s){let oldRem=(s.oldBalance||0)-(s.oldPaid||0); let saleRem=(s.totalSale||0)-(s.salePaid||0); return {oldRem,saleRem,total:oldRem+saleRem};}
function render(){let q=document.getElementById('search').value.toLowerCase(); let f=shops.filter(s=>(curA=='ALL'||s.area==curA)&&s.name.toLowerCase().includes(q)); let h=''; f.forEach(s=>{let r=getRem(s); h+=`<div onclick="openRep(${s.id})" class="bg-white rounded-[16px] p-4 border-l-[5px] border-[#0a5c26] shadow"><div class="flex justify-between"><div class="flex-1"><div class="font-bold text-[14px]">${s.name} <span class="text-[9px] bg-gray-100 px-2 py-0.5 rounded-full">${s.area}</span></div><div class="grid grid-cols-2 gap-2 mt-2 text-[11px]"><div class="bg-orange-50 border border-orange-200 p-2 rounded-xl"><div class="text-[9px] text-orange-600">OLD BALANCE</div><div>Old: ${s.oldBalance}</div><div>Paid: ${s.oldPaid}</div><div class="font-bold text-orange-700">மீதி: Rs.${r.oldRem}</div></div><div class="bg-green-50 border border-green-200 p-2 rounded-xl"><div class="text-[9px] text-green-600">NEW SALE</div><div>Sale: ${s.totalSale}</div><div>Paid: ${s.salePaid}</div><div class="font-bold text-green-700">மீதி: Rs.${r.saleRem}</div></div></div><div class="mt-2 text-[12px] font-bold text-red-600">மொத்த மீதி: Rs.${r.total} = Old ${r.oldRem} + Sale ${r.saleRem}</div></div><button onclick="event.stopPropagation();openEdit(${s.id})" class="h-8 w-8 bg-yellow-50 rounded-full ml-2">✏️</button></div><div class="grid grid-cols-3 gap-2 mt-3"><button onclick="event.stopPropagation();openSale(${s.id})" class="bg-[#0a5c26] text-white py-2.5 rounded-xl text-xs font-bold">Sale +</button><button onclick="event.stopPropagation();openPay(${s.id})" class="bg-blue-600 text-white py-2.5 rounded-xl text-xs font-bold">Paid -</button><button onclick="event.stopPropagation();openRep(${s.id})" class="bg-gray-100 py-2.5 rounded-xl text-xs">Report</button></div></div>`;}); document.getElementById('list').innerHTML=h; let totOld=shops.reduce((a,b)=>a+getRem(b).oldRem,0), totSale=shops.reduce((a,b)=>a+getRem(b).saleRem,0); document.getElementById('totOld').innerText='Rs.'+totOld; document.getElementById('totSale').innerText='Rs.'+totSale; document.getElementById('tot').innerText='Rs.'+(totOld+totSale); save();}
function openEdit(id){curId=id; let s=shops.find(x=>x.id==id); document.getElementById('eName').innerText=s.name+' - Old Balance தனி'; document.getElementById('eOld').value=s.oldBalance; document.getElementById('editM').classList.remove('hidden');}
function saveEdit(){let s=shops.find(x=>x.id==curId); s.oldBalance=parseFloat(document.getElementById('eOld').value)||0; save(); document.getElementById('editM').classList.add('hidden'); render();}
function openSale(id){curId=id; saleSt={}; sizes.forEach(sz=>saleSt[sz]={qty:0,rate:rates[sz]}); let s=shops.find(x=>x.id==id); let r=getRem(s); document.getElementById('sTitle').innerText=s.name+' - Sale தனி'; document.getElementById('sBal').innerText='Old மீதி '+r.oldRem+' தனி'; let ht=''; sizes.forEach(sz=>{ht+=`<div class="flex items-center gap-2"><div class="w-[55px] font-bold text-sm">W${sz}</div><div class="flex-1 flex border-2 rounded-xl overflow-hidden"><button onclick="chg(${sz},-1)" class="px-3 py-2 bg-green-50 font-bold">-</button><input id="q${sz}" type="number" value="0" oninput="saleSt[${sz}].qty=parseInt(this.value)||0;calc()" class="flex-1 text-center font-bold"><button onclick="chg(${sz},1)" class="px-3 py-2 bg-green-50 font-bold">+</button></div><input id="r${sz}" type="number" value="${rates[sz]}" oninput="saleSt[${sz}].rate=parseFloat(this.value)||0;calc()" class="w-[60px] border-2 rounded-xl p-2 text-center text-sm"></div>`;}); document.getElementById('sInputs').innerHTML=ht; calc(); document.getElementById('saleM').classList.remove('hidden');}
function chg(sz,d){saleSt[sz].qty=Math.max(0,saleSt[sz].qty+d); document.getElementById('q'+sz).value=saleSt[sz].qty; calc();}
function calc(){let s=shops.find(x=>x.id==curId); let today=0,eggs=0,det=[]; sizes.forEach(sz=>{let q=saleSt[sz].qty,r=saleSt[sz].rate; today+=sz*q*r; eggs+=sz*q; if(q>0) det.push(`W${sz}x${q}=${sz*q}`);}); document.getElementById('sToday').innerText='Rs.'+today; document.getElementById('sGrand').innerText='Rs.'+(getRem(s).saleRem+today); document.getElementById('sDet').innerText=det.join(' | '); return {today,eggs,det};}
function doSale(){let c=calc(); if(c.today==0) return alert('Qty'); let s=shops.find(x=>x.id==curId); s.totalSale+=c.today; tx.unshift({id:Date.now(),shopId:s.id,shopName:s.name,area:s.area,type:'sale',total:c.today,details:c.det.join(','),eggs:c.eggs,dateStr:new Date().toLocaleDateString(),for:'sale'}); save(); document.getElementById('saleM').classList.add('hidden'); render();}
function setPayType(t){payType=t; document.getElementById('payOldBtn').className=t=='old'?'border-2 border-orange-600 bg-orange-600 text-white py-3 rounded-xl font-bold text-xs':'border-2 border-orange-200 bg-orange-50 py-3 rounded-xl font-bold text-xs'; document.getElementById('paySaleBtn').className=t=='sale'?'border-2 border-green-600 bg-green-600 text-white py-3 rounded-xl font-bold text-xs':'border-2 border-green-200 bg-green-50 py-3 rounded-xl font-bold text-xs'; updatePayPreview();}
function openPay(id){curId=id; payType='old'; setPayType('old'); let s=shops.find(x=>x.id==id); let r=getRem(s); document.getElementById('pTitle').innerText=s.name; document.getElementById('pCalc').innerHTML=`<div class="grid grid-cols-2 gap-2 text-center"><div class="bg-orange-50 p-2 rounded-xl"><div class="text-[9px]">OLD மீதி</div><b class="text-orange-700">Rs.${r.oldRem}</b><div class="text-[9px]">${s.oldBalance}-${s.oldPaid}</div></div><div class="bg-green-50 p-2 rounded-xl"><div class="text-[9px]">SALE மீதி</div><b class="text-green-700">Rs.${r.saleRem}</b><div class="text-[9px]">${s.totalSale}-${s.salePaid}</div></div></div><div class="text-center mt-2 font-bold">மொத்தம் Rs.${r.total}</div>`; document.getElementById('pAmt').value=''; document.getElementById('pPreview').classList.add('hidden'); document.getElementById('payM').classList.remove('hidden'); document.getElementById('pAmt').oninput=updatePayPreview;}
function updatePayPreview(){let amt=parseFloat(document.getElementById('pAmt').value)||0; if(!amt){document.getElementById('pPreview').classList.add('hidden'); return;} let s=shops.find(x=>x.id==curId); let r=getRem(s); let newOld=r.oldRem, newSale=r.saleRem; if(payType=='old') newOld=r.oldRem-amt; else newSale=r.saleRem-amt; document.getElementById('pPreview').classList.remove('hidden'); document.getElementById('pPreview').innerHTML=`${payType=='old'?'OLD':'SALE'} க்கு Rs.${amt} கழித்தால்<br>Old மீதி: Rs.${newOld} | Sale மீதி: Rs.${newSale}<br><b>புது மொத்தம்: Rs.${newOld+newSale}</b>`;}
function doPay(){let amt=parseFloat(document.getElementById('pAmt').value); if(!amt) return alert('Amount'); let s=shops.find(x=>x.id==curId); if(payType=='old') s.oldPaid+=amt; else s.salePaid+=amt; s.totalPaid=(s.oldPaid||0)+(s.salePaid||0); tx.unshift({id:Date.now(),shopId:s.id,shopName:s.name,area:s.area,type:'payment',amount:amt,for:payType,dateStr:new Date().toLocaleDateString()}); save(); document.getElementById('payM').classList.add('hidden'); render();}
function openRep(id){curId=id; let s=shops.find(x=>x.id==id); let r=getRem(s); let list=tx.filter(t=>t.shopId==id); document.getElementById('rTitle').innerText=`${s.name} | Old மீதி:${r.oldRem} | Sale மீதி:${r.saleRem}`; let html=`<div class="grid grid-cols-2 gap-3 mb-3"><div class="bg-orange-50 border-2 border-orange-200 p-3 rounded-2xl"><div class="text-[10px] font-bold text-orange-600">OLD BALANCE தனி கணக்கு</div><div class="text-xs mt-1">Old: ${s.oldBalance}</div><div class="text-xs">Paid (Old): ${s.oldPaid}</div><div class="font-bold text-orange-700">மீதி Old: Rs.${r.oldRem}</div><div class="text-[9px] mt-1">Formula: ${s.oldBalance} - ${s.oldPaid} = ${r.oldRem}</div></div><div class="bg-green-50 border-2 border-green-200 p-3 rounded-2xl"><div class="text-[10px] font-bold text-green-600">NEW SALE தனி கணக்கு</div><div class="text-xs mt-1">Sale: ${s.totalSale}</div><div class="text-xs">Paid (Sale): ${s.salePaid}</div><div class="font-bold text-green-700">மீதி Sale: Rs.${r.saleRem}</div><div class="text-[9px] mt-1">Formula: ${s.totalSale} - ${s.salePaid} = ${r.saleRem}</div></div></div><div class="bg-[#0a5c26] text-white p-3 rounded-xl text-center mb-3"><div class="text-xs">மொத்த பாக்கி = Old மீதி + Sale மீதி</div><div class="font-bold">${r.oldRem} + ${r.saleRem} = Rs.${r.total}</div></div>`; html+=list.map(t=>{if(t.type=='sale') return `<div class="border-l-4 border-green-600 p-2 bg-green-50 rounded-r-xl mb-2 text-xs"><b>SALE (தனி) Rs.${t.total}</b> ${t.dateStr}<br>${t.details}</div>`; else return `<div class="border-l-4 border-blue-500 p-2 bg-blue-50 rounded-r-xl mb-2 text-xs"><b>PAID Rs.${t.amount} - ${t.for=='old'?'OLD க்கு':'SALE க்கு'} கழிவு</b> ${t.dateStr}</div>`;}).join('')||'No data'; document.getElementById('rContent').innerHTML=html; document.getElementById('repM').classList.remove('hidden');}
function openAll(){let totOld=shops.reduce((a,b)=>a+getRem(b).oldRem,0), totSale=shops.reduce((a,b)=>a+getRem(b).saleRem,0); let html=`<div class="grid grid-cols-2 gap-3 mb-4"><div class="bg-orange-500 text-white p-4 rounded-2xl"><div class="text-xs">OLD பாக்கி மொத்தம்</div><div class="text-xl font-bold">Rs.${totOld}</div></div><div class="bg-green-600 text-white p-4 rounded-2xl"><div class="text-xs">SALE பாக்கி மொத்தம்</div><div class="text-xl font-bold">Rs.${totSale}</div></div></div><div class="bg-[#0a5c26] text-white p-3 rounded-xl text-center mb-3">மொத்தம் Rs.${totOld+totSale} = Old ${totOld} + Sale ${totSale}</div>`+shops.map(s=>{let r=getRem(s); return `<div class="flex justify-between border p-2 rounded-xl mb-1 text-xs"><span>${s.name} | Old மீதி:${r.oldRem} | Sale மீதி:${r.saleRem}</span><b>Rs.${r.total}</b></div>`;}).join(''); document.getElementById('allContent').innerHTML=html; document.getElementById('allM').classList.remove('hidden');}
render();
</script></body></html>
