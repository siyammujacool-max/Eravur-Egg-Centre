<!DOCTYPE html>
<html lang="ta">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERAVUR EGG FINAL</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#f0f4ec]">
<div id="loginScreen" class="fixed inset-0 bg-[#0a5c26] z-[100] flex items-center justify-center p-5">
<div class="bg-white w-full max-w-sm rounded-[24px] p-6 text-center">
<div class="text-5xl mb-2">🥚</div><h1 class="font-bold text-[#0a5c26]">ERAVUR EGG FINAL</h1>
<p class="text-[11px] text-gray-500 mb-3">Backup Import + All Features</p>
<input id="loginUser" class="w-full border-2 rounded-xl p-3 mb-2 font-bold" value="eravur">
<input id="loginPin" type="password" class="w-full border-2 rounded-xl p-3 mb-3 font-bold" value="1234">
<button onclick="doLogin()" class="w-full bg-[#0a5c26] text-white py-3 rounded-xl font-bold">Login</button>
<div class="mt-4 border-t pt-3">
<p class="text-xs font-bold">Backup Restore:</p>
<input type="file" id="importFile" accept=".json" class="w-full text-xs mt-2">
<button onclick="importBackup()" class="w-full bg-yellow-400 text-black py-2 rounded-xl text-xs font-bold mt-2">Import Backup JSON</button>
<p class="text-[10px] text-gray-400 mt-2">Un eravur_backup_*.json file ah select panni Import pannu - 34 kadai varum!</p>
</div>
</div></div>

<div id="appContent" class="hidden pb-[90px]">
<div class="bg-[#0a5c26] text-white p-4 sticky top-0 z-40">
<div class="flex justify-between items-center"><h1 class="font-bold text-sm">🥚 ERAVUR FINAL</h1><div class="flex gap-1"><button onclick="openPriceSettings()" class="bg-yellow-400 text-black px-3 py-1 rounded-full text-[10px] font-bold">⚙️ விலை</button><button onclick="backupData()" class="bg-white/20 px-2 py-1 rounded-full text-[10px]">💾 Backup</button><button onclick="doLogout()" class="bg-white/20 px-2 py-1 rounded-full text-[10px]">Logout</button></div></div>
<div class="mt-2 flex gap-2"><input id="search" oninput="renderShops()" placeholder="தேடு..." class="flex-1 px-4 py-2 rounded-full text-black text-sm outline-none"><button onclick="openAddShop()" class="bg-yellow-400 text-black px-4 py-2 rounded-full font-bold text-xs">+ புது கடை</button></div>
</div>
<div class="flex gap-2 p-3 overflow-x-auto"><button onclick="setArea('ALL')" id="tab-ALL" class="bg-[#0a5c26] text-white px-4 py-1.5 rounded-full text-xs font-bold">ALL</button><button onclick="setArea('Oddamavadi')" id="tab-Oddamavadi" class="bg-white px-4 py-1.5 rounded-full text-xs font-bold border">Oddamavadi</button><button onclick="setArea('Chenkalady')" id="tab-Chenkalady" class="bg-white px-4 py-1.5 rounded-full text-xs font-bold border">Chenkalady</button><button onclick="setArea('Eravur')" id="tab-Eravur" class="bg-white px-4 py-1.5 rounded-full text-xs font-bold border">Eravur</button></div>
<div id="shopList" class="px-3 space-y-2"></div>
<div class="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-black p-2 flex justify-around"><div id="totBalance" class="font-bold text-[#0a5c26] text-xs">Rs.0</div><button onclick="openAllReport()" class="bg-[#0a5c26] text-white px-5 py-1 rounded-full text-xs font-bold">📊 REPORTS</button><button onclick="exportExcel()" class="text-xs font-bold">📥 Excel</button></div>
</div>

<div id="addModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end justify-center p-3"><div class="bg-white w-full max-w-md rounded-t-[20px] p-5"><h3 class="font-bold">புது கடை</h3><input id="newName" class="w-full border-2 border-black rounded-xl p-3 mt-2 mb-2 font-bold" placeholder="பெயர்"><select id="newArea" class="w-full border-2 border-black rounded-xl p-3 mb-2 font-bold"><option>Oddamavadi</option><option>Chenkalady</option><option>Eravur</option></select><input id="newPhone" class="w-full border-2 rounded-xl p-3 mb-2" placeholder="Phone"><input id="newOld" type="number" class="w-full border-2 border-black rounded-xl p-3 mb-2 font-bold" value="0" placeholder="Old Balance"><div class="flex gap-2"><button onclick="closeAddShop()" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="saveNewShop()" class="flex-1 bg-[#0a5c26] text-white py-3 rounded-xl font-bold">Save</button></div></div></div>
<div id="priceModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end justify-center p-3"><div class="bg-white w-full max-w-md rounded-t-[20px] p-5"><h3 class="font-bold">விலை 240,260,280,300</h3><div id="priceInputs" class="space-y-2 mt-3"></div><div class="flex gap-2 mt-3"><button onclick="closePriceSettings()" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="savePriceSettings()" class="flex-1 bg-black text-white py-3 rounded-xl font-bold">Save</button></div></div></div>
<div id="saleModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-end justify-center p-3"><div class="bg-white w-full max-w-md rounded-t-[20px] p-4 max-h-[90vh] overflow-y-auto"><div class="flex justify-between mb-2"><h3 id="saleTitle" class="font-bold"></h3><span id="saleOld" class="text-xs bg-yellow-100 px-2 py-1 rounded-full"></span></div><div class="bg-blue-50 border-2 border-dashed rounded-xl p-2 mb-2"><label class="text-xs font-bold">📅 Date Edit</label><input id="saleDate" type="date" class="w-full border-2 border-black rounded-xl p-2 mt-1 font-bold"></div><div id="eggInputs" class="space-y-2"></div><div class="mt-3 p-3 bg-[#0a5c26] text-white rounded-xl text-center"><span>Bill Rs.<b id="saleToday">0</b></span> | <span>Total <b id="saleGrand" class="text-yellow-300">0</b></span><div id="saleDetails" class="text-[10px] mt-1 opacity-70"></div></div><div class="flex gap-2 mt-3"><button onclick="closeSale()" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="confirmSale()" class="flex-1 bg-[#0a5c26] text-white py-3 rounded-xl font-bold">Save Sale</button></div></div></div>
<div id="payModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4"><div class="bg-white w-full max-w-sm rounded-[20px] p-5"><h3 id="payTitle" class="font-bold mb-2"></h3><div id="payInfo" class="text-sm bg-blue-50 p-2 rounded-xl mb-2"></div><input id="payDate" type="date" class="w-full border-2 border-black rounded-xl p-2 mb-2 font-bold"><input id="payAmount" type="number" class="w-full border-2 border-black rounded-xl p-3 mb-3 font-bold" placeholder="Paid"><div class="flex gap-2"><button onclick="closePay()" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="confirmPay()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold">Paid</button></div></div></div>
<div id="reportModal" class="hidden fixed inset-0 bg-white z-[60] overflow-y-auto"><div class="bg-[#0a5c26] text-white p-3 flex justify-between sticky top-0"><h3 id="repTitle" class="font-bold text-sm"></h3><button onclick="closeReport()" class="bg-white/20 px-3 py-1 rounded-full">X</button></div><div class="p-2 bg-gray-50 flex gap-2"><button onclick="shareCustomerDetails()" class="flex-1 bg-green-600 text-white py-2 rounded-xl text-xs font-bold">📱 WhatsApp ku Anuppu</button><button onclick="editShopFromReport()" class="bg-white border-2 border-black py-2 px-3 rounded-xl text-xs font-bold">✏️ Old</button><button onclick="deleteShop()" class="bg-red-50 border-2 py-2 px-3 rounded-xl text-xs font-bold text-red-600">🗑️</button></div><div id="repContent" class="p-3"></div></div>
<div id="editTxModal" class="hidden fixed inset-0 bg-black/60 z-[70] flex items-center justify-center p-4"><div class="bg-white w-full max-w-sm rounded-[20px] p-5"><h3 id="editTxTitle" class="font-bold mb-2">Edit</h3><div id="editTxBody"></div><div class="flex gap-2 mt-3"><button onclick="closeEditTx()" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="saveEditTx()" class="flex-1 bg-[#0a5c26] text-white py-3 rounded-xl font-bold">Update</button><button onclick="deleteTx()" class="bg-red-100 text-red-600 px-3 py-3 rounded-xl font-bold">🗑️</button></div></div></div>
<div id="allReportModal" class="hidden fixed inset-0 bg-white z-[70] overflow-y-auto"><div class="bg-[#0a5c26] text-white p-3 flex justify-between sticky top-0"><h3 class="font-bold">📊 REPORTS</h3><button onclick="closeAllReport()" class="bg-white/20 px-3 py-1 rounded-full">X</button></div><div id="allReportContent" class="p-3"></div></div>

<script>
let shops=JSON.parse(localStorage.getItem('egg_shops_final')||'[]');
let tx=JSON.parse(localStorage.getItem('egg_tx_final')||'[]');
let rates=JSON.parse(localStorage.getItem('egg_rates_final')||'null')||{240:24,260:26,280:28,300:30};
let curArea='ALL',curShopId=null,saleState={},editTxId=null;
const sizes=[240,260,280,300];
function save(){localStorage.setItem('egg_shops_final',JSON.stringify(shops));localStorage.setItem('egg_tx_final',JSON.stringify(tx));localStorage.setItem('egg_rates_final',JSON.stringify(rates));}
function doLogin(){let u=document.getElementById('loginUser').value.trim(),p=document.getElementById('loginPin').value.trim();if(u==='eravur'&&p==='1234'){localStorage.setItem('egg_logged_final','yes');document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appContent').classList.remove('hidden');renderShops();}else alert('Wrong');}
function doLogout(){localStorage.removeItem('egg_logged_final');location.reload();}
if(localStorage.getItem('egg_logged_final')==='yes'){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appContent').classList.remove('hidden');}
function importBackup(){let f=document.getElementById('importFile').files[0];if(!f)return alert('File select pannu!');let r=new FileReader();r.onload=e=>{let data=JSON.parse(e.target.result);shops=data.shops.map(s=>{let b=(s.oldBalance||0)-(s.oldPaid||0)+(s.totalSale||0)-(s.salePaid||0);return{id:s.id,name:s.name,area:s.area,phone:s.phone||'',oldBalance:s.oldBalance||0,oldPaid:s.oldPaid||0,totalSale:s.totalSale||0,totalPaid:(s.oldPaid||0)+(s.salePaid||0),balance:b}});tx=data.tx||[];save();alert(shops.length+' kadai import aayiduchu! ✅');renderShops();};r.readAsText(f);}
function setArea(a){curArea=a;document.querySelectorAll('[id^=tab-]').forEach(b=>b.className='bg-white px-4 py-1.5 rounded-full text-xs font-bold border');document.getElementById('tab-'+a).className='bg-[#0a5c26] text-white px-4 py-1.5 rounded-full text-xs font-bold';renderShops();}
function renderShops(){let q=document.getElementById('search').value.toLowerCase();let filtered=shops.filter(s=>(curArea=='ALL'||s.area==curArea)&&s.name.toLowerCase().includes(q));let html='';filtered.forEach(s=>{html+=`<div class="bg-white rounded-[14px] p-3 border-l-[5px] border-[#0a5c26] shadow-sm"><div class="flex justify-between"><div onclick="openReport(${s.id})" class="flex-1"><div class="font-bold text-[12px]">${s.name} <span class="text-[9px] bg-gray-100 px-2 py-0.5 rounded-full">${s.area}</span></div><div class="text-[10px] text-gray-500">Bal Rs.${s.balance} | Sale ${s.totalSale}</div></div><button onclick="shareCustomerDetailsDirect(${s.id})" class="text-lg">📱</button></div><div class="grid grid-cols-3 gap-1 mt-2"><button onclick="openSale(${s.id})" class="bg-[#0a5c26] text-white py-2 rounded-xl text-[11px] font-bold">Sale</button><button onclick="openPay(${s.id})" class="bg-blue-600 text-white py-2 rounded-xl text-[11px] font-bold">Paid</button><button onclick="openReport(${s.id})" class="bg-gray-100 py-2 rounded-xl text-[11px] font-bold">Report</button></div></div>`;});document.getElementById('shopList').innerHTML=html||'<div class="text-center text-gray-400 mt-10">No shops - Import backup file!</div>';let tot=shops.reduce((a,b)=>a+b.balance,0);document.getElementById('totBalance').innerText='Rs.'+tot;if(shops.length){document.getElementById('tab-ALL').innerText='ALL ('+shops.length+')';document.getElementById('tab-Oddamavadi').innerText='Oddamavadi ('+shops.filter(s=>s.area=='Oddamavadi').length+')';document.getElementById('tab-Chenkalady').innerText='Chenkalady ('+shops.filter(s=>s.area=='Chenkalady').length+')';document.getElementById('tab-Eravur').innerText='Eravur ('+shops.filter(s=>s.area=='Eravur').length+')';}}
function openAddShop(){document.getElementById('addModal').classList.remove('hidden');}
function closeAddShop(){document.getElementById('addModal').classList.add('hidden');}
function saveNewShop(){let n=document.getElementById('newName').value.trim();if(!n)return alert('Name!');let a=document.getElementById('newArea').value,p=document.getElementById('newPhone').value,o=parseFloat(document.getElementById('newOld').value)||0;shops.unshift({id:Date.now(),name:n,area:a,phone:p,oldBalance:o,oldPaid:0,totalSale:0,totalPaid:0,balance:o});save();closeAddShop();document.getElementById('newName').value='';renderShops();}
function openPriceSettings(){let h='';sizes.forEach(sz=>{h+=`<div class="flex justify-between bg-gray-50 p-2 rounded-xl border-2 border-black"><span class="font-bold text-sm">W${sz}</span><input id="rate${sz}" type="number" value="${rates[sz]}" class="w-16 border-2 border-black rounded-xl p-1 text-center font-bold"></div>`;});document.getElementById('priceInputs').innerHTML=h;document.getElementById('priceModal').classList.remove('hidden');}
function closePriceSettings(){document.getElementById('priceModal').classList.add('hidden');}
function savePriceSettings(){sizes.forEach(sz=>{rates[sz]=parseFloat(document.getElementById('rate'+sz).value)||0;});save();closePriceSettings();}
function openSale(id){curShopId=id;saleState={};sizes.forEach(sz=>saleState[sz]={qty:0,rate:rates[sz]});let s=shops.find(x=>x.id==id);document.getElementById('saleTitle').innerText=s.name;document.getElementById('saleOld').innerText='Bal '+s.balance;document.getElementById('saleDate').valueAsDate=new Date();let h='';sizes.forEach(sz=>{h+=`<div class="flex gap-1 items-center"><div class="w-12 font-bold text-xs">W${sz}</div><div class="flex-1 flex border-2 border-black rounded-xl overflow-hidden"><button onclick="chgSale(${sz},-1)" class="px-2 py-1 bg-green-50 font-bold">-</button><input id="qs${sz}" type="number" value="0" oninput="saleState[${sz}].qty=parseInt(this.value)||0;calcSale()" class="flex-1 text-center font-bold text-sm"><button onclick="chgSale(${sz},1)" class="px-2 py-1 bg-green-50 font-bold">+</button></div><input id="rs${sz}" type="number" value="${rates[sz]}" oninput="saleState[${sz}].rate=parseFloat(this.value)||0;calcSale()" class="w-14 border-2 border-black rounded-xl p-1 text-center font-bold text-xs"></div>`;});document.getElementById('eggInputs').innerHTML=h;calcSale();document.getElementById('saleModal').classList.remove('hidden');}
function chgSale(sz,d){saleState[sz].qty=Math.max(0,saleState[sz].qty+d);document.getElementById('qs'+sz).value=saleState[sz].qty;calcSale();}
function calcSale(){let s=shops.find(x=>x.id==curShopId);let today=0,eggs=0,det=[];sizes.forEach(sz=>{let q=saleState[sz].qty,r=saleState[sz].rate;let e=sz*q;today+=e*r;eggs+=e;if(q>0)det.push(`W${sz}x${q}=${e}@${r}`);});document.getElementById('saleToday').innerText=today;document.getElementById('saleGrand').innerText='Rs.'+(today+s.balance);document.getElementById('saleDetails').innerText=det.join(' | ');return{today,grand:today+s.balance,eggs,det};}
function closeSale(){document.getElementById('saleModal').classList.add('hidden');}
function confirmSale(){let c=calcSale();if(c.today==0)return alert('Qty!');let s=shops.find(x=>x.id==curShopId);let d=document.getElementById('saleDate').value;let dateObj=d?new Date(d):new Date();s.balance=c.grand;s.totalSale+=c.today;tx.unshift({id:Date.now(),shopId:s.id,shopName:s.name,area:s.area,type:'sale',total:c.today,balance:c.grand,eggs:c.eggs,details:c.det.join(', '),date:dateObj.toISOString(),dateStr:dateObj.toLocaleDateString()});save();closeSale();renderShops();}
function openPay(id){curShopId=id;let s=shops.find(x=>x.id==id);document.getElementById('payTitle').innerText=s.name+' Paid';document.getElementById('payInfo').innerText='Bal Rs.'+s.balance;document.getElementById('payDate').valueAsDate=new Date();document.getElementById('payAmount').value='';document.getElementById('payModal').classList.remove('hidden');}
function closePay(){document.getElementById('payModal').classList.add('hidden');}
function confirmPay(){let amt=parseFloat(document.getElementById('payAmount').value);if(!amt)return alert('Amount!');let s=shops.find(x=>x.id==curShopId);let d=document.getElementById('payDate').value;let dateObj=d?new Date(d):new Date();s.balance-=amt;s.totalPaid+=amt;tx.unshift({id:Date.now(),shopId:s.id,shopName:s.name,area:s.area,type:'payment',amount:amt,balance:s.balance,date:dateObj.toISOString(),dateStr:dateObj.toLocaleDateString()});save();closePay();renderShops();}
function openReport(id){curShopId=id;let s=shops.find(x=>x.id==id);let list=tx.filter(t=>t.shopId==id);document.getElementById('repTitle').innerText=s.name+' Bal Rs.'+s.balance;let html=`<div class="grid grid-cols-3 gap-2 mb-3"><div class="bg-green-50 border-2 p-2 rounded-xl text-center text-xs"><div>Sale</div><b>Rs.${s.totalSale}</b></div><div class="bg-blue-50 border-2 p-2 rounded-xl text-center text-xs"><div>Paid</div><b>Rs.${s.totalPaid}</b></div><div class="bg-yellow-50 border-2 border-black p-2 rounded-xl text-center text-xs"><div>Bal</div><b>Rs.${s.balance}</b></div></div>`;html+=list.map(t=>{if(t.type=='sale')return `<div onclick="openEditTx(${t.id})" class="border-l-4 border-green-600 p-2 bg-gray-50 rounded-r-xl mb-2 text-xs"><b>SALE Rs.${t.total}</b> ${t.dateStr} ✏️<br>${t.details}</div>`;else return `<div onclick="openEditTx(${t.id})" class="border-l-4 border-blue-500 p-2 bg-blue-50 rounded-r-xl mb-2 text-xs"><b>PAID Rs.${t.amount}</b> ${t.dateStr} ✏️</div>`;}).join('')||'No data';document.getElementById('repContent').innerHTML=html;document.getElementById('reportModal').classList.remove('hidden');}
function closeReport(){document.getElementById('reportModal').classList.add('hidden');}
function editShopFromReport(){let s=shops.find(x=>x.id==curShopId);let ob=prompt('Old Balance:',s.oldBalance);if(ob===null)return;let newOb=parseFloat(ob)||0;let diff=newOb-s.oldBalance;s.oldBalance=newOb;s.balance+=diff;save();openReport(curShopId);renderShops();}
function deleteShop(){if(!confirm('Delete?'))return;shops=shops.filter(s=>s.id!=curShopId);tx=tx.filter(t=>t.shopId!=curShopId);save();closeReport();renderShops();}
function openEditTx(tid){editTxId=tid;let t=tx.find(x=>x.id==tid);document.getElementById('editTxTitle').innerText=t.type=='sale'?'Sale Edit':'Pay Edit';let body='';if(t.type=='sale'){body=`<label class="text-xs font-bold">📅 Date</label><input id="editDate" type="date" class="w-full border-2 border-black rounded-xl p-2 mb-2 font-bold" value="${new Date(t.date).toISOString().split('T')[0]}"><label class="text-xs font-bold">Total</label><input id="editTotal" type="number" value="${t.total}" class="w-full border-2 border-black rounded-xl p-2 font-bold">`;}else{body=`<label class="text-xs font-bold">📅 Date</label><input id="editDate" type="date" class="w-full border-2 border-black rounded-xl p-2 mb-2 font-bold" value="${new Date(t.date).toISOString().split('T')[0]}"><label class="text-xs font-bold">Paid</label><input id="editTotal" type="number" value="${t.amount}" class="w-full border-2 border-black rounded-xl p-2 font-bold">`;}document.getElementById('editTxBody').innerHTML=body;document.getElementById('editTxModal').classList.remove('hidden');}
function closeEditTx(){document.getElementById('editTxModal').classList.add('hidden');editTxId=null;}
function saveEditTx(){let t=tx.find(x=>x.id==editTxId);let s=shops.find(x=>x.id==t.shopId);let newDateVal=document.getElementById('editDate').value;let newDate=newDateVal?new Date(newDateVal):new Date(t.date);let newTotal=parseFloat(document.getElementById('editTotal').value)||0;if(t.type=='sale'){s.balance-=t.total;s.totalSale-=t.total;s.balance+=newTotal;s.totalSale+=newTotal;t.total=newTotal;t.balance=s.balance;}else{s.balance+=t.amount;s.totalPaid-=t.amount;s.balance-=newTotal;s.totalPaid+=newTotal;t.amount=newTotal;t.balance=s.balance;}t.date=newDate.toISOString();t.dateStr=newDate.toLocaleDateString();save();closeEditTx();openReport(s.id);renderShops();}
function deleteTx(){if(!confirm('Delete? Balance auto adjust!'))return;let t=tx.find(x=>x.id==editTxId);let s=shops.find(x=>x.id==t.shopId);if(t.type=='sale'){s.balance-=t.total;s.totalSale-=t.total;}else{s.balance+=t.amount;s.totalPaid-=t.amount;}tx=tx.filter(x=>x.id!=editTxId);save();closeEditTx();openReport(s.id);renderShops();}
function shareCustomerDetails(){shareCustomerDetailsDirect(curShopId);}
function shareCustomerDetailsDirect(id){let s=shops.find(x=>x.id==id);let list=tx.filter(t=>t.shopId==id).slice(0,10);let msg=`🥚 *ERAVUR EGG CENTRE* 🥚\n🏪 ${s.name}\n📍 ${s.area}\n💰 *பாக்கி: Rs.${s.balance}*\n📦 Sale: Rs.${s.totalSale}\n💵 Paid: Rs.${s.totalPaid}\n---\n${list.map(t=>t.type=='sale'?`• ${t.dateStr} SALE Rs.${t.total}`:`• ${t.dateStr} PAID Rs.${t.amount}`).join('\n')}\nநன்றி 🙏`;let phone=(s.phone||'').replace(/[^0-9]/g,'');let url=phone?`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`;window.open(url,'_blank');}
function openAllReport(){let tot=shops.reduce((a,b)=>a+b.balance,0);let areaData={};shops.forEach(s=>{if(!areaData[s.area])areaData[s.area]={bal:0,count:0};areaData[s.area].bal+=s.balance;areaData[s.area].count++;});let top=[...shops].sort((a,b)=>b.balance-a.balance).slice(0,15);let html=`<div class="bg-[#0a5c26] text-white p-4 rounded-xl mb-3">மொத்தம் Rs.${tot} - ${shops.length} கடை</div><div class="grid grid-cols-3 gap-2 mb-3">${Object.entries(areaData).map(([a,d])=>`<div class="border-2 p-2 rounded-xl text-center"><div class="text-[10px]">${a}</div><b>Rs.${d.bal}</b><div class="text-[9px]">${d.count} கடை</div></div>`).join('')}</div><div>${top.map((s,i)=>`<div class="flex justify-between bg-white border p-2 rounded-xl mb-1 text-xs"><span>${i+1}. ${s.name}</span><b class="text-red-600">Rs.${s.balance}</b></div>`).join('')}</div>`;document.getElementById('allReportContent').innerHTML=html;document.getElementById('allReportModal').classList.remove('hidden');}
function closeAllReport(){document.getElementById('allReportModal').classList.add('hidden');}
function exportExcel(){let csv="Shop,Area,Phone,Old,TotalSale,TotalPaid,Balance\n"+shops.map(s=>`"${s.name}","${s.area}","${s.phone}",${s.oldBalance},${s.totalSale},${s.totalPaid},${s.balance}`).join("\n");let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Eravur.csv';a.click();}
function backupData(){let data={shops:shops,tx:tx,rates:rates,updated:new Date().toISOString()};let blob=new Blob([JSON.stringify(data)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='eravur_backup_'+Date.now()+'.json';a.click();}
renderShops();
</script>
</body>
