const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let shops=[]; let tx=[]; let rates={240:24,260:26,280:28,300:30};
let curArea='ALL'; let curShopId=null; let saleState={}; let editTxId=null;
const sizes=[240,260,280,300];
window.doLogin=()=>{let u=document.getElementById('loginUser').value.trim(); let p=document.getElementById('loginPin').value.trim(); if(u==='eravur' && p==='1234'){localStorage.setItem('egg_logged_cloud_final','yes'); document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('appContent').classList.remove('hidden'); loadFromCloud();} else alert('Wrong');};

if(localStorage.getItem('egg_logged_cloud_final')==='yes'){document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('appContent').classList.remove('hidden'); loadFromCloud();}
async function loadFromCloud(){ document.getElementById('syncStatus').innerText='☁️ Connected - eravur-egg'; onSnapshot(collection(db,'shops'), (snap)=>{ shops=[]; snap.forEach(d=>shops.push({id:d.id,...d.data()})); renderShops(); }); onSnapshot(query(collection(db,'transactions'), orderBy('date','desc')), (snap)=>{ tx=[]; snap.forEach(d=>tx.push({id:d.id,...d.data()})); }); onSnapshot(doc(db,'settings','rates'), (snap)=>{ if(snap.exists()){rates=snap.data();} }); }
window.seedBackupToCloud=async()=>{ if(!confirm('34 kadai cloud ku upload pannava?')) return; let count=0; for(let s of BACKUP_DATA.shops){ let b=(s.oldBalance||0)-(s.oldPaid||0)+(s.totalSale||0)-(s.salePaid||0); await addDoc(collection(db,'shops'),{name:s.name, area:s.area, phone:s.phone||'', oldBalance:s.oldBalance||0, oldPaid:s.oldPaid||0, totalSale:s.totalSale||0, totalPaid:(s.oldPaid||0)+(s.salePaid||0), balance:b}); count++; } alert(count+' kadai cloud ku poiruchu! ✅'); };

window.openPriceSettings=()=>{let h=''; sizes.forEach(sz=>{h+=`<div class="flex justify-between bg-gray-50 p-3 rounded-xl border-2"><span class="font-bold">W${sz}</span><input id="rate${sz}" type="number" value="${rates[sz]}" class="w-20 border-2 border-black rounded-xl p-2 text-center font-bold"></div>`;}); document.getElementById('priceInputs').innerHTML=h; document.getElementById('priceModal').classList.remove('hidden');};

window.chgSale=(sz,d)=>{saleState[sz].qty=Math.max(0,saleState[sz].qty+d); document.getElementById('qs'+sz).value=saleState[sz].qty; calcSale();};
window.calcSale=()=>{let s=shops.find(x=>x.id==curShopId); let today=0,eggs=0,det=[]; sizes.forEach(sz=>{let q=saleState[sz].qty,r=saleState[sz].rate; let e=sz*q; today+=e*r; eggs+=e; if(q>0) det.push(`W${sz}x${q}=${e}@${r}`);}); document.getElementById('saleToday').innerText=today; document.getElementById('saleGrand').innerText='Rs.'+(today+s.balance); document.getElementById('saleDetails').innerText=det.join(' | '); return {today,grand:today+s.balance,eggs,det};};
window.closeSale=()=>document.getElementById('saleModal').classList.add('hidden');
window.confirmSale=async()=>{let c=calcSale(); if(c.today==0) return alert('Qty!'); let s=shops.find(x=>x.id==curShopId); let d=document.getElementById('saleDate').value; let dateObj=d?new Date(d):new Date(); let newBal=c.grand; await updateDoc(doc(db,'shops',s.id),{balance:newBal, totalSale:(s.totalSale||0)+c.today}); await addDoc(collection(db,'transactions'),{shopId:s.id,shopName:s.name,area:s.area,type:'sale',total:c.today,balance:newBal,eggs:c.eggs,details:c.det.join(', '),date:dateObj.toISOString(),dateStr:dateObj.toLocaleDateString()}); closeSale();};
window.openPay=(id)=>{curShopId=id; let s=shops.find(x=>x.id==id); document.getElementById('payTitle').innerText=s.name+' Paid'; document.getElementById('payInfo').innerText='Bal Rs.'+s.balance; document.getElementById('payDate').valueAsDate=new Date(); document.getElementById('payAmount').value=''; document.getElementById('payModal').classList.remove('hidden');};
window.closePay=()=>document.getElementById('payModal').classList.add('hidden');
window.confirmPay=async()=>{let amt=parseFloat(document.getElementById('payAmount').value); if(!amt) return alert('Amount!'); let s=shops.find(x=>x.id==curShopId); let d=document.getElementById('payDate').value; let dateObj=d?new Date(d):new Date(); let newBal=(s.balance||0)-amt; await updateDoc(doc(db,'shops',s.id),{balance:newBal, totalPaid:(s.totalPaid||0)+amt}); await addDoc(collection(db,'transactions'),{shopId:s.id,shopName:s.name,area:s.area,type:'payment',amount:amt,balance:newBal,date:dateObj.toISOString(),dateStr:dateObj.toLocaleDateString()}); closePay();};
window.openReport=(id)=>{curShopId=id; let s=shops.find(x=>x.id==id); let list=tx.filter(t=>t.shopId==id); document.getElementById('repTitle').innerText=s.name+' Bal Rs.'+s.balance; let html=`<div class="grid grid-cols-3 gap-2 mb-3"><div class="bg-green-50 border-2 p-2 rounded-xl text-center text-xs"><div>Sale</div><b>Rs.${s.totalSale||0}</b></div><div class="bg-blue-50 border-2 p-2 rounded-xl text-center text-xs"><div>Paid</div><b>Rs.${s.totalPaid||0}</b></div><div class="bg-yellow-50 border-2 border-black p-2 rounded-xl text-center text-xs"><div>Bal</div><b>Rs.${s.balance||0}</b></div></div>`; html+=list.map(t=>{if(t.type=='sale') return `<div onclick="openEditTx('${t.id}')" class="border-l-4 border-green-600 p-2 bg-gray-50 rounded-r-xl mb-2 text-xs cursor-pointer"><b>SALE Rs.${t.total}</b> ${t.dateStr} ✏️<br>${t.details}</div>`; else return `<div onclick="openEditTx('${t.id}')" class="border-l-4 border-blue-500 p-2 bg-blue-50 rounded-r-xl mb-2 text-xs cursor-pointer"><b>PAID Rs.${t.amount}</b> ${t.dateStr} ✏️</div>`;}).join('')||'No data'; document.getElementById('repContent').innerHTML=html; document.getElementById('reportModal').classList.remove('hidden');};
window.closeReport=()=>document.getElementById('reportModal').classList.add('hidden');
window.editShopFromReport=async()=>{let s=shops.find(x=>x.id==curShopId); let ob=prompt('Old Balance:',s.oldBalance); if(ob===null) return; let newOb=parseFloat(ob)||0; let diff=newOb-(s.oldBalance||0); await updateDoc(doc(db,'shops',s.id),{oldBalance:newOb, balance:(s.balance||0)+diff});};
window.deleteShop=async()=>{if(!confirm('Delete?')) return; await deleteDoc(doc(db,'shops',curShopId));};
window.openEditTx=(tid)=>{editTxId=tid; let t=tx.find(x=>x.id==tid); document.getElementById('editTxTitle').innerText=t.type=='sale'?'Sale Edit':'Pay Edit'; let body=''; if(t.type=='sale'){body=`<label class="text-xs font-bold">📅 Date</label><input id="editDate" type="date" class="w-full border-2 border-black rounded-xl p-3 mb-3 font-bold" value="${new Date(t.date).toISOString().split('T')[0]}"><label class="text-xs font-bold">Total</label><input id="editTotal" type="number" value="${t.total}" class="w-full border-2 border-black rounded-xl p-3 font-bold">`;} else {body=`<label class="text-xs font-bold">📅 Date</label><input id="editDate" type="date" class="w-full border-2 border-black rounded-xl p-3 mb-3 font-bold" value="${new Date(t.date).toISOString().split('T')[0]}"><label class="text-xs font-bold">Paid</label><input id="editTotal" type="number" value="${t.amount}" class="w-full border-2 border-black rounded-xl p-3 font-bold">`;} document.getElementById('editTxBody').innerHTML=body; document.getElementById('editTxModal').classList.remove('hidden');};
window.closeEditTx=()=>{document.getElementById('editTxModal').classList.add('hidden'); editTxId=null;};
window.saveEditTx=async()=>{let t=tx.find(x=>x.id==editTxId); let s=shops.find(x=>x.id==t.shopId); let newDateVal=document.getElementById('editDate').value; let newDate=newDateVal?new Date(newDateVal):new Date(t.date); let newTotal=parseFloat(document.getElementById('editTotal').value)||0; let newBal=s.balance; if(t.type=='sale'){newBal=s.balance-t.total+newTotal; await updateDoc(doc(db,'shops',s.id),{balance:newBal, totalSale:(s.totalSale||0)-t.total+newTotal}); await updateDoc(doc(db,'transactions',t.id),{total:newTotal, balance:newBal, date:newDate.toISOString(), dateStr:newDate.toLocaleDateString()});} else {newBal=s.balance+t.amount-newTotal; await updateDoc(doc(db,'shops',s.id),{balance:newBal, totalPaid:(s.totalPaid||0)-t.amount+newTotal}); await updateDoc(doc(db,'transactions',t.id),{amount:newTotal, balance:newBal, date:newDate.toISOString(), dateStr:newDate.toLocaleDateString()});} closeEditTx();};
window.deleteTx=async()=>{if(!confirm('Delete?')) return; let t=tx.find(x=>x.id==editTxId); let s=shops.find(x=>x.id==t.shopId); if(t.type=='sale'){await updateDoc(doc(db,'shops',s.id),{balance:s.balance-t.total, totalSale:(s.totalSale||0)-t.total});} else {await updateDoc(doc(db,'shops',s.id),{balance:s.balance+t.amount, totalPaid:(s.totalPaid||0)-t.amount});} await deleteDoc(doc(db,'transactions',t.id)); closeEditTx();};
window.shareCustomerDetails=()=>{shareCustomerDetailsDirect(curShopId);};
window.shareCustomerDetailsDirect=(id)=>{let s=shops.find(x=>x.id==id); let msg=`🥚 ERAVUR EGG 🥚\n🏪 ${s.name} \n📍 ${s.area} \n💰 Bakki Rs.${s.balance}`; let phone=(s.phone||'').replace(/[^0-9]/g,''); let url=phone?`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`:`https://wa.me/?text=${encodeURIComponent(msg)}`; window.open(url,'_blank');};
window.openAllReport=()=>{let tot=shops.reduce((a,b)=>a+(b.balance||0),0); let html=`<div class="bg-[#0a5c26] text-white p-4 rounded-xl mb-3">Total Rs.${tot} - ${shops.length} kadai Cloud ☁️</div>`; document.getElementById('allReportContent').innerHTML=html; document.getElementById('allReportModal').classList.remove('hidden');};
window.closeAllReport=()=>document.getElementById('allReportModal').classList.add('hidden');
window.exportExcel=()=>{let csv="Shop,Area,Phone,Balance\n"+shops.map(s=>`"${s.name}","${s.area}","${s.phone}",${s.balance}`).join("\n"); let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Eravur_Cloud.csv'; a.click();};
</script></body></html>
