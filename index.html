<script type="module">

const firebaseConfig = { apiKey: "AIzaSyA-OQKxJeDhALnecWc2Jyv_mNxr3W6NFA8", authDomain: "eravur-egg.firebaseapp.com", projectId: "eravur-egg", storageBucket: "eravur-egg.firebasestorage.app", messagingSenderId: "721546852813", appId: "1:721546852813:web:91efbc2c7d5f36f4332c84" };
const BACKUP=[{"name":"Opera BK","area":"Eravur","phone":"0776511096","oldBalance":14000,"oldPaid":7000},{"name":"Haq Hajiyar","area":"Eravur","phone":"0774398031"},{"name":"ரஹுமான் ஹாஜியார்","area":"Oddamavadi"},{"name":"ஜாமல்","area":"Oddamavadi"},{"name":"post office கடை","area":"Oddamavadi"},{"name":"ராபி டா நானா","area":"Oddamavadi"},{"name":"ஹார்ட். கடை","area":"Oddamavadi"},{"name":"மீரவோடை கடை","area":"Oddamavadi"},{"name":"மீரவோடை புது கடை","area":"Oddamavadi"},{"name":"அபுபக்கர்","area":"Oddamavadi"},{"name":"வாளச்சேனை மரக்கறி கடை","area":"Oddamavadi"},{"name":"ஜீவா","area":"Oddamavadi"},{"name":"R. தம்பி","area":"Chenkalady"},{"name":"நிரோஷன்","area":"Chenkalady"},{"name":"ஆனந்தன்","area":"Chenkalady"},{"name":"வெற்றில கடை","area":"Chenkalady"},{"name":"வசந்தன்","area":"Chenkalady"},{"name":"ரஜனி மகன்","area":"Chenkalady"},{"name":"கருவாட்டு கடை","area":"Chenkalady"},{"name":"பிரபாஸ் hotel","area":"Chenkalady","phone":"0765648123","oldBalance":20000},{"name":"மலர் food city","area":"Chenkalady"},{"name":"Bar. MA","area":"Chenkalady"},{"name":"மதுராம் hotel","area":"Chenkalady","phone":"761160985","oldBalance":42720,"oldPaid":10000},{"name":"ரிபாஸ்","area":"Eravur","phone":"774540269","oldBalance":10000},{"name":"மன்சூர்","area":"Eravur","phone":"0777534552","oldBalance":362960,"oldPaid":6000},{"name":"மன்சூர் 2","area":"Eravur","phone":"755883455","oldBalance":18000,"oldPaid":12000},{"name":"சபீர் மௌலவி","area":"Eravur"},{"name":"பதுரியா 1","area":"Eravur","phone":"0750146688","oldBalance":10000},{"name":"புகாரி மருமகன்","area":"Eravur","phone":"0756400197"},{"name":"colombu store","area":"Eravur","phone":"754475350"},{"name":"நதிர்","area":"Eravur"},{"name":"நஜீம்","area":"Eravur"},{"name":"மௌனுதீன்","area":"Eravur"}];
const app=initializeApp(firebaseConfig);const db=getFirestore(app);let shops=[];let tx=[];let rates={240:24,260:26,280:28,300:30};let curArea='ALL';let curShopId=null;let saleState={};const sizes=[240,260,280,300];
window.doLogin=()=>{let u=document.getElementById('loginUser').value.trim();let p=document.getElementById('loginPin').value.trim();if(u==='eravur'&&p==='1234'){localStorage.setItem('egg_logged','yes');document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appContent').classList.remove('hidden');load();}else alert('Wrong! eravur / 1234');};window.doLogout=()=>{localStorage.removeItem('egg_logged');location.reload();};
if(localStorage.getItem('egg_logged')==='yes'){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appContent').classList.remove('hidden');load();}
function load(){onSnapshot(collection(db,'shops'),(snap)=>{shops=[];snap.forEach(d=>shops.push({id:d.id,...d.data()}));document.getElementById('syncStatus').innerText=shops.length+' kadai OK';renderShops();});onSnapshot(query(collection(db,'transactions'),orderBy('date','desc')),(snap)=>{tx=[];snap.forEach(d=>tx.push({id:d.id,...d.data()}));});onSnapshot(doc(db,'settings','rates'),(s)=>{if(s.exists())rates=s.data();});}

// FIXED - NO DUPLICATE ADD
window.seedBackupToCloud=async()=>{
  if(!confirm('Backup data va cloud ku anupava? Duplicate check pannum!'))return;
  let existing = new Set();
  shops.forEach(s=>{
    let key = s.name.trim().toLowerCase()+'|'+s.area.trim().toLowerCase();
    existing.add(key);
  });
  let added=0, skipped=0;
  for(let b of BACKUP){
    let key = b.name.trim().toLowerCase()+'|'+b.area.trim().toLowerCase();
    if(existing.has(key)){ skipped++; continue; }
    let bal = (b.oldBalance||0)-(b.oldPaid||0);
    await addDoc(collection(db,'shops'),{name:b.name,area:b.area,phone:b.phone||'',oldBalance:b.oldBalance||0,oldPaid:b.oldPaid||0,totalSale:0,totalPaid:b.oldPaid||0,balance:bal});
    added++; existing.add(key);
  }
  if(added===0) alert('✅ All already in cloud! Skipped '+skipped+' - No duplicate!');
  else alert('✅ '+added+' added, '+skipped+' skipped (already exists) - No duplicate!');
};

window.setArea=(a)=>{curArea=a;document.querySelectorAll('[id^=tab-]').forEach(b=>{b.className='bg-white px-5 py-2 rounded-full text-xs font-bold border';});document.getElementById('tab-'+a).className='bg-[#0a5c26] text-white px-5 py-2 rounded-full text-xs font-bold';renderShops();};
window.renderShops=()=>{let q=document.getElementById('search').value.toLowerCase();let f=shops.filter(s=>(curArea=='ALL'||s.area==curArea)&&s.name.toLowerCase().includes(q));f.sort((a,b)=>(b.balance||0)-(a.balance||0));let h='';f.forEach(s=>{h+=`<div class="bg-white rounded-[16px] p-4 shadow-sm border"><div class="flex justify-between"><div class="flex-1" onclick="openReport('${s.id}')"><div class="flex items-center gap-2"><span class="font-bold text-[14px]">${s.name}</span><span class="text-[10px] bg-gray-100 px-2 py-0.5 rounded-full border">${s.area}</span></div><div class="text-[11px] text-gray-500 mt-1">Bal Rs.${s.balance||0} | Sale Rs.${s.totalSale||0}</div></div></div><div class="grid grid-cols-3 gap-2 mt-3"><button onclick="openSale('${s.id}')" class="bg-[#0a5c26] text-white py-2 rounded-[10px] text-[12px] font-bold">Sale +</button><button onclick="openPay('${s.id}')" class="bg-[#1a5cff] text-white py-2 rounded-[10px] text-[12px] font-bold">Paid</button><button onclick="openReport('${s.id}')" class="bg-gray-100 py-2 rounded-[10px] text-[12px] font-bold border">Report</button></div></div>`;});document.getElementById('shopList').innerHTML=h||'<div class="text-center mt-20 text-gray-400">No kadai - To Cloud click pannu</div>';let tot=shops.reduce((a,b)=>a+(b.balance||0),0);document.getElementById('totBalance').innerText='Rs.'+tot.toLocaleString()+' | '+shops.length+' kadai';};
window.openAddShop=()=>document.getElementById('addShopModal').classList.remove('hidden');window.closeAddShop=()=>document.getElementById('addShopModal').classList.add('hidden');window.saveNewShop=async()=>{let n=document.getElementById('newName').value.trim();if(!n)return alert('Name podu!');let ar=document.getElementById('newArea').value;if(shops.some(s=>s.name.trim().toLowerCase()===n.toLowerCase()&&s.area===ar))return alert('Already irukku - duplicate!');let p=document.getElementById('newPhone').value;let o=parseFloat(document.getElementById('newOld').value)||0;await addDoc(collection(db,'shops'),{name:n,area:ar,phone:p,oldBalance:o,oldPaid:0,totalSale:0,totalPaid:0,balance:o});closeAddShop();document.getElementById('newName').value='';};
window.openPriceSettings=()=>{let h='';sizes.forEach(sz=>{h+=`<div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl border"><span class="font-bold text-sm">W${sz}</span><input id="rate${sz}" type="number" value="${rates[sz]}" class="w-20 border-2 rounded-xl p-2 text-center font-bold"></div>`;});document.getElementById('priceInputs').innerHTML=h;document.getElementById('priceModal').classList.remove('hidden');};window.closePriceSettings=()=>document.getElementById('priceModal').classList.add('hidden');window.savePriceSettings=async()=>{let nr={};sizes.forEach(sz=>{nr[sz]=parseFloat(document.getElementById('rate'+sz).value)||0;});await setDoc(doc(db,'settings','rates'),nr);alert('Rate saved!');closePriceSettings();};
window.openSale=(id)=>{curShopId=id;saleState={};sizes.forEach(sz=>saleState[sz]={qty:0,rate:rates[sz]});let s=shops.find(x=>x.id==id);document.getElementById('saleTitle').innerText=s.name;document.getElementById('saleOldBal').innerText='Bal Rs.'+s.balance;document.getElementById('saleDate').valueAsDate=new Date();let h='';sizes.forEach(sz=>{h+=`<div class="flex gap-2 items-center"><div class="w-10 font-bold text-xs">W${sz}</div><div class="flex-1 flex border-2 rounded-xl overflow-hidden"><button onclick="chgSale(${sz},-1)" class="px-3 py-2 bg-green-50 font-bold border-r">-</button><input id="qs${sz}" type="number" value="0" oninput="saleState[${sz}].qty=parseInt(this.value)||0;calcSale()" class="flex-1 text-center font-bold outline-none"><button onclick="chgSale(${sz},1)" class="px-3 py-2 bg-green-50 font-bold border-l">+</button></div><input id="rs${sz}" type="number" value="${rates[sz]}" oninput="saleState[${sz}].rate=parseFloat(this.value)||0;calcSale()" class="w-14 border-2 rounded-xl p-2 text-center font-bold text-sm"></div>`;});document.getElementById('eggInputs').innerHTML=h;calcSale();document.getElementById('saleModal').classList.remove('hidden');};window.chgSale=(sz,d)=>{saleState[sz].qty=Math.max(0,saleState[sz].qty+d);document.getElementById('qs'+sz).value=saleState[sz].qty;calcSale();};window.calcSale=()=>{let s=shops.find(x=>x.id==curShopId);let today=0,eggs=0,det=[];sizes.forEach(sz=>{let q=saleState[sz].qty,r=saleState[sz].rate;let e=sz*q;today+=e*r;eggs+=e;if(q>0)det.push(`W${sz}x${q}=${e}@${r}`);});document.getElementById('saleToday').innerText='Rs.'+today;document.getElementById('saleGrand').innerText='Rs.'+(today+s.balance);document.getElementById('saleDetails').innerText=det.join(' | ');return{today,grand:today+s.balance,eggs,det};};window.closeSale=()=>document.getElementById('saleModal').classList.add('hidden');window.confirmSale=async()=>{let c=calcSale();if(c.today==0)return alert('Qty podu da!');let s=shops.find(x=>x.id==curShopId);let d=document.getElementById('saleDate').value;let dateObj=d?new Date(d):new Date();let newBal=c.grand;await updateDoc(doc(db,'shops',s.id),{balance:newBal,totalSale:(s.totalSale||0)+c.today});await addDoc(collection(db,'transactions'),{shopId:s.id,shopName:s.name,area:s.area,type:'sale',total:c.today,balance:newBal,eggs:c.eggs,details:c.det.join(', '),date:dateObj.toISOString(),dateStr:dateObj.toLocaleDateString()});closeSale();};
window.openPay=(id)=>{curShopId=id;let s=shops.find(x=>x.id==id);document.getElementById('payTitle').innerText=s.name+' Paid';document.getElementById('payInfo').innerText='Balance Rs.'+s.balance;document.getElementById('payDate').valueAsDate=new Date();document.getElementById('payAmount').value='';document.getElementById('payModal').classList.remove('hidden');};window.closePay=()=>document.getElementById('payModal').classList.add('hidden');window.confirmPay=async()=>{let amt=parseFloat(document.getElementById('payAmount').value);if(!amt)return alert('Amount podu!');let s=shops.find(x=>x.id==curShopId);let d=document.getElementById('payDate').value;let dateObj=d?new Date(d):new Date();let newBal=s.balance-amt;await updateDoc(doc(db,'shops',s.id),{balance:newBal,totalPaid:(s.totalPaid||0)+amt});await addDoc(collection(db,'transactions'),{shopId:s.id,shopName:s.name,area:s.area,type:'payment',amount:amt,balance:newBal,date:dateObj.toISOString(),dateStr:dateObj.toLocaleDateString()});closePay();};
window.openReport=(id)=>{curShopId=id;let s=shops.find(x=>x.id==id);let list=tx.filter(t=>t.shopId==id);document.getElementById('repTitle').innerText=s.name+' - Bal Rs.'+s.balance;let html=`<div class="grid grid-cols-3 gap-2 mb-4"><div class="bg-green-50 border p-3 rounded-xl text-center"><div class="text-[9px]">SALE</div><b class="text-[12px]">Rs.${s.totalSale||0}</b></div><div class="bg-blue-50 border p-3 rounded-xl text-center"><div class="text-[9px]">PAID</div><b class="text-[12px]">Rs.${s.totalPaid||0}</b></div><div class="bg-yellow-100 border-2 border-black p-3 rounded-xl text-center"><div class="text-[9px]">BAL</div><b class="text-[12px]">Rs.${s.balance||0}</b></div></div>`;html+=list.map(t=>t.type=='sale'?`<div class="border-l-4 border-green-600 p-3 bg-gray-50 rounded-r-xl mb-2 text-xs">SALE Rs.${t.total} - ${t.dateStr}<br><span class="text-[10px] text-gray-500">${t.details||''}</span></div>`:`<div class="border-l-4 border-blue-500 p-3 bg-blue-50 rounded-r-xl mb-2 text-xs">PAID Rs.${t.amount} - ${t.dateStr}</div>`).join('')||'<div class="text-center text-gray-400 mt-10">No transactions</div>';document.getElementById('repContent').innerHTML=html;document.getElementById('reportModal').classList.remove('hidden');};window.closeReport=()=>document.getElementById('reportModal').classList.add('hidden');
