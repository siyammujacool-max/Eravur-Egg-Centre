<!DOCTYPE html><html lang="ta"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ERAVUR EGG V19.4</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#f0f4ec]">
<div id="loginScreen" class="fixed inset-0 bg-[#0a5c26] z-[100] flex items-center justify-center p-5"><div class="bg-white w-full max-w-sm rounded-[28px] p-8 text-center border-4 border-[#0a5c26]"><div class="w-24 h-24 mx-auto rounded-full border-4 border-[#0a5c26] bg-yellow-100 flex items-center justify-center text-5xl">🥚</div><h1 class="text-xl font-black text-[#0a5c26] mt-3">ERAVUR EGG CENTRE</h1><p class="text-[10px] bg-[#0a5c26] text-white px-3 py-1 rounded-full inline-block mt-1">V19.4 PAID PAGE</p><input id="loginUser" class="w-full border-2 border-black rounded-xl p-3 mt-5 font-bold" value="eravur"><input id="loginPin" type="password" class="w-full border-2 border-black rounded-xl p-3 mt-2 font-bold" value="1234"><button onclick="doLogin()" class="w-full bg-[#0a5c26] text-white py-3.5 rounded-xl mt-4 font-black border-2 border-black">Login</button></div></div>
<div id="appContent" class="hidden pb-[110px]"><div class="bg-[#0a5c26] text-white p-3 pb-4 sticky top-0 z-40"><div class="flex justify-between items-center"><div class="flex items-center gap-2"><div class="w-10 h-10 rounded-full border-2 border-white bg-yellow-100 flex items-center justify-center text-xl">🥚</div><div><div class="font-black text-[13px]">ERAVUR EGG</div><div class="text-[9px]" id="syncStatus">Loading...</div></div></div><div class="flex gap-1"><button onclick="openPriceSettings()" class="bg-yellow-400 text-black px-2 py-1.5 rounded-full text-[9px] font-black border-2 border-black">⚙️<br>விலை</button><button onclick="cleanDuplicates()" class="bg-red-500 text-white px-2 py-1.5 rounded-full text-[9px] font-black border-2 border-black">🧹<br>CLEAN</button><button onclick="doLogout()" class="bg-white/20 px-2 py-1.5 rounded-full text-[8px] border">Logout</button></div></div><div class="mt-3 flex gap-2"><input id="search" oninput="renderShops()" placeholder="🔍 தேடு..." class="flex-1 px-5 py-3 rounded-full text-black font-bold border-2 border-black"><button onclick="openAddShop()" class="bg-yellow-400 text-black px-5 py-3 rounded-full font-black border-2 border-black text-xs">+ கடை</button></div></div><div class="flex gap-2 p-3 overflow-x-auto"><button onclick="setArea('ALL')" id="tab-ALL" class="bg-[#0a5c26] text-white px-5 py-2 rounded-full text-xs font-bold border-2 border-black">ALL</button><button onclick="setArea('Oddamavadi')" id="tab-Oddamavadi" class="bg-white px-5 py-2 rounded-full text-xs font-bold border-2 border-black">Oddamavadi</button><button onclick="setArea('Chenkalady')" id="tab-Chenkalady" class="bg-white px-5 py-2 rounded-full text-xs font-bold border-2 border-black">Chenkalady</button><button onclick="setArea('Eravur')" id="tab-Eravur" class="bg-white px-5 py-2 rounded-full text-xs font-bold border-2 border-black">Eravur</button></div><div id="shopList" class="px-3 space-y-3"></div><div class="fixed bottom-0 left-0 right-0 bg-white border-t-2 border-black p-2.5 flex justify-between items-center"><div class="flex items-center gap-2"><div class="w-8 h-8 rounded-full border-2 border-black bg-yellow-100 flex items-center justify-center">🥚</div><div><div id="totBalance" class="font-black text-[#0a5c26] text-[11px]">Rs.0</div><div class="text-[8px]" id="totCount">0 kadai</div></div></div><div class="flex gap-2"><button onclick="openAllReport()" class="bg-[#0a5c26] text-white px-4 py-2 rounded-full text-[10px] font-bold border-2 border-black">📊 REPORTS</button><button onclick="exportExcel()" class="bg-yellow-100 px-3 py-2 rounded-full text-[10px] font-bold border-2 border-black">📥 Excel</button></div></div></div>

<div id="saleModal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-end justify-center p-2"><div class="bg-white w-full max-w-md rounded-t-[28px] p-5 max-h-[92vh] overflow-y-auto"><div class="flex justify-between"><h3 id="saleTitle" class="font-black"></h3><span id="saleOldBal" class="text-[11px] bg-yellow-100 px-3 py-1 rounded-full font-black border-2 border-black"></span></div><input id="saleDate" type="date" class="w-full border-2 border-black rounded-xl p-2.5 mt-3 font-bold"><div id="eggInputs" class="space-y-3 mt-4"></div><div class="mt-4 p-4 bg-[#0a5c26] text-white rounded-[16px] text-center border-2 border-black"><div class="font-black"><span id="saleToday">Rs.0</span> → <span id="saleGrand" class="text-yellow-300">Rs.0</span></div><div id="saleDetails" class="text-[10px] mt-2 opacity-80"></div></div><div class="flex gap-3 mt-4"><button onclick="closeSale()" class="flex-1 bg-gray-100 py-3.5 rounded-xl font-black border-2 border-black">Cancel</button><button onclick="confirmSale()" class="flex-1 bg-[#0a5c26] text-white py-3.5 rounded-xl font-black border-2 border-black">Save Sale</button></div></div></div>
<div id="payModal" class="hidden fixed inset-0 bg-white z-[60] overflow-y-auto"><div class="bg-[#0a5c26] text-white p-4 flex justify-between sticky top-0 z-10"><h3 id="payTitle" class="font-black text-sm"></h3><button onclick="closePay()" class="bg-white/20 px-4 py-1.5 rounded-full font-black">X</button></div><div class="p-4"><div id="paySummary" class="bg-yellow-50 border-2 border-black rounded-2xl p-4 mb-4 text-center"><div class="text-[10px] font-black">TOTAL BALANCE</div><div id="payTotalBal" class="text-2xl font-black text-[#0a5c26]">Rs.0</div></div><div class="grid grid-cols-2 gap-3 mb-4"><div id="cardOld" onclick="selectPay('old')" class="border-[3px] border-black rounded-2xl p-4 cursor-pointer bg-white"><div class="text-[10px] font-black bg-orange-500 text-white px-2 py-0.5 rounded-full inline-block">OLD BALANCE</div><div id="oldMainBal" class="font-black text-lg mt-2">Rs.0</div><div id="oldDetails" class="text-[10px] font-bold text-gray-600 mt-1"></div><div class="mt-3 bg-orange-100 p-2 rounded-xl text-center font-black text-xs">👆 Click to Pay Old</div></div><div id="cardSale" onclick="selectPay('sale')" class="border-[3px] border-black rounded-2xl p-4 cursor-pointer bg-white"><div class="text-[10px] font-black bg-blue-600 text-white px-2 py-0.5 rounded-full inline-block">SALES AMOUNT</div><div id="saleMainBal" class="font-black text-lg mt-2">Rs.0</div><div id="saleDetailsPay" class="text-[10px] font-bold text-gray-600 mt-1"></div><div class="mt-3 bg-blue-100 p-2 rounded-xl text-center font-black text-xs">👆 Click to Pay Sales</div></div></div><div id="payInputArea" class="hidden bg-white border-[3px] border-black rounded-2xl p-5"><div id="selectedLabel" class="font-black text-sm mb-3"></div><input id="payDate" type="date" class="w-full border-2 border-black rounded-xl p-2.5 mb-3 font-bold"><input id="payAmount" type="number" placeholder="Amount" class="w-full border-[3px] border-black rounded-xl p-4 font-black text-xl text-center"><div class="flex gap-2 mt-4"><button onclick="closePayInput()" class="flex-1 bg-gray-100 py-3.5 rounded-xl font-black border-2 border-black">Back</button><button id="finalPayBtn" onclick="confirmPay()" class="flex-1 text-white py-3.5 rounded-xl font-black border-2 border-black">Pay</button></div></div></div></div>
<div id="reportModal" class="hidden fixed inset-0 bg-white z-[70] overflow-y-auto"><div class="bg-[#0a5c26] text-white p-4 flex justify-between sticky top-0"><h3 id="repTitle" class="font-black text-sm"></h3><button onclick="closeReport()" class="bg-white/20 px-4 py-1.5 rounded-full font-black">X</button></div><div id="repContent" class="p-4"></div></div><div id="allReportModal" class="hidden fixed inset-0 bg-white z-[80] overflow-y-auto"><div class="bg-[#0a5c26] text-white p-4 flex justify-between sticky top-0"><h3 class="font-black text-sm">📊 All Report V19.4</h3><button onclick="closeAllReport()" class="bg-white/20 px-4 py-1.5 rounded-full font-black">X</button></div><div id="allReportContent" class="p-4"></div></div>
<div id="addShopModal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-end justify-center"><div class="bg-white w-full max-w-md rounded-t-[28px] p-6"><h3 class="font-black mb-4">புது கடை</h3><input id="newName" placeholder="பெயர்" class="w-full border-2 border-black rounded-xl p-3 mb-2 font-bold"><select id="newArea" class="w-full border-2 border-black rounded-xl p-3 mb-2 font-bold"><option>Oddamavadi</option><option>Chenkalady</option><option>Eravur</option></select><input id="newPhone" placeholder="Phone" class="w-full border-2 border-black rounded-xl p-3 mb-2 font-bold"><input id="newOld" type="number" placeholder="Old Balance" class="w-full border-2 border-black rounded-xl p-3 mb-4 font-bold" value="0"><div class="flex gap-3"><button onclick="closeAddShop()" class="flex-1 bg-gray-100 py-3.5 rounded-xl font-black border-2 border-black">Cancel</button><button onclick="saveNewShop()" class="flex-1 bg-[#0a5c26] text-white py-3.5 rounded-xl font-black border-2 border-black">Save</button></div></div></div>
<div id="editShopModal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-end justify-center p-2"><div class="bg-white w-full max-w-md rounded-t-[28px] p-6"><h3 class="font-black">Edit கடை ✏️</h3><p id="editLabel" class="text-[11px] text-gray-500 mb-3 font-bold"></p><input id="editName" class="w-full border-2 border-black rounded-xl p-3 mb-2 font-bold"><select id="editArea" class="w-full border-2 border-black rounded-xl p-3 mb-2 font-bold"><option>Oddamavadi</option><option>Chenkalady</option><option>Eravur</option></select><input id="editPhone" class="w-full border-2 border-black rounded-xl p-3 mb-2 font-bold"><div class="grid grid-cols-2 gap-2 mb-2"><div><label class="text-[10px] font-black">Old Balance</label><input id="editOldBal" type="number" class="w-full border-2 border-black rounded-xl p-2.5 font-bold"></div><div><label class="text-[10px] font-black">Old Paid</label><input id="editOldPaid" type="number" class="w-full border-2 border-black rounded-xl p-2.5 font-bold"></div></div><div class="flex gap-3"><button onclick="closeEditShop()" class="flex-1 bg-gray-100 py-3.5 rounded-xl font-black border-2 border-black">Cancel</button><button onclick="saveEditShop()" class="flex-1 bg-[#0a5c26] text-white py-3.5 rounded-xl font-black border-2 border-black">Update</button></div><button onclick="deleteShop()" class="w-full mt-3 bg-red-50 text-red-600 py-2.5 rounded-xl font-black border-2 border-black text-[11px]">🗑️ Delete</button></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, doc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyA-OQKxJeDhALnecWc2Jyv_mNxr3W6NFA8", authDomain: "eravur-egg.firebaseapp.com", projectId: "eravur-egg", storageBucket: "eravur-egg.firebasestorage.app", messagingSenderId: "721546852813", appId: "1:721546852813:web:91efbc2c7d5f36f4332c84" };
const app=initializeApp(firebaseConfig);const db=getFirestore(app);let shops=[];let tx=[];let rates={240:24,260:26,280:28,300:30};let curArea='ALL';let curShopId=null;let payMode='old';const sizes=[240,260,280,300];
window.doLogin=()=>{let u=document.getElementById('loginUser').value.trim();let p=document.getElementById('loginPin').value.trim();if(u==='eravur'&&p==='1234'){localStorage.setItem('egg_logged','yes');document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appContent').classList.remove('hidden');load();}else alert('Wrong!');};window.doLogout=()=>{localStorage.removeItem('egg_logged');location.reload();};
if(localStorage.getItem('egg_logged')==='yes'){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appContent').classList.remove('hidden');load();}
function load(){onSnapshot(collection(db,'shops'),(snap)=>{shops=[];snap.forEach(d=>shops.push({id:d.id,...d.data()}));document.getElementById('syncStatus').innerText=`${shops.length} kadai V19.4`;renderShops();});onSnapshot(query(collection(db,'transactions'),orderBy('date','desc')),(snap)=>{tx=[];snap.forEach(d=>tx.push({id:d.id,...d.data()}));});onSnapshot(doc(db,'settings','rates'),(s)=>{if(s.exists())rates=s.data();});}
window.setArea=(a)=>{curArea=a;document.querySelectorAll('[id^=tab-]').forEach(b=>{b.className='bg-white px-5 py-2 rounded-full text-xs font-bold border-2 border-black';});document.getElementById('tab-'+a).className='bg-[#0a5c26] text-white px-5 py-2 rounded-full text-xs font-bold border-2 border-black';renderShops();};
window.renderShops=()=>{let q=document.getElementById('search').value.toLowerCase();let f=shops.filter(s=>(curArea=='ALL'||s.area==curArea)&&s.name.toLowerCase().includes(q));f.sort((a,b)=>(b.balance||0)-(a.balance||0));let h='';f.forEach(s=>{let oldRem=(s.oldBalance||0)-(s.oldPaid||0);h+=`<div class="bg-white rounded-[18px] p-4 border-2 border-black border-l-[6px] border-l-[#0a5c26]"><div class="flex justify-between"><div class="flex-1" onclick="openReport('${s.id}')"><div class="font-black text-[14px]">${s.name} <span class="text-[9px] bg-gray-100 px-2 py-0.5 rounded-full border-2 border-black">${s.area}</span></div><div class="text-[11px] font-bold text-gray-600 mt-1">Bal Rs.${(s.balance||0).toLocaleString()} | Old Rem Rs.${oldRem.toLocaleString()}</div></div><button onclick="openEditShop('${s.id}')" class="w-9 h-9 rounded-full border-2 border-black bg-yellow-100 flex items-center justify-center">✏️</button></div><div class="grid grid-cols-3 gap-2 mt-3"><button onclick="openSale('${s.id}')" class="bg-[#0a5c26] text-white py-2.5 rounded-[12px] text-[11px] font-black border-2 border-black">🥚 Sale</button><button onclick="openPay('${s.id}')" class="bg-blue-600 text-white py-2.5 rounded-[12px] text-[11px] font-black border-2 border-black">💰 Paid</button><button onclick="openReport('${s.id}')" class="bg-gray-100 py-2.5 rounded-[12px] text-[11px] font-black border-2 border-black">📊 Report</button></div></div>`;});document.getElementById('shopList').innerHTML=h||'<div class="text-center mt-20 text-gray-400 font-bold">No kadai</div>';let tot=shops.reduce((a,b)=>a+(b.balance||0),0);document.getElementById('totBalance').innerText='Rs.'+tot.toLocaleString();document.getElementById('totCount').innerText=shops.length+' kadai';};
window.openAddShop=()=>document.getElementById('addShopModal').classList.remove('hidden');window.closeAddShop=()=>document.getElementById('addShopModal').classList.add('hidden');window.saveNewShop=async()=>{let n=document.getElementById('newName').value.trim();if(!n)return alert('Name podu!');let ar=document.getElementById('newArea').value;let p=document.getElementById('newPhone').value;let o=parseFloat(document.getElementById('newOld').value)||0;await addDoc(collection(db,'shops'),{name:n,area:ar,phone:p,oldBalance:o,oldPaid:0,totalSale:0,totalPaid:0,balance:o});closeAddShop();document.getElementById('newName').value='';};
window.openEditShop=(id)=>{curShopId=id;let s=shops.find(x=>x.id==id);document.getElementById('editLabel').innerText=s.name;document.getElementById('editName').value=s.name;document.getElementById('editArea').value=s.area;document.getElementById('editPhone').value=s.phone||'';document.getElementById('editOldBal').value=s.oldBalance||0;document.getElementById('editOldPaid').value=s.oldPaid||0;document.getElementById('editShopModal').classList.remove('hidden');};window.closeEditShop=()=>document.getElementById('editShopModal').classList.add('hidden');window.saveEditShop=async()=>{let s=shops.find(x=>x.id==curShopId);let n=document.getElementById('editName').value.trim();let ar=document.getElementById('editArea').value;let ph=document.getElementById('editPhone').value.trim();let ob=parseFloat(document.getElementById('editOldBal').value)||0;let op=parseFloat(document.getElementById('editOldPaid').value)||0;let diff=(ob-op)-((s.oldBalance||0)-(s.oldPaid||0));await updateDoc(doc(db,'shops',s.id),{name:n,area:ar,phone:ph,oldBalance:ob,oldPaid:op,balance:(s.balance||0)+diff});closeEditShop();};window.deleteShop=async()=>{if(!confirm('Delete?'))return;let s=shops.find(x=>x.id==curShopId);await deleteDoc(doc(db,'shops',s.id));closeEditShop();};
window.cleanDuplicates=async()=>{let map={};let del=[];let sorted=[...shops].sort((a,b)=>(b.balance||0)-(a.balance||0));sorted.forEach(s=>{let k=s.name.trim().toLowerCase()+'|'+s.area.trim().toLowerCase();if(!map[k])map[k]=s;else del.push(s);});if(del.length===0)return alert('No dup!');if(!confirm(del.length+' delete?'))return;for(let d of del)await deleteDoc(doc(db,'shops',d.id));};
window.openPriceSettings=()=>{let h='';sizes.forEach(sz=>{h+=`<div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl border-2 border-black"><span class="font-black">W${sz}</span><input id="rate${sz}" type="number" value="${rates[sz]}" class="w-20 border-2 border-black rounded-xl p-2 text-center font-black"></div>`;});document.getElementById('priceInputs').innerHTML=h;document.getElementById('priceModal').classList.remove('hidden');};window.closePriceSettings=()=>document.getElementById('priceModal').classList.add('hidden');window.savePriceSettings=async()=>{let nr={};sizes.forEach(sz=>{nr[sz]=parseFloat(document.getElementById('rate'+sz).value)||0;});await setDoc(doc(db,'settings','rates'),nr);closePriceSettings();};
window.openSale=(id)=>{curShopId=id;let s=shops.find(x=>x.id==id);document.getElementById('saleTitle').innerText=s.name;document.getElementById('saleOldBal').innerText='Bal Rs.'+s.balance;document.getElementById('saleDate').valueAsDate=new Date();let h='';sizes.forEach(sz=>{h+=`<div class="flex gap-2 items-center"><div class="w-12 font-black text-xs">W${sz}</div><div class="flex-1 flex border-2 border-black rounded-xl overflow-hidden"><button onclick="chgSale(${sz},-1)" class="px-4 py-2.5 bg-green-50 font-black border-r-2 border-black">-</button><input id="qs${sz}" type="number" value="0" oninput="calcSale()" class="flex-1 text-center font-black"><button onclick="chgSale(${sz},1)" class="px-4 py-2.5 bg-green-50 font-black border-l-2 border-black">+</button></div><input id="rs${sz}" type="number" value="${rates[sz]}" oninput="calcSale()" class="w-16 border-2 border-black rounded-xl p-2 text-center font-black text-sm"></div>`;});document.getElementById('eggInputs').innerHTML=h;calcSale();document.getElementById('saleModal').classList.remove('hidden');};window.chgSale=(sz,d)=>{let el=document.getElementById('qs'+sz);let v=parseInt(el.value)||0;v=Math.max(0,v+d);el.value=v;calcSale();};window.calcSale=()=>{let s=shops.find(x=>x.id==curShopId);if(!s)return{today:0,grand:0};let today=0,eggs=0,det=[];sizes.forEach(sz=>{let q=parseInt(document.getElementById('qs'+sz)?.value)||0;let r=parseFloat(document.getElementById('rs'+sz)?.value)||0;let e=sz*q;today+=e*r;eggs+=e;if(q>0)det.push(`W${sz}x${q}=${e}@${r}`);});document.getElementById('saleToday').innerText='Rs.'+today.toLocaleString();document.getElementById('saleGrand').innerText='Rs.'+(today+(s.balance||0)).toLocaleString();document.getElementById('saleDetails').innerText=det.join(' | ')||'No eggs';return{today,grand:today+(s.balance||0),eggs,det};};window.closeSale=()=>document.getElementById('saleModal').classList.add('hidden');window.confirmSale=async()=>{let c=calcSale();if(c.today==0)return alert('Qty podu!');let s=shops.find(x=>x.id==curShopId);let d=document.getElementById('saleDate').value;let dateObj=d?new Date(d):new Date();await updateDoc(doc(db,'shops',s.id),{balance:c.grand,totalSale:(s.totalSale||0)+c.today});await addDoc(collection(db,'transactions'),{shopId:s.id,shopName:s.name,area:s.area,type:'sale',total:c.today,balance:c.grand,eggs:c.eggs,details:c.det.join(', '),date:dateObj.toISOString(),dateStr:dateObj.toLocaleDateString()});closeSale();};

// NEW PAID PAGE LOGIC
window.openPay=(id)=>{curShopId=id;let s=shops.find(x=>x.id==id);document.getElementById('payTitle').innerText=s.name+' - Paid';document.getElementById('payTotalBal').innerText='Rs.'+(s.balance||0).toLocaleString();let oldRem=(s.oldBalance||0)-(s.oldPaid||0);let salePaid=(s.totalPaid||0)-(s.oldPaid||0);let saleRem=(s.totalSale||0)-salePaid;document.getElementById('oldMainBal').innerText='Rs.'+oldRem.toLocaleString();document.getElementById('oldDetails').innerText=`Total Old: Rs.${s.oldBalance||0} | Paid: Rs.${s.oldPaid||0}`;document.getElementById('saleMainBal').innerText='Rs.'+saleRem.toLocaleString();document.getElementById('saleDetailsPay').innerText=`Total Sale: Rs.${s.totalSale||0} | Paid: Rs.${salePaid}`;document.getElementById('payInputArea').classList.add('hidden');document.getElementById('cardOld').className='border-[3px] border-black rounded-2xl p-4 cursor-pointer bg-white';document.getElementById('cardSale').className='border-[3px] border-black rounded-2xl p-4 cursor-pointer bg-white';document.getElementById('payModal').classList.remove('hidden');};
window.selectPay=(mode)=>{payMode=mode;let s=shops.find(x=>x.id==curShopId);if(mode==='old'){document.getElementById('cardOld').className='border-[4px] border-orange-500 rounded-2xl p-4 cursor-pointer bg-orange-50';document.getElementById('cardSale').className='border-[3px] border-black rounded-2xl p-4 cursor-pointer bg-white opacity-50';document.getElementById('selectedLabel').innerText='💰 Old Balance Pay - Rs.'+((s.oldBalance||0)-(s.oldPaid||0));document.getElementById('finalPayBtn').innerText='Pay Old Balance';document.getElementById('finalPayBtn').className='flex-1 bg-orange-500 text-white py-3.5 rounded-xl font-black border-2 border-black';}else{document.getElementById('cardSale').className='border-[4px] border-blue-600 rounded-2xl p-4 cursor-pointer bg-blue-50';document.getElementById('cardOld').className='border-[3px] border-black rounded-2xl p-4 cursor-pointer bg-white opacity-50';document.getElementById('selectedLabel').innerText='💵 Sales Amount Pay - Rs.'+((s.totalSale||0)-((s.totalPaid||0)-(s.oldPaid||0)));document.getElementById('finalPayBtn').innerText='Pay Sales Amount';document.getElementById('finalPayBtn').className='flex-1 bg-blue-600 text-white py-3.5 rounded-xl font-black border-2 border-black';}document.getElementById('payDate').valueAsDate=new Date();document.getElementById('payAmount').value='';document.getElementById('payInputArea').classList.remove('hidden');document.getElementById('payInputArea').scrollIntoView({behavior:'smooth'});};
window.closePayInput=()=>{document.getElementById('payInputArea').classList.add('hidden');document.getElementById('cardOld').className='border-[3px] border-black rounded-2xl p-4 cursor-pointer bg-white';document.getElementById('cardSale').className='border-[3px] border-black rounded-2xl p-4 cursor-pointer bg-white';};
window.closePay=()=>document.getElementById('payModal').classList.add('hidden');
window.confirmPay=async()=>{let amt=parseFloat(document.getElementById('payAmount').value);if(!amt)return alert('Amount podu!');let s=shops.find(x=>x.id==curShopId);let d=document.getElementById('payDate').value;let dateObj=d?new Date(d):new Date();let newBal=(s.balance||0)-amt;let newTotalPaid=(s.totalPaid||0)+amt;let newOldPaid=s.oldPaid||0;let type='payment';if(payMode==='old'){let oldRem=(s.oldBalance||0)-(s.oldPaid||0);if(amt>oldRem){if(!confirm('Old Remain '+oldRem+' thaan! Extra sales ku pogum OK va?'))return;newOldPaid=s.oldBalance||0;}else newOldPaid+=amt;type='old_payment';}else{type='sale_payment';}await updateDoc(doc(db,'shops',s.id),{balance:newBal,totalPaid:newTotalPaid,oldPaid:newOldPaid});await addDoc(collection(db,'transactions'),{shopId:s.id,shopName:s.name,area:s.area,type:type,amount:amt,balance:newBal,date:dateObj.toISOString(),dateStr:dateObj.toLocaleDateString(),payMode:payMode});closePay();};

window.openReport=(id)=>{curShopId=id;let s=shops.find(x=>x.id==id);let list=tx.filter(t=>t.shopId==id);document.getElementById('repTitle').innerText=s.name+' - Rs.'+s.balance;let html=`<div class="grid grid-cols-3 gap-2 mb-4"><div class="bg-green-50 border-2 border-black p-3 rounded-xl text-center"><div class="text-[9px] font-black">SALE</div><b>Rs.${s.totalSale||0}</b></div><div class="bg-blue-50 border-2 border-black p-3 rounded-xl text-center"><div class="text-[9px] font-black">PAID</div><b>Rs.${s.totalPaid||0}</b></div><div class="bg-yellow-100 border-2 border-black p-3 rounded-xl text-center"><div class="text-[9px] font-black">BAL</div><b>Rs.${s.balance||0}</b></div></div><div class="bg-gray-50 p-3 rounded-xl border-2 border-black mb-3 text-[11px]">Old: ${s.oldBalance||0} | Old Paid: ${s.oldPaid||0} | Rem: ${(s.oldBalance||0)-(s.oldPaid||0)}</div>`;html+=list.map(t=>{if(t.type=='sale')return `<div class="border-l-4 border-green-600 p-3 bg-gray-50 rounded-r-xl mb-2 text-xs border-2"><b>SALE Rs.${t.total}</b> - ${t.dateStr}<br>${t.details||''}</div>`;else if(t.type=='old_payment')return `<div class="border-l-4 border-orange-500 p-3 bg-orange-50 rounded-r-xl mb-2 text-xs border-2"><b>💰 OLD PAID Rs.${t.amount}</b> - ${t.dateStr}</div>`;else if(t.type=='sale_payment')return `<div class="border-l-4 border-blue-500 p-3 bg-blue-50 rounded-r-xl mb-2 text-xs border-2"><b>💵 SALE PAID Rs.${t.amount}</b> - ${t.dateStr}</div>`;else return `<div class="border-l-4 border-gray-500 p-3 bg-gray-50 rounded-r-xl mb-2 text-xs border-2"><b>PAID Rs.${t.amount}</b> - ${t.dateStr}</div>`;}).join('')||'No data';document.getElementById('repContent').innerHTML=html;document.getElementById('reportModal').classList.remove('hidden');};window.closeReport=()=>document.getElementById('reportModal').classList.add('hidden');
window.openAllReport=()=>{let tot=shops.reduce((a,b)=>a+(b.balance||0),0);document.getElementById('allReportContent').innerHTML=`<div class="bg-[#0a5c26] text-white p-5 rounded-[20px] mb-4 text-center border-2 border-black"><div class="text-3xl font-black">Rs.${tot.toLocaleString()}</div><div>${shops.length} kadai</div></div>`+shops.sort((a,b)=>b.balance-a.balance).map(s=>`<div class="flex justify-between p-3 bg-white rounded-xl border-2 border-black text-xs"><span>${s.name}</span><b>Rs.${s.balance}</b></div>`).join('');document.getElementById('allReportModal').classList.remove('hidden');};window.closeAllReport=()=>document.getElementById('allReportModal').classList.add('hidden');
window.exportExcel=()=>{let csv="Shop,Balance,OldRemain\n"+shops.map(s=>`"${s.name}",${s.balance},${(s.oldBalance||0)-(s.oldPaid||0)}`).join("\n");let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Eravur_V19.4.csv';a.click();};
</script></body></html>
