<!DOCTYPE html><html lang="ta"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ERAVUR EGG SALE CALC FIX</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#f4f7f2]">
<div id="loginScreen" class="fixed inset-0 bg-[#0a5c26] z-[100] flex items-center justify-center p-5"><div class="bg-white w-full max-w-sm rounded-[24px] p-6 text-center"><div class="text-5xl">🥚</div><h1 class="font-bold">SALE CALC FIX</h1><p class="text-[10px] mb-3">Per Customer Sheet + Full Calculation</p><input id="lu" class="w-full border-2 rounded-xl p-3 mb-2" value="eravur"><input id="lp" type="password" class="w-full border-2 rounded-xl p-3 mb-3" value="1234"><button onclick="doLogin()" class="w-full bg-[#0a5c26] text-white py-3 rounded-xl font-bold">Login</button></div></div>
<div id="app" class="hidden pb-[100px]"><div class="bg-[#0a5c26] text-white p-4 sticky top-0 z-50"><div class="flex justify-between"><h1 class="font-bold text-[11px]">🥚 SALE CALC FIXED - Per Customer Sheet</h1><button onclick="logout()" class="bg-white/20 px-3 py-1 rounded-full text-xs">Logout</button></div><input id="search" oninput="render()" placeholder="தேடு..." class="w-full mt-3 px-4 py-2.5 rounded-full text-black text-sm outline-none"></div>
<div class="flex gap-2 p-3 overflow-x-auto flex-wrap"><button onclick="setA('ALL')" id="t-ALL" class="bg-[#0a5c26] text-white px-4 py-2 rounded-full text-xs font-bold">ALL</button><button onclick="setA('Oddamavadi')" id="t-Oddamavadi" class="bg-white border px-4 py-2 rounded-full text-xs font-bold">Oddamavadi</button><button onclick="setA('Chenkalady')" id="t-Chenkalady" class="bg-white border px-4 py-2 rounded-full text-xs font-bold">Chenkalady</button><button onclick="setA('Eravur')" id="t-Eravur" class="bg-white border px-4 py-2 rounded-full text-xs font-bold">Eravur</button><button onclick="openAdd()" class="bg-yellow-400 text-black px-4 py-2 rounded-full text-xs font-bold">+ New</button><button onclick="openBulk()" class="bg-red-600 text-white px-4 py-2 rounded-full text-xs font-bold">📥 BULK</button><button onclick="openAllReports()" class="bg-blue-600 text-white px-4 py-2 rounded-full text-xs font-bold">📊 All Reports</button></div>
<div id="list" class="px-3 space-y-3"></div>
<div class="fixed bottom-0 left-0 right-0 bg-white border-t p-2 flex justify-around text-center"><div><div class="text-[8px]">OLD மீதி</div><div id="totOld" class="font-bold text-orange-600 text-xs">Rs.0</div></div><div><div class="text-[8px]">SALE மீதி</div><div id="totSale" class="font-bold text-green-600 text-xs">Rs.0</div></div><div><div class="text-[8px]">மொத்தம்</div><div id="tot" class="font-bold text-red-600 text-sm">Rs.0</div></div><button onclick="downloadAllExcel()" class="bg-green-600 text-white px-3 py-2 rounded-full text-xs font-bold">Excel</button></div></div>

<div id="bulkM" class="hidden fixed inset-0 bg-white z-[90] overflow-y-auto"><div class="bg-red-600 text-white p-4 flex justify-between sticky top-0"><h3 class="font-bold text-sm">📥 BULK IMPORT</h3><button onclick="document.getElementById('bulkM').classList.add('hidden')" class="bg-white/20 px-3 py-1 rounded-full">X</button></div><div class="p-4"><textarea id="bulkText" class="w-full h-[250px] border-2 rounded-xl p-3 text-sm" placeholder="பெயர், Area, Balance"></textarea><button onclick="doBulkImport()" class="w-full mt-3 bg-red-600 text-white py-3 rounded-xl font-bold">IMPORT</button></div></div>
<div id="editM" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-end justify-center"><div class="bg-white w-full rounded-t-[24px] p-5"><input id="eName" class="w-full border-2 rounded-xl p-3 mb-2 text-sm"><select id="eArea" class="w-full border-2 rounded-xl p-3 mb-2 text-sm"><option>Oddamavadi</option><option>Chenkalady</option><option>Eravur</option></select><input id="ePhone" class="w-full border-2 rounded-xl p-3 mb-2 text-sm"><input id="eOld" type="number" class="w-full border-2 rounded-xl p-3 mb-3 font-bold"><div class="flex gap-2"><button onclick="document.getElementById('editM').classList.add('hidden')" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="saveEdit()" class="flex-1 bg-[#0a5c26] text-white py-3 rounded-xl font-bold">Save</button></div></div></div>
<div id="addM" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-center justify-center p-4"><div class="bg-white w-full max-w-sm rounded-[24px] p-5"><input id="aName" placeholder="பெயர்" class="w-full border-2 rounded-xl p-3 mb-2 text-sm"><select id="aArea" class="w-full border-2 rounded-xl p-3 mb-2 text-sm"><option>Oddamavadi</option><option>Chenkalady</option><option selected>Eravur</option></select><input id="aPhone" placeholder="Phone" class="w-full border-2 rounded-xl p-3 mb-2 text-sm"><input id="aOld" type="number" placeholder="Old Balance" class="w-full border-2 rounded-xl p-3 mb-3 text-sm"><div class="flex gap-2"><button onclick="document.getElementById('addM').classList.add('hidden')" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="doAdd()" class="flex-1 bg-yellow-400 py-3 rounded-xl font-bold">Add</button></div></div></div>

<div id="saleM" class="hidden fixed inset-0 bg-black/50 z-[60] flex items-end justify-center"><div class="bg-white w-full rounded-t-[24px] p-5 max-h-[92vh] overflow-y-auto"><div class="flex justify-between mb-2"><h3 id="sTitle" class="font-bold text-sm"></h3><span class="text-[10px] bg-green-100 px-2 py-1 rounded-full">Fix: Size x Qty x Rate = Amount</span></div><label class="text-xs font-bold">📅 Sale Date</label><input id="sDate" type="date" class="w-full border-2 border-blue-300 bg-blue-50 rounded-xl p-3 mb-3 text-sm font-bold"><div id="sInputs" class="space-y-3"></div><div class="mt-4 p-3 bg-green-50 border-2 border-green-400 rounded-xl"><div class="text-xs font-bold mb-2">🧮 LIVE CALCULATION:</div><div id="sLiveCalc" class="text-[11px] space-y-1 font-mono"></div><div class="border-t-2 border-dashed mt-2 pt-2 text-center"><div class="text-xs">Sale Total: <b id="sToday" class="text-lg text-green-700">0</b></div><div class="text-[10px]">Sale மீதி ஆகும்: <b id="sGrand">0</b></div></div></div><div class="flex gap-2 mt-3"><button onclick="document.getElementById('saleM').classList.add('hidden')" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="doSale()" class="flex-1 bg-[#0a5c26] text-white py-3 rounded-xl font-bold">Sale Add</button></div></div></div>

<div id="payM" class="hidden fixed inset-0 bg-black/50 z-[70] flex items-center justify-center p-4"><div class="bg-white w-full max-w-sm rounded-[24px] p-5"><h3 id="pTitle" class="font-bold mb-2"></h3><label class="text-xs font-bold">📅 Paid Date</label><input id="pDate" type="date" class="w-full border-2 rounded-xl p-2 mb-2 text-sm"><div id="pCalc" class="bg-gray-50 p-3 rounded-xl text-xs mb-3"></div><div class="grid grid-cols-2 gap-2 mb-3"><button id="payOldBtn" onclick="setPayType('old')" class="border-2 py-3 rounded-xl font-bold text-xs">📦 OLD க்கு</button><button id="paySaleBtn" onclick="setPayType('sale')" class="border-2 py-3 rounded-xl font-bold text-xs">🥚 SALE க்கு</button></div><input id="pAmt" type="number" class="w-full border-2 rounded-xl p-3 mb-3 font-bold text-lg" placeholder="Amount"><div id="pPreview" class="text-xs bg-blue-50 p-2 rounded-xl mb-3 hidden"></div><div class="flex gap-2"><button onclick="document.getElementById('payM').classList.add('hidden')" class="flex-1 bg-gray-100 py-3 rounded-xl">Cancel</button><button onclick="doPay()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold">Paid கழி</button></div></div></div>

<div id="repM" class="hidden fixed inset-0 bg-white z-[70] overflow-y-auto"><div class="bg-[#0a5c26] text-white p-4 flex justify-between sticky top-0"><div><h3 id="rTitle" class="font-bold text-[11px]"></h3><div id="rPhone" class="text-[10px] opacity-80"></div></div><div class="flex gap-2"><button onclick="downloadCustomerExcel()" class="bg-yellow-400 text-black px-3 py-1 rounded-full text-xs font-bold">Excel</button><button id="waBtn" class="bg-green-500 px-3 py-1 rounded-full text-xs font-bold">WA</button><button onclick="document.getElementById('repM').classList.add('hidden')" class="bg-white/20 px-3 py-1 rounded-full">X</button></div></div><div id="rContent" class="p-4"></div></div>
<div id="allRepM" class="hidden fixed inset-0 bg-white z-[80] overflow-y-auto"><div class="bg-[#0a5c26] text-white p-4 flex justify-between sticky top-0"><h3 class="font-bold text-sm">📊 ALL REPORTS</h3><button onclick="document.getElementById('allRepM').classList.add('hidden')" class="bg-white/20 px-3 py-1 rounded-full">X</button></div><div class="p-3"><div id="allRepContent"></div></div></div>
<script>
const USER="eravur", PIN="1234";
let shops=JSON.parse(localStorage.getItem('egg_MASTER')||'[]');
if(shops.length==0) shops=JSON.parse(localStorage.getItem('egg_recovered')||'[]');
if(shops.length==0) shops=[{id:1,name:"மௌலூதீன்",area:"Eravur",phone:"",oldBalance:105140,oldPaid:0,totalSale:88120,salePaid:0}];
let tx=JSON.parse(localStorage.getItem('egg_tx_MASTER')||'[]');
if(tx.length==0) tx=JSON.parse(localStorage.getItem('egg_tx_recovered')||'[]');
if(tx.length==0) tx=[{id:1,shopId:1,shopName:"மௌலூதீன்",area:"Eravur",type:'sale',total:55640,for:'sale',dateStr:'30/09/2026',dateISO:'2026-09-30',details:'W240x6,W280x1',calcDetails:['W240: 240 x 6 x 33 = 47520','W280: 280 x 1 x 29 = 8120']},{id:2,shopId:1,shopName:"மௌலூதீன்",area:"Eravur",type:'sale',total:32480,for:'sale',dateStr:'29/09/2026',dateISO:'2026-09-29',details:'W240x2,W260x2',calcDetails:['W240: 240 x 2 x 33 = 15840','W260: 260 x 2 x 32 = 16640']}];
function saveMaster(){ localStorage.setItem('egg_MASTER',JSON.stringify(shops)); localStorage.setItem('egg_tx_MASTER',JSON.stringify(tx)); localStorage.setItem('egg_recovered',JSON.stringify(shops)); localStorage.setItem('egg_tx_recovered',JSON.stringify(tx)); }
function openBulk(){document.getElementById('bulkM').classList.remove('hidden');}
function doBulkImport(){let text=document.getElementById('bulkText').value.trim(); if(!text) return alert('Type'); let lines=text.split('\n'); let added=0; lines.forEach(line=>{line=line.trim(); if(!line) return; let parts=line.split(',').map(s=>s.trim()); let name=parts[0]; let area=parts[1]||'Oddamavadi'; let oldBal=parseFloat(parts[2])||0; let phone=parts[3]||''; if(!shops.some(s=>s.name.toLowerCase()==name.toLowerCase())){shops.push({id:Date.now()+added+Math.random(),name,area,phone,oldBalance:oldBal,oldPaid:0,totalSale:0,salePaid:0}); added++;}}); saveMaster(); render(); document.getElementById('bulkM').classList.add('hidden'); alert(added+' Added');}
let curA='ALL',curId=null,saleSt={},payType='sale',rates={240:33,260:33,280:28,300:30},sizes=[240,260,280,300];
function doLogin(){if(document.getElementById('lu').value==USER&&document.getElementById('lp').value==PIN){localStorage.setItem('egg_logged','yes');document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render();}else alert('eravur / 1234');}
function logout(){localStorage.removeItem('egg_logged');location.reload();}
if(localStorage.getItem('egg_logged')=='yes'){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').classList.remove('hidden');}
function setA(a){curA=a; render();}
function getRem(s){let oldRem=(s.oldBalance||0)-(s.oldPaid||0); let saleRem=(s.totalSale||0)-(s.salePaid||0); return {oldRem,saleRem,total:oldRem+saleRem};}
function render(){let q=document.getElementById('search').value.toLowerCase(); let f=shops.filter(s=>(curA=='ALL'||s.area==curA)&&s.name.toLowerCase().includes(q)); document.getElementById('t-ALL').innerText=`ALL (${shops.length})`; document.getElementById('t-Oddamavadi').innerText=`Oddamavadi (${shops.filter(s=>s.area=='Oddamavadi').length})`; document.getElementById('t-Chenkalady').innerText=`Chenkalady (${shops.filter(s=>s.area=='Chenkalady').length})`; document.getElementById('t-Eravur').innerText=`Eravur (${shops.filter(s=>s.area=='Eravur').length})`; let h=''; f.forEach(s=>{let r=getRem(s); h+=`<div class="bg-white rounded-[16px] p-4 border-l-[5px] ${s.area=='Oddamavadi'?'border-blue-600':s.area=='Chenkalady'?'border-purple-600':'border-[#0a5c26]'} shadow"><div onclick="openRep(${s.id})" class="flex justify-between"><div class="flex-1"><div class="font-bold text-[14px]">${s.name} <span class="text-[9px] bg-green-100 px-2 py-0.5 rounded-full">${s.area}</span></div><div class="grid grid-cols-2 gap-2 mt-2 text-[11px]"><div class="bg-orange-50 border p-2 rounded-xl"><div class="text-[9px] font-bold text-orange-600">OLD தனி</div><div>மீதி Old: Rs.${r.oldRem}</div></div><div class="bg-green-50 border p-2 rounded-xl"><div class="text-[9px] font-bold text-green-600">SALE தனி</div><div>மீதி Sale: Rs.${r.saleRem}</div></div></div><div class="mt-2 text-[11px] font-bold text-red-600">மொத்தம் = Rs.${r.total}</div></div><button onclick="openEdit(${s.id})" class="h-8 w-8 bg-yellow-50 rounded-full ml-2">✏️</button></div><div class="grid grid-cols-4 gap-2 mt-3"><button onclick="openSale(${s.id})" class="bg-[#0a5c26] text-white py-2 rounded-xl text-[11px] font-bold">Sale +</button><button onclick="openPay(${s.id})" class="bg-blue-600 text-white py-2 rounded-xl text-[11px] font-bold">Paid -</button><button onclick="openRep(${s.id})" class="bg-gray-800 text-white py-2 rounded-xl text-[11px] font-bold">📊 Report</button><button onclick="sendWAReport(${s.id})" class="bg-green-500 text-white py-2 rounded-xl text-[11px]">WA</button></div></div>`;}); document.getElementById('list').innerHTML=h||'<div class="text-center p-6 bg-white rounded-xl">No shops</div>'; let totOld=shops.reduce((a,b)=>a+getRem(b).oldRem,0), totSale=shops.reduce((a,b)=>a+getRem(b).saleRem,0); document.getElementById('totOld').innerText='Rs.'+totOld; document.getElementById('totSale').innerText='Rs.'+totSale; document.getElementById('tot').innerText='Rs.'+(totOld+totSale); saveMaster();}
function openAdd(){document.getElementById('addM').classList.remove('hidden');}
function doAdd(){let n=document.getElementById('aName').value.trim(), a=document.getElementById('aArea').value, p=document.getElementById('aPhone').value.trim(), o=parseFloat(document.getElementById('aOld').value)||0; if(!n) return alert('பெயர்'); shops.unshift({id:Date.now(),name:n,area:a,phone:p,oldBalance:o,oldPaid:0,totalSale:0,salePaid:0}); saveMaster(); document.getElementById('addM').classList.add('hidden'); render();}
function openEdit(id){curId=id; let s=shops.find(x=>x.id==id); document.getElementById('eName').value=s.name; document.getElementById('eArea').value=s.area; document.getElementById('ePhone').value=s.phone; document.getElementById('eOld').value=s.oldBalance; document.getElementById('editM').classList.remove('hidden');}
function saveEdit(){let s=shops.find(x=>x.id==curId); s.name=document.getElementById('eName').value.trim(); s.area=document.getElementById('eArea').value; s.phone=document.getElementById('ePhone').value.trim(); s.oldBalance=parseFloat(document.getElementById('eOld').value)||0; saveMaster(); document.getElementById('editM').classList.add('hidden'); render();}

function openSale(id){
  curId=id; saleSt={}; sizes.forEach(sz=>saleSt[sz]={qty:0,rate:rates[sz]});
  document.getElementById('sTitle').innerText=shops.find(x=>x.id==id).name+' - Sale';
  document.getElementById('sDate').valueAsDate=new Date();
  let ht='';
  sizes.forEach(sz=>{
    ht+=`<div class="border-2 rounded-xl p-2 bg-gray-50"><div class="flex items-center gap-2"><div class="w-[55px] font-bold text-sm">W${sz}</div><div class="flex-1 flex border-2 rounded-xl overflow-hidden bg-white"><button onclick="chg(${sz},-1)" class="px-4 py-2 bg-green-50 font-bold text-lg">-</button><input id="q${sz}" type="number" value="0" oninput="saleSt[${sz}].qty=parseInt(this.value)||0;calc()" class="flex-1 text-center font-bold text-lg"><button onclick="chg(${sz},1)" class="px-4 py-2 bg-green-50 font-bold text-lg">+</button></div><div class="w-[70px]"><div class="text-[8px] text-center">Rate</div><input id="r${sz}" type="number" value="${rates[sz]}" oninput="saleSt[${sz}].rate=parseFloat(this.value)||0;calc()" class="w-full border-2 rounded-xl p-2 text-center font-bold text-sm bg-yellow-50"></div></div><div id="calc${sz}" class="text-[10px] font-mono mt-1 text-green-700 hidden"></div></div>`;
  });
  document.getElementById('sInputs').innerHTML=ht; calc(); document.getElementById('saleM').classList.remove('hidden');
}
function chg(sz,d){saleSt[sz].qty=Math.max(0,saleSt[sz].qty+d); document.getElementById('q'+sz).value=saleSt[sz].qty; calc();}
function calc(){
  let today=0, det=[], calcLines=[];
  sizes.forEach(sz=>{
    let qty=saleSt[sz].qty||0; let rate=saleSt[sz].rate||0;
    let amt = sz * qty * rate;
    let el=document.getElementById('calc'+sz);
    if(qty>0){
      today+=amt;
      det.push(`W${sz}x${qty}`);
      calcLines.push(`W${sz}: ${sz} x ${qty} x ${rate} = Rs.${amt}`);
      if(el){ el.innerText=`${sz} x ${qty} x ${rate} = Rs.${amt}`; el.classList.remove('hidden'); }
    } else {
      if(el) el.classList.add('hidden');
    }
  });
  document.getElementById('sLiveCalc').innerHTML=calcLines.length>0? calcLines.map(l=>`<div>• ${l}</div>`).join('') + `<div class="border-t mt-1 pt-1 font-bold">Total = Rs.${today}</div>` : '<div class="text-gray-400">Qty Add பண்ணுங்க, Calculation தானாக வரும்</div>';
  document.getElementById('sToday').innerText='Rs.'+today;
  let curRem=getRem(shops.find(x=>x.id==curId)).saleRem;
  document.getElementById('sGrand').innerText='Rs.'+(curRem+today);
  return {today,det,calcLines};
}
function doSale(){
  let c=calc(); if(c.today==0) return alert('Qty Add பண்ணுங்க!');
  let s=shops.find(x=>x.id==curId); let dateVal=document.getElementById('sDate').value; let dateStr=dateVal? new Date(dateVal).toLocaleDateString(): new Date().toLocaleDateString();
  s.totalSale+=c.today;
  tx.unshift({id:Date.now(),shopId:s.id,shopName:s.name,area:s.area,type:'sale',total:c.today,details:c.det.join(','),calcDetails:c.calcLines,dateStr:dateStr,dateISO:dateVal||new Date().toISOString().split('T')[0],for:'sale'});
  saveMaster(); document.getElementById('saleM').classList.add('hidden'); render();
  alert(`✅ Sale Added!\n${c.calcLines.join('\n')}\n\nTotal = Rs.${c.today}`);
}

function setPayType(t){payType=t; document.getElementById('payOldBtn').className=t=='old'?'border-2 border-orange-600 bg-orange-600 text-white py-3 rounded-xl font-bold text-xs':'border-2 bg-orange-50 py-3 rounded-xl font-bold text-xs'; document.getElementById('paySaleBtn').className=t=='sale'?'border-2 border-green-600 bg-green-600 text-white py-3 rounded-xl font-bold text-xs':'border-2 bg-green-50 py-3 rounded-xl font-bold text-xs'; updatePayPreview();}
function openPay(id){curId=id; payType='sale'; setPayType('sale'); document.getElementById('pDate').valueAsDate=new Date(); let s=shops.find(x=>x.id==id); let r=getRem(s); document.getElementById('pTitle').innerText=s.name; document.getElementById('pCalc').innerHTML=`<div class="grid grid-cols-2 gap-2 text-center"><div class="bg-orange-50 p-2 rounded-xl">OLD மீதி<b><br>Rs.${r.oldRem}</b></div><div class="bg-green-50 p-2 rounded-xl">SALE மீதி<b><br>Rs.${r.saleRem}</b></div></div>`; document.getElementById('pAmt').value=''; document.getElementById('pPreview').classList.add('hidden'); document.getElementById('payM').classList.remove('hidden'); document.getElementById('pAmt').oninput=updatePayPreview;}
function updatePayPreview(){let amt=parseFloat(document.getElementById('pAmt').value)||0; if(!amt){document.getElementById('pPreview').classList.add('hidden'); return;} let s=shops.find(x=>x.id==curId); let r=getRem(s); let nOld=r.oldRem, nSale=r.saleRem; if(payType=='old') nOld=r.oldRem-amt; else nSale=r.saleRem-amt; document.getElementById('pPreview').classList.remove('hidden'); document.getElementById('pPreview').innerHTML=`${payType} Rs.${amt} கழித்தால் Old:${nOld} Sale:${nSale} Total:${nOld+nSale}`;}
function doPay(){let amt=parseFloat(document.getElementById('pAmt').value); if(!amt) return alert('Amount'); let s=shops.find(x=>x.id==curId); let dateVal=document.getElementById('pDate').value; let dateStr=dateVal? new Date(dateVal).toLocaleDateString(): new Date().toLocaleDateString(); if(payType=='old') s.oldPaid+=amt; else s.salePaid+=amt; tx.unshift({id:Date.now(),shopId:s.id,shopName:s.name,area:s.area,type:'payment',amount:amt,for:payType,dateStr:dateStr,dateISO:dateVal||new Date().toISOString().split('T')[0]}); saveMaster(); document.getElementById('payM').classList.add('hidden'); render();}

function openRep(id){
  curId=id; let s=shops.find(x=>x.id==id); let r=getRem(s);
  let list=tx.filter(t=>t.shopId==id).sort((a,b)=> new Date(b.dateISO) - new Date(a.dateISO));
  document.getElementById('rTitle').innerText=`${s.name} (${s.area}) - REPORT SHEET`;
  document.getElementById('rPhone').innerText=`Old:${r.oldRem} Sale:${r.saleRem} Total:${r.total}`;
  let html=`<div class="grid grid-cols-2 gap-3 mb-4"><div class="bg-orange-50 border-2 p-3 rounded-2xl text-center"><div class="text-[10px] font-bold">OLD தனி</div><div class="font-bold text-orange-700 text-lg">Rs.${r.oldRem}</div><div class="text-[9px] font-mono">${s.oldBalance}-${s.oldPaid}=${r.oldRem}</div></div><div class="bg-green-50 border-2 p-3 rounded-2xl text-center"><div class="text-[10px] font-bold">SALE தனி</div><div class="font-bold text-green-700 text-lg">Rs.${r.saleRem}</div><div class="text-[9px] font-mono">${s.totalSale}-${s.salePaid}=${r.saleRem}</div></div></div><div class="bg-[#0a5c26] text-white p-3 rounded-xl text-center mb-4 font-bold text-lg">மொத்தம் = ${r.oldRem} + ${r.saleRem} = Rs.${r.total}</div><div class="border-2 rounded-xl overflow-hidden"><table class="w-full text-[11px]"><tr class="bg-gray-800 text-white"><th class="p-2 border text-[10px]">Date</th><th class="p-2 border text-[10px]">Type</th><th class="p-2 border text-[10px]">Amount</th><th class="p-2 border text-[10px]">Calculation</th><th class="p-2 border text-[10px]">Action</th></tr>${list.map(t=>{
    if(t.type=='sale'){
      let calcHtml = t.calcDetails? t.calcDetails.map(c=>`<div>• ${c}</div>`).join('') : `<div>${t.details}</div>`;
      return `<tr class="bg-green-50"><td class="p-2 border"><input type="date" value="${t.dateISO||''}" onchange="quickDateEdit(${t.id},this.value)" class="border rounded p-1 text-[9px] w-[110px]"><div class="text-[9px] mt-1">${t.dateStr}</div></td><td class="p-2 border font-bold text-green-700">SALE<br><span class="text-[8px] bg-green-200 px-1 rounded">${t.for}</span></td><td class="p-2 border font-bold text-green-700">Rs.${t.total}</td><td class="p-2 border font-mono text-[10px] leading-4">${calcHtml}</td><td class="p-2 border"><button onclick="delTx(${t.id})" class="bg-red-100 px-2 py-1 rounded text-[9px]">Del</button></td></tr>`;
    } else {
      return `<tr class="bg-blue-50"><td class="p-2 border">${t.dateStr}</td><td class="p-2 border font-bold text-blue-700">PAID<br><span class="text-[8px] bg-blue-200 px-1 rounded">${t.for}</span></td><td class="p-2 border font-bold text-blue-700">-Rs.${t.amount}</td><td class="p-2 border text-[10px]">${t.for.toUpperCase()} க்கு Paid</td><td class="p-2 border"><button onclick="delTx(${t.id})" class="bg-red-100 px-2 py-1 rounded text-[9px]">Del</button></td></tr>`;
    }
  }).join('')||'<tr><td colspan=5 class="p-4 text-center text-gray-400">No transactions</td></tr>'}</table></div><div class="mt-4 p-3 bg-yellow-50 border-2 border-yellow-300 rounded-xl text-[11px]"><b>📊 Grand Total Calculation:</b><br>OLD மீதி: ${s.oldBalance} - ${s.oldPaid} = ${r.oldRem}<br>SALE மீதி: ${s.totalSale} - ${s.salePaid} = ${r.saleRem}<br><b>மொத்தம் = ${r.oldRem} + ${r.saleRem} = Rs.${r.total}</b></div>`;
  document.getElementById('rContent').innerHTML=html; document.getElementById('waBtn').onclick=()=>sendWAReport(s.id); document.getElementById('repM').classList.remove('hidden');
}
function quickDateEdit(tid,val){let t=tx.find(x=>x.id==tid); if(!val) return; t.dateISO=val; t.dateStr=new Date(val).toLocaleDateString(); saveMaster(); openRep(t.shopId); render();}
function delTx(tid){if(!confirm('Delete?')) return; let t=tx.find(x=>x.id==tid); let s=shops.find(x=>x.id==t.shopId); if(t.type=='sale') s.totalSale-=t.total; else {if(t.for=='old') s.oldPaid-=t.amount; else s.salePaid-=t.amount;} tx=tx.filter(x=>x.id!=tid); saveMaster(); openRep(s.id); render();}
function openAllReports(){let html=`<div class="overflow-x-auto border-2 rounded-xl"><table class="w-full text-[11px]"><tr class="bg-[#0a5c26] text-white"><th class="p-2 border">Date</th><th class="p-2 border">Name</th><th class="p-2 border">Type</th><th class="p-2 border">Amount</th><th class="p-2 border">Calc</th></tr>${tx.map(t=>`<tr class="${t.type=='sale'?'bg-green-50':'bg-blue-50'}"><td class="p-2 border">${t.dateStr}</td><td class="p-2 border">${t.shopName}</td><td class="p-2 border">${t.type}</td><td class="p-2 border font-bold">Rs.${t.type=='sale'?t.total:t.amount}</td><td class="p-2 border font-mono text-[9px]">${t.calcDetails? t.calcDetails.join('<br>'): t.details||''}</td></tr>`).join('')}</table></div>`; document.getElementById('allRepContent').innerHTML=html||'No data'; document.getElementById('allRepM').classList.remove('hidden');}
function downloadCustomerExcel(){let s=shops.find(x=>x.id==curId); let r=getRem(s); let list=tx.filter(t=>t.shopId==curId); let csv=`Report Sheet - ${s.name} (${s.area})\nPhone,${s.phone}\nOLD,${s.oldBalance}-${s.oldPaid}=${r.oldRem}\nSALE,${s.totalSale}-${s.salePaid}=${r.saleRem}\nTotal,${r.total}\n\nDate,Type,For,Amount,Calculation\n`; list.forEach(t=>{let calc=(t.calcDetails? t.calcDetails.join(' | '): t.details||'').replace(/"/g,'""'); csv+=`"${t.dateStr}","${t.type}","${t.for}","${t.type=='sale'?t.total:t.amount}","${calc}"\n`;}); let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${s.name}_Report_Calc.csv`; a.click();}
function downloadAllExcel(){let csv='Date,Name,Area,Type,For,Amount,Calculation\n'; tx.forEach(t=>{let calc=(t.calcDetails? t.calcDetails.join(' | '): t.details||'').replace(/"/g,'""'); csv+=`"${t.dateStr}","${t.shopName}","${t.area}","${t.type}","${t.for}","${t.type=='sale'?t.total:t.amount}","${calc}"\n`;}); let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='All_Reports_Calc.csv'; a.click();}
function sendWAReport(id){let s=shops.find(x=>x.id==id); let r=getRem(s); let list=tx.filter(t=>t.shopId==id).slice(0,3); let calcText=list.filter(t=>t.type=='sale' && t.calcDetails).map(t=>`${t.dateStr}: ${t.calcDetails.join(', ')} = Rs.${t.total}`).join('\n'); let msg=`🥚 ${s.name} REPORT SHEET\n📱${s.phone}\nOLD: ${s.oldBalance}-${s.oldPaid}= Rs.${r.oldRem}\nSALE: ${s.totalSale}-${s.salePaid}= Rs.${r.saleRem}\nமொத்தம் Rs.${r.total}\n\nCalculation:\n${calcText}`; window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`);}
render();
</script></body></html>
