let tx=JSON.parse(localStorage.getItem('egg_tx')||'[]');
let ls=JSON.parse(localStorage.getItem('egg_shops')||'null'); if(ls&&ls.length>=33) shops=ls;
let curArea='', cur=null, sQ=document.getElementById('search');
function save(){localStorage.setItem('egg_shops',JSON.stringify(shops));localStorage.setItem('egg_tx',JSON.stringify(tx));}
function setArea(a){curArea=a;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on')); if(a=='') document.getElementById('c-all').classList.add('on'); if(a=='Oddamavadi') document.getElementById('c-odda').classList.add('on'); if(a=='Chenkalady') document.getElementById('c-chen').classList.add('on'); if(a=='Eravur') document.getElementById('c-era').classList.add('on'); render();}
function render(){let q=sQ.value.toLowerCase();let list=shops.filter(s=>{let mArea=!curArea||s.area===curArea; let mSearch=!q||s.name.toLowerCase().includes(q); return mArea&&mSearch;});let html='';list.forEach(s=>{let old=s.oldBalance-s.oldPaid,sale=s.totalSale-s.salePaid,tot=old+sale; html+=`<div class="card"><div class="c-head"><div><b>${s.name}</b> <span class="area">${s.area}</span><br><small>${s.phone||''}</small></div><div onclick="editShop(${s.id})" style="font-weight:800">Edit</div></div><div class="boxes"><div class="box">OLD:${old}</div><div class="box s">SALE:${sale}</div></div><div class="total">TOTAL ${tot}</div><div class="actions"><button class="a a-sale" onclick="openM(${s.id})">Sale+</button><button class="a a-paid" onclick="openM(${s.id},true)">Paid</button><button class="a a-wa" onclick="shareCustomer(${s.id})">WhatsApp</button><button class="a a-rep" onclick="doPDF(${s.id})">Report</button></div></div>`;});document.getElementById('list').innerHTML=html;let fOld=shops.reduce((a,s)=>a+s.oldBalance-s.oldPaid,0), fSale=shops.reduce((a,s)=>a+s.totalSale-s.salePaid,0);document.getElementById('fOld').innerText=fOld.toLocaleString();document.getElementById('fSale').innerText=fSale.toLocaleString();document.getElementById('fTot').innerText=(fOld+fSale).toLocaleString();document.getElementById('c-all').innerText=`ALL (${shops.length})`;}
function openM(id){cur=shops.find(x=>x.id==id);document.getElementById('modal').style.display='flex';document.getElementById('mName').innerText=cur.name;document.getElementById('mPhone').innerText=cur.phone+' | '+cur.area;calc();renderTx();}
function closeM(){document.getElementById('modal').style.display='none';}
function calc(){let q240=+document.getElementById('q240').value||0,r240=+document.getElementById('r240').value||33,q260=+document.getElementById('q260').value||0,r260=+document.getElementById('r260').value||32,q280=+document.getElementById('q280').value||0,r280=+document.getElementById('r280').value||28,q300=+document.getElementById('q300').value||0,r300=+document.getElementById('r300').value||30;let tot=q240*r240+q260*r260+q280*r280+q300*r300,eggs=(q240+q260+q280+q300)*30;document.getElementById('salePreview').innerText=`Rs.${tot} | ${eggs} eggs`;return{tot,eggs,q240,r240,q260,r260,q280,r280,q300,r300};}
document.querySelectorAll('#q240,#r240,#q260,#r260,#q280,#r280,#q300,#r300').forEach(e=>e.addEventListener('input',calc));
function doSale(){let d=calc();if(!d.tot)return alert('Qty podunga');cur.totalSale+=d.tot;let det=[];if(d.q240)det.push(`240x${d.q240}`);if(d.q260)det.push(`260x${d.q260}`);if(d.q280)det.push(`280x${d.q280}`);if(d.q300)det.push(`300x${d.q300}`);tx.unshift({id:Date.now(),shopId:cur.id,shopName:cur.name,area:cur.area,type:'sale',total:d.tot,eggs:d.eggs,details:det.join(','),dateStr:new Date().toLocaleDateString('en-GB'),dateISO:new Date().toISOString()});save();render();renderTx();['q240','q260','q280','q300'].forEach(i=>document.getElementById(i).value='');calc();}
function doPay(){let amt=+document.getElementById('payAmt').value||0,forT=document.getElementById('payFor').value;if(!amt)return alert('Amount');if(forT==='old')cur.oldPaid+=amt;else cur.salePaid+=amt;tx.unshift({id:Date.now(),shopId:cur.id,shopName:cur.name,area:cur.area,type:'payment',amount:amt,for:forT,dateStr:new Date().toLocaleDateString('en-GB'),dateISO:new Date().toISOString()});save();render();renderTx();document.getElementById('payAmt').value='';}
function renderTx(){if(!cur)return;let list=tx.filter(t=>t.shopId==cur.id).slice(0,15);let h='';list.forEach(t=>{h+=t.type==='sale'?`<div>🥚 Rs.${t.total} ${t.details} ${t.dateStr}</div>`:`<div>💰 Rs.${t.amount} for ${t.for} ${t.dateStr}</div>`});document.getElementById('tx').innerHTML=h||'No tx';}
function doPDF(id){let s=id?shops.find(x=>x.id==id):cur;if(!s)return;let list=tx.filter(t=>t.shopId==s.id);const{jsPDF}=window.jspdf;let doc=new jsPDF();doc.text(`${s.name} ${s.phone} ${s.area}`,10,10);doc.autoTable({head:[['Date','Type','Details','Eggs','Amt']],body:list.map(t=>t.type==='sale'?[t.dateStr,'SALE',t.details,t.eggs,t.total]:[t.dateStr,'PAY',t.for,'',t.amount]),startY:15});doc.save(s.name+'.pdf');}
function allPDF(){const{jsPDF}=window.jspdf;let doc=new jsPDF();doc.text('All Customers '+new Date().toLocaleDateString('en-GB'),10,10);doc.autoTable({head:[['Name','Area','Phone','OLD','SALE','TOTAL']],body:shops.map(s=>[s.name,s.area,s.phone||'',s.oldBalance-s.oldPaid,s.totalSale-s.salePaid,(s.oldBalance-s.oldPaid)+(s.totalSale-s.salePaid)]),startY:15});doc.save('All_Customers.pdf');}
function editShop(id){let s=shops.find(x=>x.id==id);let n=prompt('Name',s.name);if(n){s.name=n;let ph=prompt('Phone',s.phone);if(ph!==null)s.phone=ph;save();render();}}
function addNew(){let n=prompt('Name?');if(!n)return;let ph=prompt('Phone?')||'';let ar=prompt('Area? Eravur/Oddamavadi/Chenkalady','Eravur')||'Eravur';shops.push({id:Date.now(),name:n,phone:ph,area:ar,oldBalance:0,oldPaid:0,totalSale:0,salePaid:0});save();render();}
function saveBot(){localStorage.setItem('botToken',document.getElementById('botToken').value);localStorage.setItem('chatId',document.getElementById('chatId').value);document.getElementById('botStatus').innerText='Saved!';}

function syncTG(){let token=document.getElementById('botToken').value,chat=document.getElementById('chatId').value;let fOld=shops.reduce((a,s)=>a+s.oldBalance-s.oldPaid,0),fSale=shops.reduce((a,s)=>a+s.totalSale-s.salePaid,0);let msg=`🥚 Eravur Egg%0ATotal Shops:${shops.length}%0AOLD:${fOld}%0ASALE:${fSale}%0ATOTAL:${fOld+fSale}`;if(token&&chat) fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat}&text=${msg}`);document.getElementById('botStatus').innerText='Synced!';}

// *** NEW WHATSAPP SHARE FUNCTIONS ***
function shareCustomer(id){
  let s = id? shops.find(x=>x.id==id) : cur;
  if(!s) return;
  let oldBal = s.oldBalance - s.oldPaid;
  let saleBal = s.totalSale - s.salePaid;
  let total = oldBal + saleBal;
  let list = tx.filter(t=>t.shopId==s.id).slice(0,10);
  let txText = list.map(t=> t.type==='sale' ? `🥚 ${t.dateStr}: Rs.${t.total} (${t.details})` : `💰 ${t.dateStr}: Paid Rs.${t.amount} for ${t.for}` ).join('\n');
  let msg = `🥚 *ERAVUR EGG CENTRE*\n\n*Customer:* ${s.name}\n*Area:* ${s.area}\n*Phone:* ${s.phone}\n\n*OLD Balance:* Rs.${oldBal}\n*SALE Balance:* Rs.${saleBal}\n*TOTAL Pending:* Rs.${total}\n\n*Recent:*\n${txText || 'No transactions'}\n\n${new Date().toLocaleDateString('en-GB')}`;
  if(navigator.share){
    navigator.share({title: s.name, text: msg}).catch(()=> window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank'));
  } else {
    window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');
  }
}
function shareAllSummary(){
  let fOld=shops.reduce((a,s)=>a+s.oldBalance-s.oldPaid,0);
  let fSale=shops.reduce((a,s)=>a+s.totalSale-s.salePaid,0);
  let pendList = shops.filter(s=> (s.oldBalance-s.oldPaid)+(s.totalSale-s.salePaid) > 0).map(s=> `${s.name}: Rs.${(s.oldBalance-s.oldPaid)+(s.totalSale-s.salePaid)}`).join('\n');
  let msg = `🥚 *ERAVUR EGG - ALL PENDING*\n\nShops: ${shops.length}\nOLD: Rs.${fOld}\nSALE: Rs.${fSale}\nTOTAL: Rs.${fOld+fSale}\n\n${pendList}\n\n${new Date().toLocaleDateString('en-GB')}`;
  window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`,'_blank');
}
render();
