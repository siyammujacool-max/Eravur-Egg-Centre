<!DOCTYPE html>
<html lang="ta"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ERAVUR EGG V20</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#fff7ed}
.top{background:#ea580c;color:#fff;padding:14px;text-align:center;font-weight:900;font-size:20px}
.card{background:#fff;margin:12px;padding:14px;border-radius:12px;box-shadow:0 2px 8px #0001}
input,select{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:8px;font-size:15px}
button{width:100%;padding:12px;border:0;border-radius:8px;background:#ea580c;color:#fff;font-weight:800;font-size:16px}
.btn2{background:#16a34a}.btn3{background:#2563eb}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:#fff7ed;padding:12px;border-radius:10px;text-align:center}.box b{font-size:22px;color:#ea580c}
.hidden{display:none}table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid #eee;padding:7px;text-align:left}
.login{max-width:360px;margin:40px auto;padding:20px}.logo{font-size:50px;text-align:center}
</style></head><body>
<div id="loginScreen"><div class="login card">
<div class="logo">🥚</div><h2 style="text-align:center">ERAVUR EGG</h2>
<p style="text-align:center;color:#666">V20.0.1 - Login</p>
<input id="u" placeholder="Username - eravur">
<input id="p" type="password" placeholder="Password - 1234">
<button onclick="login()">LOGIN</button>
<p id="msg" style="text-align:center;color:red"></p>
</div></div>
<div id="app" class="hidden">
<div class="top">🥚 ERAVUR EGG - V20.0.1 <span style="float:right;font-size:13px" onclick="logout()">Logout</span></div>
<div class="grid" style="padding:12px 12px 0">
<div class="box">Today Sale<b id="tSale">0</b><br><small>eggs</small></div>
<div class="box">Stock<b id="tStock">0</b><br><small>eggs</small></div>
<div class="box">Cash<b id="tCash">Rs 0</b></div>
<div class="box">Credit<b id="tCredit">Rs 0</b></div>
</div> <div class="card"><h3>➕ New Sale</h3>
<select id="cust"><option>Walk-in Customer</option><option>Hotel - Eravur</option><option>Shop - Kalmunai</option><option>Shop - Batticaloa</option></select>
<input id="qty" type="number" placeholder="Eggs Qty - ex: 30">
<input id="price" type="number" value="55" placeholder="Price per egg">
<select id="pay"><option value="cash">Cash</option><option value="credit">Credit</option></select>
<button class="btn2" onclick="addSale()">SAVE SALE ✅</button>
</div>

<div class="card"><h3>🥚 Stock Add</h3>
<input id="sQty" type="number" placeholder="Stock Qty - ex: 1000">
<button class="btn3" onclick="addStock()">ADD STOCK</button>
</div>

<div class="card"><h3>📋 Today Sales List</h3>
<table><thead><tr><th>Customer</th><th>Qty</th><th>Total</th><th>Pay</th></tr></thead><tbody id="list"></tbody></table>
<button onclick="clearAll()" style="background:#dc2626;margin-top:10px">Clear All Data</button>
</div>
</div> <script>
let sales=JSON.parse(localStorage.getItem('v20_sales')||'[]');
let stock=parseInt(localStorage.getItem('v20_stock')||'5000');
function login(){
 if(document.getElementById('u').value=='eravur' && document.getElementById('p').value=='1234'){
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden'); render();
 } else { document.getElementById('msg').innerText='Wrong Username / Password da!'; }
}
function logout(){ location.reload(); }
function save(){ localStorage.setItem('v20_sales',JSON.stringify(sales)); localStorage.setItem('v20_stock',stock); }
function addSale(){
 let q=parseInt(document.getElementById('qty').value||0), pr=parseInt(document.getElementById('price').value||55);
 if(q<=0){ alert('Qty podu da!'); return; }
 if(q>stock){ alert('Stock illa da! Stock: '+stock); return; }
 let c=document.getElementById('cust').value, pay=document.getElementById('pay').value;
 sales.unshift({c:c,q:q,total:q*pr,pay:pay}); stock-=q; save(); render();
 document.getElementById('qty').value=''; alert('Sale Saved da! Rs '+(q*pr));
}
function addStock(){ let q=parseInt(document.getElementById('sQty').value||0); if(q<=0) return; stock+=q; save(); render(); alert('Stock Added!'); }
function clearAll(){ if(confirm('Clear pannattuma?')){ sales=[]; stock=5000; save(); render(); } }
function render(){
 let ts=0, tc=0, tcr=0; sales.forEach(s=>{ ts+=s.q; if(s.pay=='cash') tc+=s.total; else tcr+=s.total; });
 document.getElementById('tSale').innerText=ts; document.getElementById('tStock').innerText=stock;
 document.getElementById('tCash').innerText='Rs '+tc; document.getElementById('tCredit').innerText='Rs '+tcr;
 document.getElementById('list').innerHTML=sales.map(s=>`<tr><td>${s.c}</td><td>${s.q}</td><td>Rs ${s.total}</td><td>${s.pay}</td></tr>`).join('')||'<tr><td colspan=4 style="text-align:center">No sales yet</td></tr>';
}
</script></body></html>
